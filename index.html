["父親寫信給兒子，可使用「順問近祺」","學生寫信給老師，可使用「敬請台安」","朋友寫信給朋友，可使用「順頌時綏」","兒子寫信給父親，可使用「叩請金安」"],"B"],[108,0,7,"江南風俗，兒生一期，為製新衣，盥浴裝飾，男則用弓矢紙筆，女則刀尺鍼縷，並加飲食之物，及珍寶服玩，置之兒前，觀其發意所取，以驗貪廉愚智。（《顏氏家訓・風操》）根據上文，描述的是何種習俗？",["慶生","抓周","收涎","乞巧"],"B"],[108,0,8,"荀子思想中，「天」是指純粹的自然現象。下列選項，何者符合荀子「天」的意義？",["仁義忠信，樂善不倦，此天爵也","天之生斯民也，使先知覺後知，使先覺覺後覺","心之官則思，思則得之，不思則不得也。此天之所與我者","天行有常，不為堯存，不為桀亡。應之以治則吉，應之以亂則凶"],"D"],[108,0,9,"《論語．泰伯》：「如有周公之才之美，使驕且吝，其餘不足觀也已。」論及人才的核心品格，與引文最相近的選項是：",["無伐善，無施勞","其身正，不令而行","不忮不求，何用不臧","舉一隅不以三隅反，則不復也"],"A"],[108,0,10,"「大人者不失其赤子之心，……沒有一部歷史像《史記》這樣去寫遊俠、刺客、酷吏，寫得這樣好看而具有文學性。從來我不相信仇憤或壓迫的情緒可以寫出好文章，便連若干人喜歡講的『救贖感』或『憂患意識』，恐怕都嫌造作。對生命的喜悅，以及對物質世界的喜悅，正是這樣的赤子之心，它不但在創作上成為不竭的泉源，也使人在人生的驚濤駭浪中亦能不憂、不懼。」根據上文，下列選項敘述正確的是：",["赤子之心是作者消除憂患意識或造作虛假的原動力","司馬遷因為不失赤子之心，方有《史記》這部鉅作","《史記》中遊俠、刺客，都具備赤子之心的救贖感","不去掩飾或壓抑心中的物欲，才真能尋回赤子之心"],"B"],[108,0,11,"曾子曰：「以能問於不能；以多問於寡；有若無，實若虛；犯而不校。昔者，吾友嘗從事於斯矣！」（《論語．泰伯》）引文強調的人格特質是：",["不忮不求","嚴以律己","好學不輟","謙沖為懷"],"D"],[108,0,12,"承上題，曾子所論之人應為：",["季路","顏淵","子夏","宰予代號：1501頁次：4－2"],"B"],[108,0,13,"子曰：「里仁為美。擇不處仁，焉得知？」下列選項，何者與引文旨意最為接近？",["白沙在涅，與之俱黑","同聲相應，同氣相求","如切如磋，如琢如磨","桃李不言，下自成蹊"],"A"],[108,0,14,"凡事皆貴專。求師不專，則受益也不入；求友不專，則博愛而不親。心有所專宗，而博觀他塗，以擴其識，亦無不可。無所專宗，而見異思遷，此眩彼奪，則大不可。（曾國藩《曾文正公家書》）根據上文，下列選項正確的是：",["擇師問學須專誠，才能深受其益","交友從遊須博愛，不應過於親暱","心志必須專一，不適宜廣泛閱讀","博觀擴識者，易眩奪而難成大事"],"A"],[108,0,15,"（羊祜）每與吳人交兵，剋日方戰，不為掩襲之計。……祜出軍行吳境，刈穀為糧，皆計所侵，送絹償之。每會眾江沔游獵，常止晉地。若禽獸先為吳人所傷而為晉兵所得者，皆封還之。於是吳人翕然悅服，稱為羊公。……祜與陸抗相對，使命交通，抗稱祜之德量……。抗嘗病，祜饋之藥，抗服之無疑心。人多諫抗，抗曰：「羊祜豈鴆人者！」（《晉書‧羊祜傳》）下列選項，何者正確？",["羊祜愛惜陸抗之材，表面為敵實則為友","羊祜認為百姓無辜，故友善待吳國軍民","羊祜採取以德服人，希望藉此戰勝吳國","羊祜採主和不主戰，相互尊重和平共處"],"C"],[108,0,16,"齊王使使者問趙威后。書未發，威后問使者曰：「歲亦無恙耶？民亦無恙耶？王亦無恙耶？」使者不悅，曰：「臣奉使使威后，今不問王，而先問歲與民，豈先賤而後尊貴者乎？」威后曰：「不然！茍無歲，何以有民？茍無民，何以有君？故有問舍本而問末者耶？」（《戰國策．齊策》）下列選項，最符合引文意旨的是：",["民惟邦本，本固邦寧","王者不卻眾庶，故能明其德","無故而動民，又悚以軍法，則民將不安","居廟堂之高，則憂其民；處江湖之遠，則憂其君"],"A"],[108,0,17,"古人常以「夢」來抒懷，如謂：「雞鳴枕上，夜氣方回，因想余生平，繁華靡麗，過眼皆空，五十年來，總成一夢。」（張岱〈陶庵夢憶自序〉）下列選項，最接近作者之意的是：",["同床異夢","癡人說夢","飛熊入夢","黃粱一夢"],"D"],[108,0,18,"「為了他人而忘卻自我，他們便會記得你。」下列選項與此句文意最相近的是：",["犧牲小我，完成大我","大道之行也，天下為公","以其終不自為大，故能成其大","先天下之憂而憂，後天下之樂而樂"],"C"],[108,0,19,"「藝術追求完美，但是如果藝術家『除非完美，絕不創作』，可能終身一事無成。科學家也在追求一種完美，但是有的科學發明，第一次研發有成時，可能太龐大，也可能太簡單，不是效率太低，就是不夠安全。有些發明甚至集各種缺點於一身，簡直一無是處，但是科學家還是把它先做出來，然後再慢慢想辦法改進。」引文主旨在說明：",["十年磨一劍，若非完美無瑕，絕不輕言出手","天下無難事只怕有心人，堅持不懈以臻完美","完美非一蹴可幾，是在不斷嘗試改進中成就","缺點是邁向完美成功的起點，不可輕易忽略"],"C"],[108,0,20,"「據說愛因斯坦穿著舊西裝出席諾貝爾獎得主的演講會議，並回絕了人家遞給他的全新西裝；德國總理派官員來訪，愛因斯坦的夫人催促他換上正式的衣服會面，愛因斯坦卻說：『若要見我，人在這裡；若要看我的衣服，則在衣櫃裡。』」根據上文，下列何者最能展現愛因斯坦的人格特質？",["放蕩不羈","率真樸實","耿介不屈","倨傲鮮腆"],"B"],[108,0,21,"一人貧苦特甚，生平虔奉呂祖。祖感其誠，一日忽降至其家，見其家徒四壁，不勝憫之，因伸一指，指其庭中磐石。俄頃，粲然化為黃金，曰：「汝欲之乎？」其人再拜曰：「不欲也。」呂祖大喜，謂：「子誠能如此，無私心也，可授以大道。」其人曰：「不然，吾心欲汝此指頭也。」如就貶抑角度評論文中此人，下列何者最適宜？",["得寸進尺","得魚忘筌","朝三暮四","見異思遷"],"A"],[108,0,22,"承上題，如從勸誡角度評論本文意旨，下列文句何者最適合？",["神仙難措手","人心不足蛇吞象","道高一尺，魔高一丈","補漏趁天晴，未渴先掘井"],"B"],[108,0,23,"「告訴你『結論』或『答案』和教導你如何『思維』與『創造』，是截然不同的兩回事，但卻都是可以同時在一本書中，同一個作品中發生。從前者而言，所有的經典著作，都不免是已成『明日黃花』的『資訊』；從後者而言，則經典性著作之所以為經典性著作，正因為它『萬古常新』的、開啟未來無限的心靈提升與思維，刺激預示了未來無盡的精神創造……不論在文化上、人格上，或者日常生活上。」依據上文，下列敘述最正確的是：",["具啟發性的作品沒有明確的結論","經典的閱讀可提升思維與創造力","經典之為經典貴在資訊不斷翻新","經典著作所記載的訊息永不過時"],"B"],[108,0,24,"《論語．述而》：「子在齊聞韶，三月不知肉味。曰：『不圖為樂之至於斯也！』」說明「音樂感人至深」，下列選項中的文句，何者有此意涵？",["豈無山歌與村笛？嘔啞嘲哳難為聽","嘈嘈切切錯雜彈，大珠小珠落玉盤","若奏琴箏而和笙竽，清耳悅心，聽者為娛","昔者瓠巴鼓瑟，而流魚出聽；伯牙鼓琴，而六馬仰秣代號：1501頁次：4－3"],"D"],[108,0,25,"梁園日暮亂飛鴉，極目蕭條三兩家。庭樹不知人去盡，春來還發舊時花。（岑參〈山房春事〉）本詩表達的情感是：",["嗟嘆冬去春來，韶光易逝","悵惋地老天荒，一往情深","痛心門庭冷落，世態炎涼","感慨物是人非，盛衰無常"],"D"],[108,0,26,"某電影中有句臺詞：「曾經牽掛，才能了無牽掛。」下列選項所表達的情感與此最接近的是：",["曾經滄海難為水，除卻巫山不是雲","人到情多情轉薄，而今真個不多情","此情可待成追憶，只是當時已惘然","無情不似多情苦，一寸還成千萬縷"],"B"],[108,0,27,"「太陽就是我們的本來面目，烏雲則是人類特有的各種心理活動。所以，唯有在定靜、沉寂之中，當心裡的各種噪音平靜下來，也就是烏雲散開的時候，你就會看到自己的真實本性。」這段話所要闡述的意義是：",["情緒如烏雲一般干擾我們，讓我們無法安寧，所以我們不可以有情緒","只要我們願意安靜沉澱自己，讓自己安定下來，就會回歸本性應有的寧靜","我們的本性乃是太陽與烏雲的結合體，所以情緒時好時壞，可以不必在乎","我們的本性如太陽般光明，雖有種種心理活動，只要不受情緒干擾，可以不必管它"],"B"],[108,0,28,"「隨著年齡的增長，人生經驗越來越豐富，人類的情緒越來越多元、越複雜，如何準確傳達自己的情感，就成了生活的重要課題。抒情力是指了解自己的感受，也能體察他人的情感，熟悉人與人的巧妙互動；以及知道如何抒發自己的感情，才能產生同理心去理解別人的感受。文學家擅長探究事情的意義，以及發覺微細的心靈境界，人與自然萬物，人與人之間的巧妙互動，透過文學家的描繪，那似有若無的感情便具體起來。」依據上文，下列敘述何者錯誤？",["抒情力是指在細微事物間發覺意義與目的的能力","人類情緒越來越多元複雜，傳達情感很困難，所以需要文學家","知道如何抒發自己的感情，也才能產生同理心去理解別人的感受","文學家擅長探究事情的意義，透過文學家的描繪，感情便具體起來"],"B"],[108,0,29,"《論語．為政》：「君子周而不比，小人比而不周。」文中的君子，表現出何種人格特質？",["圓融而不偏私","待人面面俱到","不願爭勝比較","行事慷慨寬容"],"A"],[108,0,30,"「傾聽是需要學習的，而有效的傾聽則需要用心、欣賞及肯定。要成為一位好的傾聽者，你必須懂得適時擱置自己的需求，讓說話者充分地將想表達的想法或情緒抒發出來；全神貫注在傾聽這件事上，表示好奇及關心；要有同理心，也就是對他人的感受採取一種開放的態度，欣賞他的觀點、肯定他的情緒，而不加入自己的批判。」本文主旨在論述：",["傾聽的態度","傾聽的魅力","傾聽的好處","傾聽的力量"],"A"],[108,0,31,"「太初的時候，意象與心智之間沒有白翳。心智不用費力，一切都是清明的。人慢慢有了知識，便有了偏見、好惡、恐懼、希求，晴朗的宇宙才變成渾沌，心智才不得不無休無盡地辛勞！」下列選項，何者與本文意旨不符？",["太初與心智之間原本沒有隔閡","心智原本是清明、不用費力的狀態","渾沌在太初時期即層層包裹住心智","偏見、好惡、恐懼、希求造成心智障蔽"],"C"],[108,0,32,"「銀髮族有特殊的心理及生理需求，如何運用高科技來協助解決其面臨的問題，產政學研應攜手努力。基本上，老人的生理需求在於維持或輔助生活的自立；心理需要在於排遣寂寞、追求年輕活力及把握生命剩餘的時間。如何尋求創新前瞻的銀髮生理及心理的解決方案或服務，無論是從產業效益或社會價值而言，政府都應積極投入。」下列選項，最符合本文所述「銀髮族需求」的是：",["銀髮族之生理需求，在於追求延年益壽的健康偏方","銀髮族之心理需求，在於維持及輔助經濟的安全感","產政學研應聯手解決銀髮族生理、心理需求之問題","政府應該積極投入銀髮族商機之開發、研究與應用"],"C"],[108,0,33,"下列關於公文格式的敘述，何者錯誤？",["根據不同層級的發文與受文單位，發文字號有時亦可不填寫","公文如有附件時，應於「附件」欄註明內容名稱及其他有關字樣","密等與解密條件，分為「絕對機密」、「極機密」、「機密」、「密」","速別是指希望受文機關辦理的速度，如「最速件」、「速件」或「普通件」"],"A"],[108,0,34,"會稿應注意事項，下列敘述何者錯誤？",["非政策性之緊急文稿，為爭取時效，得先發後會","會稿單位對於文稿有不同意見時，應由主辦單位自行修改後，不必再送","各單位於其他單位送會之簽稿，如有意見應即提出，一經會簽，應共同負責","凡先簽後稿之案件已於擬辦時會核者，如稿內所敘與會核時並無出入，應不再送會"],"B"],[108,0,35,"下列何者並非「公告」該有的結構？",["主旨","依據","擬辦","公告事項代號：1501頁次：4－4二、複選題（第36題至第45題，占30分）說明：每題3分，所列的五個選項，其中至少有二個是正確答案。各題之選項獨立判定，全部答對者，得3分；答錯一個選項者，得1.8分；答錯二個選項者，得0.6分；所有選項均未作答或答錯多於二個選項（不含二個）者，該題以零分計算。"],"C"],[108,0,36,"某甲升遷新職，寫簡訊告知好友。下列選項用語正確的是：",["本人於五月一日高升，至某某單位擔任課長一職","本人於五月一日赴某某單位履新，擔任課長一職","本人於五月一日調任至某某單位，擔任課長一職","本人於五月一日左遷，至某某單位擔任課長一職","本人於五月一日榮膺新職，至某某單位擔任課長"],"BC"],[108,0,37,"阿里山上可以賞月、看日出的民宿即將開幕，下列對聯何者適合張貼在民宿門口？",["輔世匡時須博學，仁民愛物自修身","更上一層看日出，高懸百尺與雲浮","波寬好看魚龍化，天遠空憐雁鶩群","最喜座中先得月，不妨睡處也看山","全以山林為眼界，別有天地非人間"],"BDE"],[108,0,38,"下列成語，何者和「奮發有為、努力向上」之意有關？",["好高騖遠","乘風破浪","奮翅鼓翼","青雲之志","飛黃騰達"],"BCD"],[108,0,39,"《三國演義》中，南蠻王孟獲屢次侵略蜀地，諸葛亮親征，數敗孟獲，七擒七縱。諸葛亮的用意何在？",["拋磚引玉","欲擒故縱","以德服人","攻心為上","耀武揚威"],"BCD"],[108,0,40,"支公好鶴，住剡東山卬山，有人遺其雙鶴。少時翅長欲飛，支意惜之，乃鎩其翮。鶴軒翥不復能飛，乃反顧翅垂頭，視之如有懊喪意。林曰：「既有凌霄之姿，何肯為人作耳目近玩！」養令翮成，置使飛去。（《世說新語．言語》）下列選項何者符合文意？",["不可玩物喪志","強調天道無親","反對揠苗助長","順應自然天性","踐行推己及物"],"DE"],[108,0,41,"「很少有食物像月餅一樣，既浪漫美麗又俗儈不堪，它不僅是應節食品，更是人際儀式的祭品，餡內包藏著複雜的社交權力關係。一般人買年糕、湯圓、粽子和紅龜糕粿等過節食品，總是帶回家吃，但月餅卻買來送人或被送，甚或多次轉送，形成一種流動的再分配，而不管最後失蹤或留下，月餅都因而衍生出複雜的交換價值。而且湯圓、粽子一年到頭有得買，儀式意義逐漸流失，月餅卻是人情世故的特殊期貨，必須掌握契機，及時交易。一俟農曆八月十六就全面崩盤，充滿時令的儀式性。」根據上文，下列選項敘述正確的是：",["月餅形式不斷推陳出新，顯得俗儈不堪","月餅聯繫人情世故，是與市場價格有關","隨時可買的湯圓、粽子逐漸流失時令的儀式性","由於人情世故，月餅衍生出了社交權力關係的涵義","由於民間傳說，月餅在應節食品中成為人際儀式的祭品"],"CD"],[108,0,42,"「庭中有奇樹，綠葉發華滋。攀條折其榮，將以遺所思。馨香盈懷袖，路遠莫致之。此物何足貴，但感別經時。」下列選項的敘述，何者符合此詩的情境？",["如膠似漆，濃情蜜意","深衷淺貌，語短情長","羈旅愁懷，憫亂思歸","折花寄思，情感溫厚","人生苦短，及時為樂"],"BD"],[108,0,43,"「四年前一回旅居，結交了這些在地朋友後，遂常有連絡。難得路過，一定去拜訪，或者寄一二本自己允當的創作，請其指教。他們也常寄送地方物產，跟我分享時令收成。我藉著一物一產的悉心食用，懷念小鎮的豐饒；他們則以物產的各方遞送，繼續告知小鎮的美好韶光。」下列選項符合文意的是：",["禮尚往來","以文會友","以友輔仁","好東西要和好朋友分享","人情留一線，日後好相見"],"ABD"],[108,0,44,"公務人員對於長官應有的態度，下列選項何者合適？",["偷合苟容以持祿養交","忠信而不諛，諫爭而不諂","朋黨比周，以環主圖私為務","不肯盡節，容容乎與世沉浮上下","義不苟合，位不苟尊；必有益於國，必有補於上"],"BE"],[108,0,45,"「人人不愛管閒事，閒事沒有人管，大家就都不講求公德心和責任感了。例如有人在公車上抽煙，有人在公園裡採花折樹，有人在大街上亂丟垃圾，甚至有人在光天化日下追殺，在蒼茫暮色裡施暴……，這一切都被當作是閒事。因為是閒事，大家都袖手旁觀，不願管，不肯管，也不敢管，就任這些閒事污染環境，為害社會。」根據上文，下列敘述符合本文觀點的是：",["所謂「管閒事」乃指沒事找事，干預他人的事情與生活","現代人應熱心關懷公益，多與他人溝通，增進彼此感情","現代人應秉持勇氣與良知，發揚公德心，負起社會責任","歹徒敢肆無忌憚為所欲為，乃因大眾不懂法律、怕惹事","感嘆社會人心冷漠，只顧自掃門前雪，不管他人瓦上霜"],"CE"],[108,1,1,"美國心理學家米德（G. Mead）所談到的「我」當中，屬於個人本能的、獨特的自然特性，是主動的、自發創造的部分，稱為什麼？",["主我","客我","本我","超我"],"A"],[108,1,2,"德國嘻哈學院（HipHop Academy Hamburg）每年舉辦嘻哈文化免費培訓計畫，鼓勵年輕人透過肢體表達意念，透過上百場活動與社會互動，將青少年街舞結合古典音樂製作舞台劇，讓嘻哈文化成為在地特色。下列敘述何者最能說明此一現象？",["主流文化是由精緻文化所主導","官方文化主導流行文化的發展","精緻文化轉變為流行文化符號","邊緣文化結合精緻文化的創新"],"D"],[108,1,3,"托育政策催生聯盟針對少子化問題，向政府提出托育三隻箭：包括加碼托育補助、建立褓姆遴選制、推廣公共褓姆。下列關於「托育政策催生聯盟」的相關敘述，何者正確？",["透過倡議以發揮輿論的力量，有助於社會立法","屬自主性的活動，參與者擁有豐沛的政治力","活動須有來自於第二部門的經濟力才得以運作","表達對政府施政不滿，展現由上而下的社會力"],"A"],[108,1,4,"據報載：日本一名7歲男童隨父母到山上遊玩，父母為處罰不聽話的孩子，把他獨留在野熊棲息地的路邊，男童躲避至避難小屋，並堅信父母會回來找他，最後在搜救人員連日搜索後總算獲救。依心理學家安斯渥（Mary Ainsworth）對依附型態的分類，上述男童與家人的依附關係，應屬於下列何種類型？",["安全型","逃避型","混亂型","焦慮矛盾型"],"A"],[108,1,5,"艾瑞克森（E.Erikson）提出「心理社會發展階段」，是自我發展與成長的重要理論。下列有關該理論的敘述，何者正確？",["不同發展階段中，「父母親」始終扮演關鍵重要他人角色","各階段皆有其發展任務，完成自我實現 開張大吉／新店","陰陽湖泊／日月潭"],"B"],[107,0,9,"「讀孔子遺書惟愛春秋一部，存漢家正統豈容吳魏三分。」依據本聯，下列選項描述同一人物的是：",["一張用赤膽染紅的臉／早已流傳成千古的傳奇","空流了太子的熱淚，一滴滴／隨森冷的易水，辜負了渡頭","這人一朝是／東京八十萬禁軍教頭／如今行船悄悄／向梁山落草","他是黑夜中／陡然迸發起來的／一團天火／從江東熊熊焚燒到阿房宮"],"A"],[107,0,10,"下列選項中的植物，與女子年齡有關的是：",["荳蔻","木棉","玫瑰","芙蓉"],"A"],[107,0,11,"「去！汝鄙人也，何問之不豫也！予方將與造物者為人，厭，則又乘夫莽眇之鳥，以出六極之外，而遊無何有之鄉，以處壙埌之野。」依據上文所述，最接近那一家思想？",["儒家","道家","墨家","農家"],"B"],[107,0,12,"君子曰：「□□□□，盟無益也。《詩》云：『君子屢盟，亂是用長。』無信也。」（《左傳．桓公十二年》）上文空缺處，應填入的選項是：",["袖手旁觀","喋喋不休","唇亡齒寒","苟信不繼"],"D"],[107,0,13,"「惠子（施）謂莊子曰：『魏王貽我大瓠之種，我樹之成而實五石。以盛水漿，其堅不能自舉也；剖之以為瓢，則瓠落無所容。非不呺然大也，吾為其無用而掊之。』莊子曰：『夫子固拙於用大矣……今子有五石之瓠，何不慮以為大樽而浮乎江湖，而憂其瓠落無所容？則夫子猶有蓬之心也夫！』」（《莊子．逍遙遊》）惠施之所以掊壞大瓠，原因在於：",["大瓠無法順利製作成為容器","大瓠採收後因體積太大而無法使用","大瓠製作而成的大樽無處能夠容納","大瓠的中心已被蓬草充填而無法使用"],"B"],[107,0,14,"承上題，莊子給予惠施的建議，最核心的概念是什麼？",["同理之心","追根溯源","破除陳見","直覺頓悟代號：1501頁次：4－2"],"C"],[107,0,15,"「十年生死兩茫茫，不思量，自難忘。千里孤墳，無處話淒涼。縱使相逢應不識，塵滿面，鬢如霜。夜來幽夢忽還鄉，小軒窗，正梳妝。相顧無言，惟有淚千行。料得年年腸斷處，明月夜，短松岡。」（宋．蘇軾〈江城子〉）關於此詞，下列敘述何者錯誤？",["「十年生死兩茫茫」的「茫茫」寓含無限空虛惆悵的情感","「不思量，自難忘」，表現作者的豁達灑脫，縱使舊情深刻難忘，卻也無需思量","「塵滿面，鬢如霜」，勾勒出自己的外貌，也反映出仕途的困頓使作者容顏過早衰老","「相顧無言，惟有淚千行」，此一無聲有淚的描寫，頗有「此時無聲勝有聲」的藝術效果"],"B"],[107,0,16,"承上題，下列文句何者屬於「夢境」的描述？",["千里孤墳，無處話淒涼","縱使相逢應不識，塵滿面，鬢如霜","料得年年腸斷處，明月夜，短松岡","小軒窗，正梳妝。相顧無言，惟有淚千行"],"D"],[107,0,17,"下列選項有涉及「聽覺」的是：",["自古逢秋悲寂寥，我言秋日勝春朝","山光照檻水繞廊，舞雩歸詠春風香","接天蓮葉無窮碧，映日荷花別樣紅","村舍外，古城旁，杖藜徐步轉斜陽"],"B"],[107,0,18,"孔子自衛反魯，過隱谷之中，見薌蘭獨茂，喟然嘆曰：「夫蘭當為王者香，今乃獨茂，與眾草為伍，譬猶賢者不逢時，與鄙夫為倫也。」本文借物託寓，其主旨為：",["蘭花落難，如人落井下石","蘭花獨開，如人孤芳自賞","蘭與草木雜生，如人與世浮沉","蘭與群草為伍，如人不用於世"],"D"],[107,0,19,"下列辛棄疾詞，何者顯見投閒置散，無法建功立業的慨歎？",["青山遮不住，畢竟東流去。江晚正愁余，山深聞鷓鴣","而今識盡愁滋味，欲說還休。欲說還休，卻道天涼好個秋","何處望神州？滿眼風光北固樓。千古興亡多少事？悠悠，不盡長江滾滾流","馬作的盧飛快，弓如霹靂弦驚。了卻君王天下事，贏得生前身後名。可憐白髮生"],"D"],[107,0,20,"「下大雨，有人打著傘，有人沒帶傘。沒傘的挨著有傘的，鑽到雨傘底下去躲雨，多少有點掩蔽，可是傘的邊緣滔滔流下水來，反而比外面的雨更來得凶。擠在傘沿下的人，頭上淋得稀濕。」根據上文，可以引伸出的意思是：",["世態炎涼，冷暖自知","自私自利，是人性的本能","窮人攀援富人，未必得到好處","對敵人仁慈，就是對自己殘忍"],"C"],[107,0,21,"華歆、王朗俱乘船避難，有一人欲依附，歆輒難之。朗曰：「幸尚寬，何為不可？」後賊追至，王欲舍所攜人。歆曰：「本所以疑，正為此耳。既已納其自託，寧可以急相棄耶？」遂攜拯如初。世以此定華、王之優劣。（《世說新語．德行》）根據上文，下列選項正確的是：",["華歆不輕諾，前倨後恭","王輕諾寡信，為德不卒","王見義勇為，善始善終","華遇難救人，始終如一"],"B"],[107,0,22,"某次孔子病得很重，子路非常關心孔子的病情，就請求代夫子祈禱於神衹，孔子問說：「有這樣的事嗎？」子路回答說：「有的，誄詞有云：『為您向天地神衹祈禱。』」孔子聽了就說：「丘之禱久矣。」孔子這句話表面上的意思是說，他本人已經向上蒼祈禱過很久了，……則是話中有話。其內在深層的涵義是，求人（神明）不如求己，或者說，仰不愧於天，俯不怍於人，何需有求於鬼神。依據上文，下列敘述最正確的是：",["作者認為孔子的回答出於內心想法，沒有任何反諷意味","作者認為孔子反躬自省、禱告已久，鬼神一定善加保祐","作者指出修養應該反求諸己，問心無愧，不必求人問神","作者認為修養應敬畏神明、反躬自省，仰不愧而俯不怍"],"C"],[107,0,23,"蘇東坡不追求政事，卻為政界所追逐，實在是一個有趣的現象。王安石當權，他在政界失敗還不為奇，他自己的黨人得勢，他仍然「不成功」，可就令人吃驚了。蘇東坡向來不是好黨人，因為他做人的格調太高。同黨當道，他自己又享盛名和高位，連太后都佩服他，他卻一直想放棄這個受人羨妒的官職。他沒有立刻如願，不過凡是知道蘇東坡脾氣的人都可以看出，他不會永留政壇。延年術的第一道法則就是避免一切情緒干擾，而蘇東坡對政壇他所謂的「姦小之境」卻有不少情緒的紛爭。政治遊戲對於愛好此道的人頗有魅力；對於不想統治別人的人來說，失去人類尊嚴以換取權勢和浮名實在太不值得了。依據上文，下列選項敘述正確的是：",["同黨的王安石失敗，導致蘇東坡無法在政壇成功","蘇東坡自知不是好黨人，所以想放棄盛名和高職","蘇東坡醉心於延年長壽之術，所以無心躋身公卿","與其爭取權勢與浮名，蘇東坡寧可保有人的尊嚴"],"D"],[107,0,24,"「都市裡的植物園，通常作為都市人休憩的所在，往往被過度的控管，樹木枝葉被修剪，樹與樹之間距離被算計，所有原始的林木裡面該有的熱鬧、紛亂，感覺全然不見。不過當我進入這座植物園時，就立刻被眼前這些古老的參天巨樹所撼，不自覺出聲驚呼。園外是車水馬龍的柏油路面，可是只要一進到園內，走入一二十公尺，只見那巨大的樹叢底下，錯綜複雜的植物欣欣向榮；因為沒有人為的干擾，生長得茂密無比，簡直就像是一座天然的森林。那充滿原始的、自然的、粗曠的氣息，立刻帶我遠離塵囂，進入了充滿原始生態的環境。」綜觀上文的意旨，與下列何者最相近？",["主張都市人應遁世離群，回到山林","讚嘆植物園無過多人為斧鑿的痕跡","植物園規劃應以休憩為主，確保品質","對於原始森林受到開墾破壞，表達惋惜代號：1501頁次：4－3"],"B"],[107,0,25,"「很厚的雲層開始滴雨的一個清晨，從東郊入城的叉路口，發生了一起車禍：一輛墨綠的賓字號轎車，像一頭猛獸撲向小動物，把一部破舊的腳踏車，壓在雙道黃色警戒超車線的另一邊。露出外面來的腳踏車後架，上面還牢牢地綁著一把十字鎬，原來結在把手上的飯包，和被拋在前頭撒了一地飯粒，唯一當飯包菜的一顆鹹蛋，撞碎在和平島的沿下。雨越下越大，轎車前的一大灘凝固的血，被沖洗得幾將滅跡。幾個外國和本地的憲警，在那裏忙著鑑定車禍的現場。」依據上文，下列選項錯誤的是：",["撞人的是外國人，所以鑑定車禍現場有外國憲警","車禍現場，撞人的是富人，因為開著Benz賓士轎車","撞人的是軍人，因為開著墨綠色轎車，鑑定車禍現場的人裡有憲警","被撞的是貧窮的工人，因為他帶著十字鎬，跟只有一顆鹹蛋當菜的飯包"],"B"],[107,0,26,"《紅樓夢．第六回劉姥姥一進榮國府》劉姥姥「聽見『咯當』、『咯當』的響聲，大有似乎打籮櫃篩麵的一般，不免東瞧西望的。忽見堂屋中柱子上掛著一個匣子，底下又墜著一個秤砣般一物，卻不住的亂幌。劉姥姥心中想著：『這是什麼愛物兒？有甚用呢？』正呆時，只聽得『當』的一聲，又若金鐘銅磬一般，不防倒唬的一展眼。接著又是一連八九下。」文中劉姥姥所見，應是西洋的何物？",["吊燈","掛鐘","樂器","鈴鐺"],"B"],[107,0,27,"趙翼〈詩論〉：「李杜詩篇萬口傳，至今已覺不新鮮。江山代有才人出，各領風騷數百年。」下列選項對本詩的敘述，何者正確？",["詩歌體式陳舊亟需改進","李杜詩作是容易超越的","李杜詩作令人食之無味","詩歌創作待後人開新局"],"D"],[107,0,28,"歐陽修〈蝶戀花〉：「淚眼問花花不語，亂紅飛過秋千去。」有層層深入的妙處，淚眼而問花，是無人可告訴，一層；花不能語，不得花的同情，二層；亂紅飛，花自己也凋謝了，三層；花被風吹過秋千去，秋千是她和丈夫舊時嬉遊之處，觸動愁恨，不堪回首，四層。根據上文，下列選項敘述正確的是：",["「亂紅飛」意近「風行草偃」","「花不語」意指「草木無情」","「秋千」借指「景物依舊，人事已非」","「淚眼問花」意近「落花有意，流水無情」"],"C"],[107,0,29,"從小，父母親常帶我到市區一家日本料理店用餐，每次去，父親都點大同小異的幾樣料理，外加一點點酒。和善的老闆親切地用日語和父親交談。坐在窗明几淨的店裡，我常想這寧靜的家庭之餐是人生最大的幸福。結婚後，我也常帶著妻子、女兒去這家店裡吃，只是現在換成老闆的兒子用臺語和我招呼交談。我也跟父親一樣點大同小異的幾樣料理，外加一點點酒。坐在熟悉的、安適的店裡，我真希望好景常在。閱讀上文，下列敘述何者最貼近作者的感受？",["幸福彈指間過","家常美食迷人","依戀溫情好景","父愛複製有方"],"C"],[107,0,30,"下列選項，藉擬人的手法描摹聲音的是：",["站在這座城的制高點上，四下無人，只有風聲疾疾幾乎讓人耳鳴","我常常坐在床上著魔也似望著那光，想它是多麼虛妄而渺茫，比遠方悠揚的女聲更清透","每天我近午才懶洋洋睜眼，躺在床上看著窗外無聲的雲，試著喊一聲，確認己身所存，慢慢起床","我棲身於熟悉的角落，四周與牆等高的書都是熟悉的語文。某個遠處有低語迴響著，回音在某個迴廊踱步著"],"D"],[107,0,31,"在柏克萊大學，我度過了四年的學生生涯。柏克萊使我睜開眼睛，更迫切地觀察社會體認社會；在觀察和體認之餘，我並沒有感覺知識無能，我反而更信仰知識的力量。知識是力量，但知識不可以禁閉在學院裡，知識必須釋放，放到現實社會裡，方才是力量。依據上文，柏克萊大學的教育給了作者什麼樣的啟發？",["透過信仰宗教，調整處世態度","將知識從學院釋放，提供社會運用","越過學院體制，建構系統性的知識","將知識釋放到下層階級，拓寬世人眼界"],"B"],[107,0,32,"「專業倫理是個人適當扮演其分工角色的行為指引，輕視或違反專業倫理的人，等於缺乏社會合作的意願，人際關係就會失去應有的秩序，而完全以利害相對應，回到無道德的自然狀態。」本文旨在強調何者的重要性？",["專業倫理","合作意願","人際關係","道德規範"],"A"],[107,0,33,"「文學讓你看見水裡白楊樹的倒影，哲學使你在思想的迷宮裡認識星座，從而有了走出迷宮的可能；那麼歷史就是讓你知道，沙漠玫瑰有它特定的起點，沒有一個現象是孤立存在的。……這些人文『學』到最後都有一個終極的關懷，對『人』的關懷。脫離了對『人』的關懷，你只能有人文知識，不能有人文素養。」下列選項，何者符合上文旨意？",["人文素養就是文學、哲學和史學","有人文知識就能作出正確的價值判斷","文學家、哲學家、史學家人文素養高於一般人","人文素養是在人文知識的基礎上表現對人的關懷"],"D"],[107,0,34,"國立臺灣大學函教育部的公文用語，下列選項，錯誤的是：",["奉悉","檢陳","是否可行","請辦理見復"],"D"],[107,0,35,"下列選項，與行政機關實施分層負責之目的最無關係者為：",["免除首長責任題至第45說明：每題3分，所列的五個選項，其中至少有二個是正確答案。各題之選項獨立判定，全部答對者，得3分；答錯一個選項者，得1.8於二個選項（不含二個）者，該題以零分計算。","加速文書處理題，占30分）分；答錯二個選項者，得0.6","貫徹權責劃分分；所有選項均未作答或答錯多","落實專業分工二、複選題（第36"],"A"],[107,0,36,"詩人喜歡詠月，下列那些詩句與「月」有關？",["天上分金鏡，人間望玉鈎","蘭葉春葳蕤，桂華秋皎潔","閩國揚帆去，蟾蜍虧復圓","灑空深巷靜，積素廣庭閒","離披得幽桂，芳本欣盈握代號：1501頁次：4－4"],"AC"],[107,0,37,"語詞中常有與服裝相關的習慣用法，如「拂袖」，本意為振動衣袖，但通常用來表示不悅或憤怒。下列用法，何者正確？",["她因與主管理念不合，恥於屈就，「彈冠」求去","聽到有捐血的活動，他二話不說，「奮袂」前往","你們兩位都是貴賓，若能「連襟」出席再好不過","他信任下屬，對於公司管理簡直是「垂衣」而治","我本是個「披褐」之人，何必不顧身分高攀權貴"],"BDE"],[107,0,38,"下列對聯與行業可相搭配的是：",["還我廬山真面目／愛他秋水舊丰神：相館","能解丈夫燃眉急／善濟君子束手難：當鋪","往來盡是甜言客／談笑應無苦口人：糖果店","毫末技藝雖然不足為奇／頂上功夫卻能成人之美：理髮店","六禮未成轉眼洞房花燭／五經不讀霎時金榜題名：婚宴會館"],"ABCD"],[107,0,39,"下列書籍，何者為小說體裁？",["三國演義","資治通鑑","文心雕龍","儒林外史","聊齋誌異"],"ADE"],[107,0,40,"自齊王毀廢孟嘗君，諸客皆去。後召而復之，馮驩迎之。未到，孟嘗君太息歎曰：「文常好客，遇客無所敢失，食客三千有餘人，先生所知也。客見文一日廢，皆背文而去，莫顧文者。」下列選項，何者可用來描述諸客與孟嘗君（田文）的關係？",["燕雀安知鴻鵠之志","以勢交者，勢傾則絕","鳥盡弓藏，兔死狗烹","以色事人者，色衰而愛弛","以權利合者，權利盡而交疏"],"BE"],[107,0,41,"史洛維克從這些觀察中歸納出，老百姓對風險的概念比專家豐富，因此，他強烈抵抗應該由專家來做決定的看法。當專家意見跟老百姓的意見有衝突時，他不認為應該無條件接受專家的意見。當專家與老百姓的優先順序不同時，他認為：「雙方都應該尊重對方的洞見和智慧。」根據上文，下列選項正確的是：",["無條件接受專家意見，並不可取","專家與老百姓都可能有聰明的見解","一旦遇到意見不合，最好擱置不論，避免衝突","專家對風險的概念比不上老百姓，決策總是錯的","當專家與老百姓有意見衝突時，應該由老百姓來做決定"],"AB"],[107,0,42,"下列各項，何者語意連貫、敘述符合情理？",["業精於勤，荒於嬉；行成於思，毀於隨","勉人為善，諫人為惡，固是美事，先須自省","穴壁而窺，洞視八極；我登泰山，見不盈尺","立大事者，不惟有超世之才，亦必有堅忍不拔之志","貴可以問賤，賢可以問不肖，而老可以問幼，唯道之所成而已矣"],"ABDE"],[107,0,43,"「二○一四年十月住進池上之後，慢慢聽到更多的聲音，樹葉生長的聲音，水滲透泥土的聲音，昆蟲在不同角落對話的聲音，不同鳥類的啁啾，求偶或者爭吵，清晨對著旭日的歌唱，或黃昏歸巢時吱吱喳喳的吵嚷，聲音是如此不同。」下列關於此文的解說，何者正確？",["自然奧妙甚多，靜心體察自有發現","強調遠離名利，甘於平淡的價值觀","惟天地，萬物父母；惟人，萬物之靈","描述用心聆聽，領會天籟的特別體驗","疾風知勁草，現實考驗方能顯現人品"],"AD"],[107,0,44,"「他說，自己不喜歡離家，偏好定居在同一片土地。將親手栽植的樹木分贈到各地的他，卻教人想起翅果。風來時，翅果展開薄薄雙翼，乘風離開母樹。風歇止，它飄然降落於塵土，在天地人的滋養下，茁壯為雄渾的大樹。」下列敘述正確的選項是：",["本文有樹欲靜而風不止之意","文中的「他」以種植經濟樹種為職業","文中的「他」應該是一位安土重遷之人","作者以翅果為喻，是說翅果可代替主人雲遊天下","作者想像分贈樹木，好像翅果可以遍布他方，落地生根"],"CE"],[107,0,45,"「只有一個人生是令人不滿足的，但我們誕生之際時空已定，這個人生也就跟著『註定』，還有什麼方式能讓我們擴大實體世界與抽象世界的參與，在我看起來，也許只有『旅行』與『讀書』能讓我們擁有超過一個『人生』。讀書時，你固然要融入情景，因而有了另種人生的感受；旅行時，我們也要想盡辦法糾纏地，假裝另一種文化與生活的短暫化身。」下列選項，何者可與上文主旨相呼應？",["書中自有黃金屋","千里之行，始於足下","人生當讀萬卷書，行萬里路","山重水複疑無路，柳暗花明又一村","要麼讀書、要麼旅行，讓靈魂和身體擁有更寬廣的人生"],"CE"],[107,1,1,"小君的爸媽離婚後，由爸爸取得其監護權，隔年小君爸爸與春嬌再婚。父女兩人與春嬌所組成的家庭型態是指下列何者？",["折衷家庭","寄養家庭","重組家庭","新三代家庭"],"C"],[107,1,2,"小志撿到一隻拉不拉多犬後，想留下飼養，但經過獸醫師提醒此狗已被植入晶片，為有飼主之犬，如私自納為己有恐涉及侵占罪。小志便在不甘願的情況下將小狗送至警局，並通知飼主領回。上述小志的行為若根據佛洛依德的自我形成理論，較屬於下列何者？",["從本我到超我","從自我到客我","從本我到自我","從主我到客我"],"C"],[107,1,3,"2005年近千名南韓農民為了抗議美國等國家對自家出產的農產品提供補貼，並以低價傾銷到南韓，造成南韓農民生計受損，因此趁世界貿易組織開會之際至香港進行抗議。該項抗議是屬於下列何種訴求？",["本土化","反全球化","在地全球化","全球在地化"],"B"],[107,1,4,"在臺灣民間信仰中，將哪吒奉為神祇，俗稱為三太子。而電音三太子原是臺灣廟宇慶典活動中興起的表演文化，2009年電音三太子表演團在高雄所舉辦的世界運動會開幕式表演，隨後傳統臺灣民間信仰的電音三太子也逐漸躍上國際舞臺。下列何者最能用來說明上述現象？",["另類全球化","全球在地化","在地全球化","全球相對化"],"C"],[107,1,5,"「願景青年行動網協會」的文化志工們，用一己之力，為雲林偏遠的小鎮－台西小漁村彩繪500多面牆，讓漁村添加動人的生命色彩，帶動觀光人潮，活絡當地的經濟。上述「願景青年行動網協會」的行動，若從公民社會的 旅途中。也許是如此罷？牠對牠的終點站比中途站畏懼、陌生、不安。在一萬兩千哩長的半年遷移行程中，牠對牠命定要越過的海洋、島嶼與陸塊，有一種隨遇而安的坦然心理。對於終點站的『截留』，卻抱著忐忑難安的心，隨時準備著再度的漂泊，傍依四方。──牠是一種過境鳥。」請問這一段文字所述及的過境鳥心情，下列何者可與之呼應？",["此心安處是吾鄉","啼時露白風淒淒","飛上九天歌一聲","河海無息肩之地"],"A"],[106,0,9,"「喜歡過簡單的生活，而冬日的寒冷，正為日子提供了一份簡單與乾淨的感覺。所有的浮華、繽紛、塵囂，在冬日都安靜下來了；平常藏污納垢的人性死角裡，一切打掃不到的腐敗細菌，此刻也彷彿凍結僵死了。冬日，其實是一段可愛而不應加以詛咒的年光，因為，那是人比較理智、比較清醒、比較虔誠，也比較充滿愛心的季節。肅殺的天地，徹骨的凜冽，空曠寂寥的原野，廣漠浩瀚的星空，在在都引人走向深思反省的大道；大自然的啟示，勝過一切語言文字的雄辯，再怎麼浮誇的人，到了冬日，也不免變得沈默、謙卑起來。」下列那個選項與上文所述不合？",["冬日使人冷靜、清醒而沉默、謙卑","冬日象徵死亡，集中了所有的詛咒","冬日的寒冷，使生活愈發簡單與乾淨","冬日可以充滿愛心，讓人反省肅殺與寂寥"],"B"],[106,0,10,"近年來的電視戲劇節目以不同時代的人物穿越古今，因生活背景差異所產生的劇情跌宕，吸引觀眾。編劇家試圖以兩位人物的相會，營造穿越時空差異的效果。下列各組人物腳色的搭配，何者最不符合所謂的「穿越」？",["李白與杜甫","項羽與關羽","王安石與康有為","顏真卿與關漢卿代號：1501頁次：4－2"],"A"],[106,0,11,"「我對於這幾十年來日本漫畫工業的龐大勃興近乎無知，他們對於各種科幻、未來神話、人類體術之競賽、暴力系、巨大國家機器體系編造身世之機器人、生化人、星球戰史、核戰廢墟景觀、尼采式超人哲學辯證與救贖傳奇……早已層層積累……讓人眼花撩亂。」本文的大意是：",["日本動漫的龐大勃興深刻而令人目眩","日本所發展之巨大機器工業讓人讚嘆","日本動漫編造出人類身世與超人哲學","日本動漫衹選擇超人或機器人為主題"],"A"],[106,0,12,"「古早味最明顯、基本的意涵是世代相傳的東西，它因為被人們喜好而風行而流傳，那是一種經驗的累積，復點點滴滴被修飾過，成為普羅大眾接受的作法、滋味。」下列何者不屬於作者所說的「古早味」意涵？",["對食物的回憶與情感","傳承中再加上了變化","古早味是現存的過去","克勤克儉的飲食文化"],"D"],[106,0,13,"「多少次課堂上，當我說某個理論已被另一個新的取代時，學生會停下筆來，憤怒的把前面的筆記劃掉，大惑不解的望著我，懷疑為什麼要教一段已經被證實為不對的理論。他們完全不了解在科學上沒有絕對的對錯，一個理論被推翻了並不代表它從此就銷聲匿跡，假如有新的儀器、新的方法出現，它還是有可能借屍還魂，以另一個姿態出現。最主要的是我想教他們科學家思考的方式，他如何根據他的想法設計關鍵性實驗以驗證他的想法，因為這才是科學的精神——假說的驗證。」根據本文，作者最想要教導學生的學習態度是：",["好讀書，不求甚解","博觀約取，厚積薄發","知其然，且知其所以然","知之為知之，不知為不知"],"C"],[106,0,14,"「葉似蒲而短闊，兩旁如鋸齒。其實色黃，瓤如鱗甲，形似甜瓜。味甚甘酸，清芬襲人。」上文所描述的水果是：",["芒果","鳳梨","火龍果","百香果"],"B"],[106,0,15,"《孟子．萬章》：「頌其詩，讀其書，不知其人可乎？是以論其世也。」依據上文，下列選項與孟子所言相符的是：",["古代著作只有詩、書二者值得閱讀","古代好的作家要會作詩也要會寫書","閱讀作品要先了解作者及所處時代背景","閱讀作品的目的是在了解作者成長背景"],"C"],[106,0,16,"「今有人於此，以隋侯之珠彈千仞之雀，世必笑之。」（呂不韋《呂氏春秋．貴生》）文中以為世人必笑的原因是：",["所用者重，所要者輕","所距甚遠，命中甚難","牛刀小試，易如反掌","鳥雀甚小，射中不易"],"A"],[106,0,17,"「歷山之農者侵畔，舜往耕焉，朞年，甽畝正。河濱之漁者爭坻，舜往漁焉，朞年而讓長。東夷之陶者器苦窳，舜往陶焉，朞年而器牢。」下列選項何者契合本文旨意？",["好行小慧","作之君，作之師","躬自厚，而薄責於人","矜而不爭，群而不黨"],"B"],[106,0,18,"「留名青史」是指歷史上留名，下列選項正確的是：",["古人常用青色絲繩編綴書籍，故稱「青史」","古書的封面以青色最為常見，故稱「青史」","丹青是一種顏料，古人用來寫字，故稱「青史」","古史寫在竹簡上，竹皮是青色的，故稱「青史」"],"D"],[106,0,19,"袁宗道〈答友人〉：「學未至圓通，合己見則是，違己見則非。如以南方之舟，笑北方之車；以鶴脛之長，憎鳧脛之短也。夫不責己之有見，而責人之異見，豈不悖哉！」根據引文，下列選項所述何者正確？",["「學未至圓通」指「不以規矩不能成方圓」","「以鶴脛之長，憎鳧脛之短也」指「師心自用」","「合己見則是，違己見則非」指「非我族類，其心必異」","「不責己之有見，而責人之異見」指「嚴以律己，寬以待人」"],"B"],[106,0,20,"「禍兮福之所倚，福兮禍之所伏」（《老子．五十八章》），意為「禍福相倚」。下列選項中的思維模式，何者最為貼近？",["福兮誰造，禍兮孰興","樂與苦，相為倚伏者也","禍福生於喜怒，榮辱由其愛憎","福兮可以善取，禍兮可以惡招"],"B"],[106,0,21,"「三人行，必有我師焉」，與下列何者涵義相近？",["眾口鑠金，三人成虎","青出於藍，而勝於藍","前事不忘，後事之師","見賢思齊焉，見不賢而內自省也"],"D"],[106,0,22,"「祖士少好財，阮遙集好屐，並恒自經營。同是一累，而未判其得失。人有詣祖，見料視財物。客至，屏當未盡，餘兩小簏箸背後，傾身障之，意未能平。或有詣阮，見自吹火蠟屐，因歎曰：『未知一生當箸幾量屐？』神色閑暢。於是勝負始分。」依據上文，分出勝負的原因是：",["祖士少喜好錢財，特為鄙俗貪吝，故阮遙集勝","訪客喜好錢財，與祖士少同，故認為祖士少勝","阮遙集掛懷「未知一生當箸幾量屐」，太為外物所累，故祖士少勝","祖士少「傾身障之，意未能平」，阮遙集「神色閑暢」，故阮遙集勝"],"D"],[106,0,23,"「寒山吹笛喚春歸，遷客相看淚滿衣。洞庭一夜無窮雁，不待天明盡北飛。」（〈春夜聞笛〉）下列選項，最符合此詩題旨的是：",["感時傷逝","羈旅思鄉","憂國憂民","聞笛憶友代號：1501頁次：4－3"],"B"],[106,0,24,"「豫讓臣事智伯，及趙襄子殺智伯，讓為之報仇。聲名烈烈，雖愚夫愚婦，莫不知其為忠臣義士也。嗚呼！讓之死固忠矣，惜乎處死之道有未忠者存焉。何也？觀其漆身吞炭，謂其友曰：『凡吾所為者極難，將以愧天下後世之為人臣而懷二心者也。』謂非忠可乎？及觀斬衣三躍，襄子責以不死於中行氏，而獨死於智伯。讓應曰：『中行氏以眾人待我，我故以眾人報之；智伯以國士待我，我故以國士報之。』即此而論，讓有餘憾矣。……讓既自謂智伯待以國士矣，國士，濟國之事也。當伯請地無厭之日，縱欲荒棄之時，為讓者正宜陳力就列，諄諄然而告之，……諄切懇告，諫不從，再諫之；再諫不從，三諫之；三諫不從，移其伏劍之死，死於是日。伯雖頑冥不靈，感其至誠，庶幾復悟。和韓、魏，釋趙圍，保全智宗，守其祭祀。若然，則讓雖死猶生也，豈不勝於斬衣而死乎？」（方孝孺〈豫讓論〉）根據上文議論，下列何者才能真正表現豫讓之忠義？",["漆身吞炭，斬衣三躍","智伯以國士待之，豫讓以國士報之","讓之所為者極難，將以愧天下後世之為人臣而懷二心者","智伯縱欲荒棄之時，豫讓正宜陳力就列，諄諄然而告之"],"D"],[106,0,25,"承上題，根據文意，作者認為豫讓當死的時機是：",["智伯待以國士之時","趙襄子殺智伯之時","諄切懇告智伯，三諫不從之時","智伯請地無厭之日，縱欲荒棄之時"],"C"],[106,0,26,"「今夜的月光超載太重／照著我一夜哄不成夢／每根頭髮都失眠」。下列何者最接近這段歌詞描述的情境？",["月明如素愁不眠","落月搖情滿江樹","長溝流月去無聲","月移花影約重來"],"A"],[106,0,27,"「王子敬云：『從山陰道上行，山川自相映發，使人應接不暇。若秋冬之際，尤難為懷。』」（《世說新語．言語》）王子敬說這段話時的心情，應該是：",["從容不迫","欣然愉悅","耿耿於懷","驚慌失措"],"B"],[106,0,28,"「好一個『人有悲歡離合，月有陰晴圓缺，此事古難全』！這是多麼通達的看法！遇到可悲之事哭得死去活來，遇到可喜之事樂得昏頭忘形，這原是人之常情。但是如果通古今而觀的話，今人的悲哀，昔人都悲哀過；今人之喜樂，昔人都喜樂過。太陽底下真的沒有新鮮事兒。有此一念，然後哀樂都可適度，尤其不必為『古難全』的事悲傷個沒有完。但個人的生命有限，體驗有限，必須像蘇軾那樣熟讀群書，才能通古今而觀，才能說出如此通達的話來。」下列選項最合於作者解釋「古難全」之深意者是：",["人生的悲歡離合與月之圓缺相同，物極則必反","人有悲歡離合如同月有陰晴圓缺，當視之如無物","人生悲歡離合的境遇屬於必然，故哀樂宜恰到好處","人生悲離的境遇既然不能避免，就應把握相聚時光"],"C"],[106,0,29,"昔有一蘇州人曰：「蘇州此時有起火亦無處放，放亦不得上。」眾曰：「何也？」曰：「此時天上被煙火擠住，無空隙處耳！」人笑其誕。（《陶庵夢境》卷2）此蘇州人所言究竟何意？",["蘇州火災頻繁","自誇蘇州煙火之盛","蘇州對施放煙火管制極嚴","蘇州施放煙火時，煙霧蔽天"],"B"],[106,0,30,"美國作家馬克．吐溫，在一次宴會上，與一位女士對坐，說了一聲：「您真漂亮！」那位女士卻不領情，高傲地說：「可惜我無法同樣讚美您！」馬克．吐溫說：「那沒關係，你可以像我一樣，說一句謊話就行了。」根據上文判斷，下列敘述何者正確？",["馬克．吐溫擅於虛情假意","馬克．吐溫的表現有失風度","婦人的高傲，最後是自取其辱","馬克．吐溫的讚美本來就是謊言"],"C"],[106,0,31,"「黑暗沉落下來／在臺灣的心臟地帶／黑暗沉落下來／於我們憂傷的胸懷／黑暗沉落下來／當屋瓦牆垣找不到棲腳的所在／黑暗沉落下來／我的同胞陷身斷裂的生死之崖」這首詩最可能書寫什麼事件？",["1999年7月29日，臺灣臺南以北大規模停電","2015年8月，蘇迪勒颱風造成全臺史上最嚴重的颱風災情","1999年9月21日，南投縣集集鎮發生的「921集集大地震」","1995年2月發生在臺中的「衛爾康」西餐廳大火，造成多人傷亡"],"C"],[106,0,32,"「現代工商社會的人事管理模式，最凸顯的性格就是——『物化』，也就是將主導生產的『人』也一併產品化了。『物化式的管理』，最明顯的現象：一是『規格化』，只管人事上的統一法規，從不管人的個別性情與特殊處境；二是『物質化』，只把『人』當作沒有生命的物質，因此不尊重他們的『人格』與『自由意志』。」根據引文，下列選項何者正確？",["最佳管理模式是建立在「統一法規」上","人被「物化」的結果是走向「規格化」","「人格」與「自由意志」因商業價值而被彰顯","強調人在現代工商社會的管理模式中可以展現自我"],"B"],[106,0,33,"下級機關在上行公文中，需使用附送語時，下列何者正確？",["附送","附呈","檢陳","檢送"],"C"],[106,0,34,"某高中合唱團要向校外文化中心申請活動場地，該校所撰公文，下列用語錯誤的是：",["自稱為「本校合唱團」","稱呼文化中心為「貴中心」","主旨的期望語用「希辦理見復」","文末蓋校長「職銜簽字章」"],"C"],[106,0,35,"有關公文書寫，下列何者正確？",["「咨」：對總統有所呈請或報告時使用","「函」：民眾與機關間之申請或答復時使用","「呈」：總統與立法院、監察院公文往復時使用","「簽」：上級機關首長對下級機關首長有所陳述建議時使用代號：1501頁次：4－4二、複選題（第36題至第45題，占30分）說明：每題3分，所列的五個選項，其中至少有二個是正確答案。各題之選項獨立判定，全部答對者，得3分；答錯一個選項者，得1.8分；答錯二個選項者，得0.6分；所有選項均未作答或答錯多於二個選項（不含二個）者，該題以零分計算。"],"B"],[106,0,36,"下列選項引號中的字，何者前後意義相同？",["「修」短隨化／茂林「修」竹","方興未「艾」／期期「艾」艾","「盡」心盡力／鞠躬「盡」瘁","審己「度」人／雍容大「度」","欺善怕「惡」／好逸「惡」勞"],"AC"],[106,0,37,"下列題辭，何者用於祝賀女壽？",["北堂春暖","美輪美奐","壽徵坤德","慈竹風和","椿庭日永"],"ACD"],[106,0,38,"下列書信用語，何者使用不當？",["子路寫給孔子的提稱語可用「大鑒」","國小女童寫給行政院院長可自稱「小女」","梁啟超寫給老師的啟封詞可用「惠啟」","諸葛孔明寫給劉備的末啟語可用「謹上」","曹丕寫給曹操的問候語可用「叩請金安」"],"ABC"],[106,0,39,"改編自西方奇幻文學的電影如《魔戒》、《哈利波特》……等，十分受到讀者歡迎，下列那些作品也出現了諸多充滿想像的神怪角色，描繪了虛實交錯的世界？",["《山海經》","《西遊記》","《世說新語》","《儒林外史》","《聊齋誌異》"],"ABE"],[106,0,40,"下列何者可以用來表達「恆心」的重要？",["天油然作雲，沛然下雨，則苗浡然興之矣","有為者，譬若掘井；掘井九仞而不及泉，猶為棄井也","山徑之蹊間，介然用之而成路，為間不用，則茅塞之矣","雖有天下易生之物也，一日暴之，十日寒之，未有能生者也","兵刃既接，棄甲曳兵而走。或百步而後止，或五十步而後止"],"BCD"],[106,0,41,"下列諺語，旨在提醒「人心難測」的選項是：",["不怕黑李逵，就怕笑劉備","歲寒知松柏，患難見真情","人不可貌相，海水不可斗量","畫虎畫皮難畫骨，知人知面不知心","人前莫說人長短，始信人中更有人"],"AD"],[106,0,42,"「燕趙多慷慨悲歌之士，吳楚多放誕纖麗之文，自古然矣。自唐以前，於詩於文於賦，皆南北各為家數。長城飲馬，河梁攜手，北人之氣概也；江南草長，洞庭始波，南人之情懷也。散文之長江大河，一瀉千里者，北人為優；駢文之鏤雲刻月，善移我情者，南人為優。蓋文章根於性靈，其受四圍社會之影響特甚焉。自後世交通益盛，文人墨客，大率足跡走天下，其界亦寖微矣。」依據上文，下列選項的敘述，何者正確？",["文學風格的形成與地理環境有關","南方文學詩、文、賦的表現皆優於北方文學","北方文學以駢文見長，南方文學以散文為佳","北方文學多豪壯之氣，南方文學多纖婉之情","交通的便利，使得南方文學與北方文學的差異逐漸泯除"],"ADE"],[106,0,43,"晏殊〈浣溪沙〉：「一曲新詞酒一杯，去年天氣舊亭臺，夕陽西下幾時回？無可奈何花落去，似曾相識燕歸來，小園香徑獨徘徊。」此詞所抒發的人生感慨是：",["好景不常","年華易逝","有志難伸","物是人非","歸鄉無期"],"ABD"],[106,0,44,"「齊白石到老還忘不了童年河邊釣魚蝦的情景，晚年給于非闇畫的〈釣蝦圖〉題了一段憶舊的話，說他五、六歲在老屋星塘岸戲耍，淺水中見到大蝦而不可得，拿了粗麻線繫上綿絮為餌沈入水中，蝦足鉗餌，線一拉上來，蝦也跟著出水了，比釣魚更有趣。」下列何者適合用來形容晚年齊白石的心情？",["童年往事，到老堪誇","時移事往，不復盈懷","往事已矣，對景難排","懷舊憶往，童心依舊","寶刀未老，壯心猶在"],"AD"],[106,0,45,"「據說沙丁魚生性懶惰，不愛運動，漁民在海中所捕獲的沙丁魚，往往一運回碼頭就死亡了。有次，一位挪威漁民在捕撈了沙丁魚之後，將一條鯰魚放入沙丁魚的魚槽中，結果發現沙丁魚直到運回碼頭都還活著。原來是因為鯰魚在魚槽中到處游動，沙丁魚害怕被吃掉，開始緊張起來，為了保命而加速運動。這就是所謂『鯰魚效應』的由來。」關於「鯰魚效應」的主要意涵，從組織發展的角度來看，敘述正確的選項是：",["組織中引入競爭者，激起新的活力","組織若要與時俱進，必須汰舊換新","在既有的傳統底下，尋求創新領袖","老手負責帶領新人，完成經驗傳承","為了維持存活發展，不可封閉守舊"],"AE"],[106,1,1,"小明借住姑姑家，常常為了保護姑姑不被姑丈毆打，因而也常被姑丈毆傷。下列依據上述案例的敘述，若依我國家庭暴力防治法的規定，何者正確？",["小明與姑丈並非直系血親，故不受該法保障","小明因挺身保護姑姑而被打，不受該法保障","小明和姑姑均可依法向地方法院聲請保護令","小明可向地方法院聲請剝奪姑丈親權的行使"],"C"],[106,1,2,"成年公民是指自我發展達到成熟，對社會具有權責觀念與參與意願的公民。下列何者屬於公民素養中「公民參與」的面向？",["小風為增廣見聞於每年寒暑假參加遊學團","小青自行設計品牌吸引國內外消費者購買","小瑜積極參與公益社團活動協助弱勢團體","小珍藉由參與演講學習做好個人生涯規劃"],"C"],[106,1,3,"近來平板電腦與智慧型手機的熱銷，使Android系統成為受歡迎的作業平台，而Android軟體工程師的職缺需求也跟著大增，使得身價跟著水漲船高。上述受到產業、職業、企業組織的變化等整個大環境的影響，所造成的社會流動應是指下列何種？",["代間流動","水平流動","向下流動","結構流動"],"D"],[106,1,4,"近年來，政府推動「一鄉一特色」的觀光發展，如苗栗公館紅棗節、嘉義民雄鵝肉節等。鼓勵各地運用在地資源，透過文化包裝發展地方獨具的特色。有關「一鄉一特色」的敘述，下列何者最正確？",["顯示次文化的元素轉變為主流文化符號","公私部門協力合作的社區營造發展活動","運用分散風險的投資原則進行產業經濟","邊緣文化的興起有助於社區認同的凝聚"],"B"],[106,1,5,"某新聞媒體提到警方抓到一名嫌犯，身分證上顯示為男性，但其外貌卻像是一名「女性」，經詢問才得知，該名嫌犯喜歡男扮女裝。警方驚訝的表示：「無論外表、舉止、談吐或身材，簡直比女性更具女性特質。」此表示顯示警方具有下列何種觀念？",["性傾向多元","性別主流化","性別認同偏差","性別刻板印象"],"D"],[106,1,6,"根據我國公民投票法之規定，下列何者事項可作為公民投票之提案？",["地方建設案","政府預算案","企業稅率案","院長人事案"],"A"],[106,1,7,"早期只有男性才具有投票權，經過多年的努力，婦女也享有投票權。這項投票情形的轉變，若依我國憲法的規定來看，主要象徵何項選舉原則的落實？",["普通","平等","直接", loadST();
function userBar(){$('#users').innerHTML='<span class="small">目前使用者：</span>'+U.names.map((n,i)=>`<button class="chip ${U.cur==i?'on':''}" onclick="switchUser(${i})">${esc(n)}</button>`).join('')}
function switchUser(i){if(i==U.cur)return;if(M&&M.l&&!M.done&&!confirm('整卷作答中，換人會放棄這份卷子，確定？'))return;U.cur=i;saveU();loadST();P=null;M=null;if(timerH){clearInterval(timerH);timerH=null}userBar();go(tab)}
function rec(q,ok){const r=ST[q.id]||{r:0,w:0,last:null};if(ok)r.r++;else r.w++;r.last=ok;ST[q.id]=r;save()}
const $=s=>document.querySelector(s);
const isMulti=q=>q.ans.length>1;
const pts=q=>isMulti(q)?3:2;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let SHOWALL=false;
function toggleAll(){SHOWALL=!SHOWALL;if(tab=='practice')drawP();else if(tab=='mock'){M&&M.done?resultM():drawM()}}
function allBtn(){return `<button class="btn ghost" style="padding:5px 14px;font-size:14px" onclick="toggleAll()">${SHOWALL?'收合全部答案':'展開全部答案'}</button>`}
let tab='practice',P=null,M=null,timerH=null,CUR=0;
try{const c=localStorage.getItem('yb-gov-cur');if(c!==null&&c!=='')CUR=+c}catch(e){}
function chooseSubj(i){if(M&&M.l&&!M.done&&!confirm('整卷作答中，換科目會放棄這份卷子，確定？'))return;CUR=i;P=null;M=null;if(timerH){clearInterval(timerH);timerH=null}try{localStorage.setItem('yb-gov-cur',i)}catch(e){}go(tab)}
function subjBar(){return `<div class="row">${SJ.map((n,i)=>`<button class="chip ${CUR==i?'on':''}" style="font-size:16px;padding:6px 16px" onclick="chooseSubj(${i})">${n}</button>`).join('')}</div>`}
const TABS=[['practice','刷題'],['mock','整卷模擬'],['wrong','錯題本'],['stat','紀錄']];
function drawTabs(){$('#tabs').innerHTML=TABS.map(t=>`<button class="tab ${tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}
function go(t){tab=t;if(timerH&&t!='mock'){clearInterval(timerH);timerH=null}drawTabs();({practice,mock,wrong,stat})[t]();window.scrollTo(0,0)}
function qHTML(q,sel,reveal){
  const multi=isMulti(q);
  let h=`<div class="qno">${q.y} 年 · ${SJ[q.s]} · 第 ${q.n} 題 ${multi?'<span class="tag t-todo">複選題</span>':''}</div>`;
  if(q.img)h+=`<img class="qi" src="data:image/png;base64,${q.img}" alt="原卷題目">`;
  else h+=`<div class="stem">${esc(q.stem)}</div>`;
  h+=q.opts.map((o,i)=>{const c=L[i];let cl='opt';
    if(reveal){if(q.ans.includes(c))cl+=' right';else if(sel.includes(c))cl+=' wrong'}else if(sel.includes(c))cl+=' sel';
    return `<button class="${cl}" ${reveal?'disabled':''} onclick="pick('${c}')"><i>${c}</i><span>${q.img?'':esc(o)}</span></button>`}).join('');
  return h}
/* ---------- 刷題 ---------- */
function practice(){
  if(P&&P.list){drawP();return}
  P=P||{years:[...YEARS],order:'seq',filter:'all',count:0};
  const chip=(k,v,l,on)=>`<button class="chip ${on?'on':''}" onclick="setP('${k}',${typeof v=='string'?"'"+v+"'":v})">${l}</button>`;
  $('#view').innerHTML=`<div class="card"><h2>刷題設定</h2><div class="small">科目</div>${subjBar()}
  <div class="small">年度（可複選）</div><div class="row">${YEARS.map(y=>chip('years',y,y,P.years.includes(y))).join('')}<button class="chip" onclick="P.years=[...YEARS];practice()">全選</button></div>
  <div class="small">範圍</div><div class="row">${[['all','全部'],['new','還沒做過'],['wrong','只做錯題']].map(a=>chip('filter',a[0],a[1],P.filter==a[0])).join('')}</div>
  <div class="small">順序</div><div class="row">${[['seq','依年度題號'],['rnd','隨機']].map(a=>chip('order',a[0],a[1],P.order==a[0])).join('')}</div>
  <div class="small">題數</div><div class="row">${[[30,'30 題'],[50,'50 題'],[100,'100 題'],[0,'全部']].map(a=>chip('count',a[0],a[1],P.count==a[0])).join('')}</div>
  <p id="cnt" class="small"></p><button class="btn" onclick="startP()">開始</button></div>`;
  cnt()}
function pool(){return Q.filter(q=>q.s==CUR&&P.years.includes(q.y)&&(P.filter=='all'||(P.filter=='new'&&!ST[q.id])||(P.filter=='wrong'&&ST[q.id]&&ST[q.id].last===false)))}
function cnt(){const e=$('#cnt');if(e){const n=pool().length;e.textContent='符合條件：'+n+' 題'+(P.count&&n>P.count?'，本次做 '+P.count+' 題':'')}}
function setP(k,v){if(k=='years'){const a=P[k],i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v)}else P[k]=v;P.list=null;practice()}
function startP(){let l=pool();if(!l.length){alert('這個條件下沒有題目');return}
  if(P.order=='rnd')l=l.map(q=>[Math.random(),q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  if(P.count&&l.length>P.count)l=l.slice(0,P.count);
  P.list=l;P.i=0;P.sel='';P.rev=false;drawP()}
function drawP(){const q=P.list[P.i];
  let h=`<div class="row" style="justify-content:space-between;align-items:center"><span class="small">進度 ${P.i+1} / ${P.list.length}${SHOWALL?'　（看答案模式，不記錄）':''}</span>${allBtn()}</div><div class="card">${qHTML(q,P.sel,P.rev||SHOWALL)}`;
  if(SHOWALL&&!P.rev)h+=`<div class="fb ok">正確答案：${q.ans}</div>`;
  if(isMulti(q)&&!P.rev&&!SHOWALL)h+=`<button class="btn" ${P.sel?'':'disabled'} onclick="confirmP()">確認答案</button>`;
  if(P.rev){const ok=P.sel.split('').sort().join('')==q.ans;h+=`<div class="fb ${ok?'ok':'bad'}">${ok?'答對了':'答錯了'}　正確答案：${q.ans}</div>`}
  h+=`<div class="nav"><button class="btn ghost" ${P.i?'':'disabled'} onclick="stepP(-1)">上一題</button><button class="btn ghost" onclick="P.list=null;practice()">結束</button><button class="btn" ${P.i<P.list.length-1?'':'disabled'} onclick="stepP(1)">下一題</button></div></div>`;
  $('#view').innerHTML=h}
function pick(c){
  if(tab=='practice'){const q=P.list[P.i];if(P.rev||SHOWALL)return;
    if(isMulti(q)){P.sel=P.sel.includes(c)?P.sel.replace(c,''):(P.sel+c).split('').sort().join('')}else{P.sel=c;confirmP();return}drawP()}
  else if(tab=='mock'){if(SHOWALL&&!M.done)return;M.a[M.i]=isMulti(M.l[M.i])?(M.a[M.i]||'').includes(c)?(M.a[M.i]).replace(c,''):((M.a[M.i]||'')+c).split('').sort().join(''):c;drawM()}}
function confirmP(){const q=P.list[P.i];if(!P.sel)return;P.rev=true;rec(q,P.sel.split('').sort().join('')==q.ans);drawP()}
function stepP(d){P.i+=d;P.sel='';P.rev=false;drawP();window.scrollTo(0,0)}
/* ---------- 整卷 ---------- */
function mock(){
  if(M&&M.l){drawM();return}
  const ys=YEARS.map(y=>`<option>${y}</option>`).join('');
  $('#view').innerHTML=`<div class="card"><h2>整卷模擬</h2><div class="small">科目</div>${subjBar()}<div class="row">年度 <select id="my">${ys}</select></div>
  <p class="small">限時 60 分鐘（和正式考試一樣）。單選每題 2 分，國文複選每題 3 分、須全對。交卷後才顯示答案。</p><button class="btn" onclick="startM()">開始作答</button></div>`}
function startM(){const y=+$('#my').value,s=CUR;M={l:Q.filter(q=>q.y==y&&q.s==s),i:0,a:[],end:Date.now()+3600e3,done:false,y,s};
  timerH=setInterval(()=>{const e=$('#tm');if(!e)return;const r=Math.max(0,M.end-Date.now());e.textContent=String(Math.floor(r/60000)).padStart(2,'0')+':'+String(Math.floor(r/1000)%60).padStart(2,'0');if(r<=0&&!M.done)submitM()},500);drawM()}
function drawM(){
  if(M.done){resultM();return}
  const q=M.l[M.i],a=M.a[M.i]||'';
  let g=M.l.map((x,i)=>`<button class="g ${M.a[i]?'done':''}" onclick="M.i=${i};drawM()">${i+1}</button>`).join('');
  $('#view').innerHTML=`<div class="timer">剩餘 <span id="tm"></span></div> <span class="small">${M.y} 年 ${SJ[M.s]}　已答 ${M.a.filter(Boolean).length} / ${M.l.length}</span> ${allBtn()}<div class="card">${qHTML(q,a,SHOWALL)}${SHOWALL?`<div class="fb ok">正確答案：${q.ans}</div>`:''}
  <div class="nav"><button class="btn ghost" ${M.i?'':'disabled'} onclick="M.i--;drawM()">上一題</button><button class="btn ghost" ${M.i<M.l.length-1?'':'disabled'} onclick="M.i++;drawM()">下一題</button></div></div>
  <div class="card"><div class="grid">${g}</div><button class="btn" onclick="if(confirm('確定交卷？'))submitM()">交卷</button></div>`}
function submitM(){M.done=true;if(timerH){clearInterval(timerH);timerH=null}M.l.forEach((q,i)=>rec(q,(M.a[i]||'')==q.ans));resultM()}
function resultM(){
  let sc=0,max=0;M.l.forEach((q,i)=>{max+=pts(q);if((M.a[i]||'')==q.ans)sc+=pts(q)});
  const g=M.l.map((q,i)=>`<button class="g ${(M.a[i]||'')==q.ans?'ok':'bad'}" onclick="openR(${i})">${i+1}</button>`).join('');
  const list=M.l.map((q,i)=>{const a=M.a[i]||'',ok=a==q.ans;
    return `<details id="r${i}" ${SHOWALL?'open':''} style="border-top:1px solid var(--line);padding:6px 0"><summary style="cursor:pointer"><span class="tag ${ok?'t-ok':'t-bad'}">${ok?'對':'錯'}</span>第 ${q.n} 題　你的答案 ${a||'未作答'}　正確答案 ${q.ans}</summary>${qHTML(q,a,true)}<div class="fb ${ok?'ok':'bad'}">你的答案：${a||'未作答'}　正確答案：${q.ans}</div></details>`}).join('');
  $('#view').innerHTML=`<div class="stats"><div class="stat"><b>${sc}</b><span>得分（滿分 ${max}）</span></div><div class="stat"><b>${M.l.filter((q,i)=>(M.a[i]||'')==q.ans).length}</b><span>答對題數</span></div><div class="stat"><b>${M.l.filter((q,i)=>!M.a[i]).length}</b><span>未作答</span></div></div>
  <div class="card"><div class="grid">${g}</div><div class="small">綠＝對，紅＝錯或未答。點題號跳到該題。</div></div>
  <div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">全部題目與答案</h2>${allBtn()}</div>
  <div class="card">${list}</div>
  <button class="btn" onclick="M=null;go('mock')">再考一份</button>`}
function openR(i){const e=document.getElementById('r'+i);e.open=true;e.scrollIntoView({behavior:'smooth',block:'start'})}
/* ---------- 錯題本 ---------- */
function wrong(){
  const w=Q.filter(q=>q.s==CUR&&ST[q.id]&&ST[q.id].last===false);
  if(!w.length){$('#view').innerHTML=`<div class="card">${subjBar()}<p>${SJ[CUR]}目前沒有錯題。去刷題吧！</p></div>`;return}
  const by=YEARS.map(y=>[y,w.filter(q=>q.y==y).length]).filter(b=>b[1]);
  $('#view').innerHTML=`<div class="stats">${by.map(b=>`<div class="stat"><b>${b[1]}</b><span>${b[0]} 年</span></div>`).join('')}</div>
  <div class="card">${subjBar()}<h2>${SJ[CUR]}　共 ${w.length} 題錯題</h2><p class="small">答對一次就會從錯題本移出。</p><button class="btn" onclick="P={years:[...YEARS],order:'rnd',filter:'wrong',count:0};startP();go('practice')">開始練錯題</button></div>${wrongList(w)}`}
function wrongList(w){
  const g={};w.forEach(q=>(g[q.y]=g[q.y]||[]).push(q));
  return YEARS.filter(y=>g[y]).map(y=>`<div class="card"><h2>${y} 年（${g[y].length} 題）</h2>`+g[y].map(q=>{const r=ST[q.id];
    return `<div style="border-top:1px solid var(--line);padding:6px 0"><button class="chip" style="width:100%;text-align:left;border:0;background:none;font-size:15px" onclick="toggleW('${q.id}')"><b>第 ${q.n} 題</b>　${q.img?'（原卷圖片題）':esc(q.stem.slice(0,36))+(q.stem.length>36?'…':'')}<span class="small">　答 ${q.ans}・錯 ${r.w} 次</span></button><div id="w-${q.id}" style="display:none"></div></div>`}).join('')+'</div>').join('')}
function toggleW(id){const e=document.getElementById('w-'+id);if(e.style.display=='block'){e.style.display='none';return}
  const q=Q.find(x=>x.id==id);e.innerHTML=qHTML(q,q.ans,true).replace(/onclick="pick\('[A-E]'\)"/g,'')+`<div class="fb ok">正確答案：${q.ans}</div>`;e.style.display='block'}
/* ---------- 紀錄 ---------- */
function stat(){
  const rows=YEARS.map(y=>{const l=Q.filter(q=>q.s==CUR&&q.y==y),d=l.filter(q=>ST[q.id]),ok=d.filter(q=>ST[q.id].last===true);return `<tr><td>${y} 年</td><td>${d.length}/${l.length}</td><td>${d.length?Math.round(ok.length*100/d.length)+'%':'-'}</td></tr>`}).join('');
  $('#view').innerHTML=`<div class="card">${subjBar()}<h2>${SJ[CUR]}　各年度進度</h2><table><tr><th>年度</th><th>做過/總數</th><th>最近一次答對率</th></tr>${rows}</table></div>
  <div class="card"><button class="btn ghost" onclick="if(confirm('清除「'+U.names[U.cur]+'」的全部紀錄？'))(ST={},save(),stat())">清除「目前使用者」的紀錄</button></div>`}
$('#total').textContent=Q.length;userBar();go('practice');
</script>
</body>
</html>
