<!doctype html>
<html lang="zh-Hant">
<head>

<title>初等考試 一般行政 歷屆題庫</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1d2b3a;--sub:#5b6b7c;--line:#dbe4ee;--blue:#2f6fb3;--ok:#1f8a5b;--okbg:#e4f5ed;--todo:#b9741a;--todobg:#fdf1de;--risk:#b83a3a;--riskbg:#fbe6e6;--nextbg:#e3eefa}
@media (prefers-color-scheme:dark){:root{--bg:#121a24;--card:#1a2431;--ink:#e6edf5;--sub:#9fb0c2;--line:#2a3a4d;--blue:#6aa6e6;--ok:#5fd0a0;--okbg:#17372b;--todo:#e8b05c;--todobg:#3a2c15;--risk:#f08a8a;--riskbg:#3d1d1d;--nextbg:#1b2e45}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 70px}
h1{font-size:24px;margin:0 0 2px}
.meta{color:var(--sub);font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 16px;font:inherit;font-size:15px;cursor:pointer}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-size:24px;color:var(--blue)}
.stat span{font-size:13px;color:var(--sub)}
h2{font-size:18px;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--nextbg);border-color:var(--blue);color:var(--blue);font-weight:700}
.btn{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:9px 20px;font:inherit;font-size:16px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--blue);border:1px solid var(--blue)}
.btn:disabled{opacity:.4;cursor:default}
.qno{font-size:13px;color:var(--sub);margin-bottom:4px}
.stem{font-size:18px;margin:4px 0 12px;white-space:pre-wrap}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;margin:8px 0;font:inherit;font-size:17px;cursor:pointer}
.opt i{font-style:normal;font-weight:700;color:var(--blue);min-width:1.4em}
.opt.sel{border-color:var(--blue);background:var(--nextbg)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--risk);background:var(--riskbg)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;margin-right:6px}
.t-ok{background:var(--okbg);color:var(--ok)}.t-bad{background:var(--riskbg);color:var(--risk)}.t-todo{background:var(--todobg);color:var(--todo)}
.fb{margin:10px 0;padding:8px 12px;border-radius:8px;font-weight:700}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--riskbg);color:var(--risk)}
img.qi{max-width:100%;border-radius:8px;border:1px solid var(--line);background:#fff}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.timer{position:sticky;top:50px;z-index:4;background:var(--todobg);color:var(--todo);padding:4px 12px;border-radius:8px;font-weight:700;display:inline-block;margin-bottom:8px}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.g{width:34px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font:inherit;font-size:13px;cursor:pointer}
.g.done{background:var(--nextbg);border-color:var(--blue)}.g.ok{background:var(--okbg);border-color:var(--ok)}.g.bad{background:var(--riskbg);border-color:var(--risk)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.small{font-size:13px;color:var(--sub)}
a{color:var(--blue)}
</style>
</head>

<script>
const D=[[115,0,1,"下列文句「」中的成語，何者使用正確？",["明明小事一樁，卻因你「危言危行」使人心浮動","隨著商圈轉移，這裡的商店也落得「風雨同舟」","他「巧舌如簧」的用盡藉口，代班同事不堪忍受","歷經反覆學習，我的烹飪功夫總算「班門弄斧」"],"C"],[115,0,2,"下列文句「」中的用語，何者最適切？",["面對各類型客訴，只要能「振振有辭」依法合情辦理，便是最好的處理方式","科技業與歐、美之間的關係「三人成虎」，成為國際事務談判時的重要籌碼","傳統文化重視「安土重遷」的觀念，深植人心，不會隨意搬離家族居住之所","執行長的決策往往影響公司未來發展，錯誤決策即使補救也是「望塵莫及」"],"C"],[115,0,3,"下列「」中成語的使用，何者最適切？",["豪大雨後，災民只能「抱殘守缺」，暫居臨時收容所","善於「逢迎拍馬」的人具敏感度，是極佳的公關人才","疫情期間指揮中心「雷厲風行」封鎖社區，防止擴散","小華「處心積慮」完成了招標文件，以零疏失為目標"],"C"],[115,0,4,"下列「」中的成語，使用正確的是：",["這個方法相當有效，真是「屢試不爽」","我就像「老驥伏櫪」，已經虛弱得無法起身了","他這個人沒有什麼特別的長處，真是「別無長物」","每到全民防空演習的時候，街道總是「萬人空巷」迅速淨空"],"A"],[115,0,5,"「莊子在山中看見一棵大樹，枝葉繁盛。伐木的人卻不砍伐，並說：『因為這棵樹沒有可用之處。』莊子因此說：『這棵樹因為沒有用反而能活下來呀！』莊子又說：『大家只知道有用東西的好處，不知道沒有用的東西也有好處。』」根據上文，下列選項何者最符合莊子的觀點？",["無用之用","體用合一","廢物利用","大而無用"],"A"],[115,0,6,"下列成語，何者與教育無關？",["如沐春風","桃李滿門","程門立雪","陽春白雪"],"D"],[115,0,7,"「我們說陸羽《茶經》是經典，主要是它對人類文化發展做出了經典性的飛躍與提高。陸羽非常具體知道他在做什麼：他創製了二十四種茶具，規定了飲茶的儀式，把喝茶化作生活藝術，讓喝茶的人按部就班進入茶飲的天地，進入淨化心靈的程序，由此得到一種毫不攙雜任何功利的純粹的歡娛。」根據上文，下列選項何者不是《茶經》的核心價值？",["撰寫茶文化專書，開創茶學經典化","訂定飲茶的流程，建立茶禮制度化","提升飲茶的層次，茶道境界藝術化","發展品茶的市場，促進茶業娛樂化"],"D"],[115,0,8,"「毛玄很有才氣，也很自負。他常對朋友們說：『我寧可像蘭花、像美玉一樣地摧折、破碎，也不肯像蕭、艾這些雜草一樣地茂盛興旺。』」根據上文，下列選項最符合文意的是：",["寧為雞口，無為牛後","寧可玉碎，不為瓦全","寧為太平犬，莫作亂離人","寧可無了有，不可有了無代號：1501頁次：8－2"],"B"],[115,0,9,"「我們讀書，不就是為了明白萬事萬物的道理嗎？不就是為了知道怎樣為自己的存在找一個座標嗎？不就是在浩瀚無邊的知識荒野裡，給自己的生命一個解釋嗎？在有涯之生，我們還得勉力為之，才有機會更加接近智慧的靈光。在慢慢的累積中，我想跟你一起看見，生命飽滿低垂，日月各安其位。」根據上文，下列選項最適合填入中的是：",["君子生非異也，善假於物也","蓬生麻中，不扶而直；白沙在涅，與之俱黑","不積跬步，無以至千里；不積小流，無以成江海","青、取之於藍，而青於藍；冰、水為之，而寒於水"],"C"],[115,0,10,"「早年美國的西部墾荒者，當自己一個人深夜坐在小木屋的孤燈下，無事可做時，經常會把屋裡可以弄得響的東西弄得喧天價響，藉以排遣漫漫長夜的孤單和恐懼。他們恐懼的不僅是森林中的野獸，還有心中的自我，他們的意識怯於和自我對晤，羞於傾聽自己的內在之聲。現代人雖然不必再恐懼森林中的野獸，但卻近乎強迫性地以各種工作、娛樂和瑣事來填塞自己的生命，寧可閱讀報紙的分類廣告，也不願閱讀自己；寧可對貓狗說話，也不願和自己交談。」根據上文，下列選項何者最符合題旨？",["在森林中遺世獨立，才能真正地感受孤獨","自我對話可藉由感受孤獨、恐懼加以提升","孤獨提供觀照自我，整理自己的絕佳機會","與其追求熱鬧喧嘩，不如靜默中體驗孤獨"],"C"],[115,0,11,"甲：「語言和文字是民族智慧的密碼。華人用農民曆指導農耕與節日，而布農族雖無文字，自古以來使用木刻畫曆，在構樹樹皮上刻下工作與祭祀的符號。」乙：「臺灣原住民中，排灣族與布農族有行事曆類型的文物。1937年，學者在南投一位布農人家中發現木刻畫曆，上面以象形符號記錄農事、出獵與祭儀，被認為是布農族的文字，並象徵該族群擁有獨特的書寫系統。」根據上列兩則敘述，下列選項何者最符合文意？",["甲乙二文認為漢人與原住民都使用農民曆","甲乙二文對於「文字」的認知與定義不同","甲文認為布農族的木刻畫曆源自華人農民曆","乙文認為木刻畫曆是排灣族獨特的歷史文物"],"B"],[115,0,12,"「所有參賽選手尤其曾患有心血管疾病、癲癇、氣喘及其他重大疾病者，請確認您在生理及心理上均有能力參與符合參賽資格之運動種類，且醫療專業人員並未給予您參賽有不良後果及身心受損之其他建議。主辦單位並未要求參賽選手須於賽前接受醫療檢查，對於任何生理或心理上無法參賽卻選擇參賽之選手，應自行負擔醫療的完全責任，惟主辦單位提供在賽場上必要的醫療協助。」以上出自世界壯年運動會的自我健康評估書，下列對參賽選手的提醒，何者正確？",["均須提供健康檢查證明書","需自行於賽前確認生理心理健康","曾經罹患重大疾病者不得報名參賽","對於比賽時的突發狀況請自行尋求協助"],"B"],[115,0,13,"「研究顯示，當消費者開始評估使用信用卡來購買新產品的時候，這些受測的實驗者會傾向聚焦在產品的優點上，像是好的設計、功能，而不是價格、運費、保固費用或是安裝費用等等。因為使用信用卡付費很簡便，會讓拿出錢來花費的這件事情減少痛苦，所以會降低實際花費的感覺。因此，使用信用卡的消費者更可能會購買昂貴的產品；但相反的，從錢包裡掏出現金會讓消費者的注意力放在實際的支出上，所以會有一種實際損失的痛感，故而會讓人更不願意拿出大把鈔票來買單價高的商品。」根據上文，下列選項何者正確？",["使用信用卡消費，不會讓人產生實際損失的痛感","價格、運費、保固、安裝等，會降低使用信用卡消費者的疑慮","針對信用卡的消費特性，可適度提高商品單價，增加銷售利潤","以產品設計和功能的優點行銷，較能提升消費者使用信用卡購物意願代號：1501頁次：8－3"],"D"],[115,0,14,"「酒精被認為是能讓神經運作減緩的鎮定劑，這跟人類大腦的結構與其掌管的功能有關係，當我們剛開始喝酒，大腦第一個被抑制的剛好是位於最外側，負責理性與思考的『大腦皮質』區域。當負責壓抑感情與衝動的大腦皮質功能被減弱後，大腦內側『邊緣系統』掌管的本能與情緒就會顯現出來，平時較為緊繃、刻意保持正經的人，就可能會有不同程度的放飛自我。」根據上文，下列選項何者正確？",["飲用酒類，首先影響大腦外側的邊緣系統","抑制「大腦皮質」能使人壓抑感情與衝動","人類若飲用酒精製品將會增強邏輯思辨的能力","使大腦神經運作減緩是酒精能讓人放飛的原因"],"D"],[115,0,15,"「『判斷整合』是指當生成式AI模型不確定該做什麼，或是在推理過程中缺乏必要的商業或道德背景脈絡時，就需要加入人類判斷力。這是爲了讓人機互動的結果更值得信任。判斷整合需要能領會人類該在何處、何時、以何種方式介入，而它的成效是用AI輸出結果的可靠性、準確性與可解釋性來衡量。」根據上文，下列選項何者最符合文意？",["AI輸出結果的準確性需人機協作才能真正達到","促使AI在推理過程中自動偵測錯誤並提出修改","讓AI在各種情況下可以自動做出最正確的判斷","AI判斷整合成效無法用輸出結果的可靠性衡量"],"A"],[115,0,16,"「當個體處於強大的心理壓力中時，倘若外界給予其暗示或誘導，個體更容易在重組自己的記憶內容時，出現虛假記憶。而這種錯誤並不為個體承認，甚至個體對自己存在的錯誤深信不疑。」根據上文，下列選項何者最符合文意？",["假記憶造成誤會，應避免相信記憶","記憶是一種創造過程，不是很可靠","重組記憶時，應確認心情是平靜的","懷疑自己記性，才能避免虛假記憶"],"B"],[115,0,17,"以下為一家人討論承租店面的對話：父親：「這個店面門口空間大，旁邊的公園也有停車場」母親：「而且租金合理，設備又齊全」女兒：「可惜原本附近的大學遷走了」兒子：「沒關係，周遭有兩個工業區」根據以上的對話，誰對於店面的關注重點與其他三人不同？",["父親","母親","女兒","兒子"],"B"],[115,0,18,"「為設計內容豐富的、具有說服力的迷人體驗，你不能只選擇堅守一個領域；相反的，要利用體驗的框架作為驅動的因素，以幫助你創造性地探索每一領域中的各個面向，這些面向會使希望展示的體驗顯得更加特殊。如滑雪度假中心規劃的滑雪體驗，除了提供基本設備之外，還有山脈的場景，以提供課程、安排交通、纜車動線等，如此才能設計全方位的活動內容。」根據上文，下列選項最符合文意的是：",["規劃滑雪體驗，基本設備為最迷人的驅動因素","堅持活動的專業，才能為顧客設計更好的服務","以體驗為驅動的誘因，設計需要連結在地文化","具有說服力的迷人體驗，需廣泛涉獵各個領域代號：1501頁次：8－4"],"D"],[115,0,19,"「景觀是因為人的重視而存在，人之所以重視某棵樹的景觀價值，通常是因為對那棵樹有情感。如阿里山的櫻花樹，最早是因為日本人思鄉而種植，後來則是阿里山的代表性景觀，隨著一代代後人在這塊土地成長，成為許多人的重要回憶。」根據上文，下列選項何者最符合文意？",["阿里山的櫻花樹，其景觀價值在於品種來自於日本","日本人種植櫻花樹，是為了讓當地景觀更具吸引力","人們重視樹的植栽景觀價值，通常是基於情感連結","景觀的設計主要是因為人們思鄉，賦予了美學意涵"],"C"],[115,0,20,"「有一個實驗是把一句話中的一個字剪掉，用一個咳嗽聲音取代，然後播放給受試者聽，請他們寫出所聽到的句子，所有人都能正確寫出，但是告訴他們句子中曾有一聲咳嗽，請他們標出咳嗽出現的地方，則幾乎所有人都做不到。前面的句意已使大腦自己填補了被咳嗽聲遮蓋過去的字。」根據上文，下列選項何者最符合文意？",["與人溝通時傾聽的重要","環境噪音不會影響聽力","人能根據語意補足句子訊息","背景知識會覆蓋錯誤的訊息"],"C"],[115,0,21,"「這麼多年的看牙經驗讓我明白，蛀牙是只能治療，不能痊癒的病。牙醫能做的，只有用鑽子鑽開堅硬的琺瑯，把蝕壞的部分除去，再用別的東西覆蓋，可是那鑿開的洞，是永遠在那裡了。蛀牙的當下，就預告了這顆牙的未來不會更好，只會更糟，就像某些事情一旦發生，便再也無法彌補。」根據上文，下列敘述最適當的是：",["蛀牙能根治，須對症下藥，耐心治療","凡事都能挽救，就像治療蝕壞的蛀牙","聞過則改，不能文過飾非，就像補牙","世事猶如補牙，只能暫蓋，無法根治"],"D"],[115,0,22,"「從前自小鎮望出，在想像裡，島的樣子是中央山脈與海岸山脈之間的天空，從小小的視野想像大大的島。後來才知道島也就這麼小。北上數年，漸漸開始改從島望向山裡的小鎮。島還是一樣小，小鎮已縮至模型般大小，不斷在記憶裡搬運鎮景，想把他們擺在正確位置。小鎮太小，在記憶裡通通擠成一塊。」根據上文，下列選項何者最符合文意？",["隨著年紀的增長，島的樣子也因視野的改變而變大","滄海桑田，現在的小鎮因人口外移而縮小，引起無限感嘆","隨著不斷搬遷與探索，想像中的小鎮景物始終如一，毫無變化","年少時想像小鎮之外，長大離家後思念家鄉，才發現記憶已經模糊"],"D"],[115,0,23,"「《歐普拉秀》是觀眾人數高達四千八百萬人，在一百五十餘個國家播出的美國人氣節目。主持人歐普拉的著作至今已賣出五千五百萬本。當脫口秀主持人唐納修被問及歐普拉為什麼比自己更受歡迎的原因時，他這麼說：『歐普拉在討論體重、男人、單身女性的真實生活時，比我更加坦率。』」根據上文，下列選項何者最符合文意？",["懂得積極傾聽對方，讓對方深刻感受到存在感","談論自己的故事，才能不斷帶來愉悅和成就感","為了深度溝通，應向對方坦承自己的感情生活","真誠地表露自己的內心，可以拉近彼此的距離"],"D"],[115,0,24,"「貓是獨立的生物，然而一旦生病，就會呈現脆弱，彷彿從固狀軟成液狀，流向、湧向，並浸沒照顧牠們的人。當牠們身心堅固時，可以各不相干，但液體卻會互相滲透。育養並不全然是親密，而是包含著責任、規條、嚴厲、施與受、脅迫——那是一種強硬的愛。」根據上文，下列敘述何者正確？",["「那是一種強硬的愛」，指的是飼養貓時不宜太過於溫柔，必須維持界線","「固狀軟成液狀」，指的是貓溫順親人的天性，而此時牠們正開心地撒嬌","「身心堅固時，各不相干」，指的是健康的貓大多表現出獨立自主的天性","「液體會互相滲透」，指的是貓與貓之間透過叫聲，建立相互溝通的關係代號：1501頁次：8－5"],"C"],[115,0,25,"「許多心理學家與精神學家的報告證實，人們在青春期獲得的記憶，比其他時期更刻骨銘心，被稱為『記憶突點』。某神經科學博士曾道：『小時候我們受吸引和喜歡的事物，往往能產生持久影響力，比我們生命遇到的許多其他事物來得更重要。』這些回憶往往是『快樂』的，所以往往得以被『記憶體』留下，不致遺忘。」根據上文，下列選項何者最符合文意？",["近期好萊塢有大量懷舊電影回歸，因為觀眾總是會買票進場，觀賞那些他們年少時期記得的事物","想要記住某件事情，最重要的是要留意正在發生的事情，因此需要做到兩件事情：感知與注意力","人們到了某一個年紀，聽到新的音樂總會覺得比不上以前，這是因為見多識廣，品味已經改變了","老兵愛提當年勇，爸爸愛說當年有多帥，是因為人生已來到下半場，重提往事可以讓他常保年輕"],"A"],[115,0,26,"國立故宮博物院的展覽文案寫到：「在往昔以男性為中心的傳統社會裡，女性經常是相對無聲的一群。女性如何立足於歷史？他們留下哪些足跡？這次例行展就從女性史主題出發，以在小說或戲劇中依然令人熟悉的『清朝公主』為主軸，來嘗試摸索這些課題。以本院所藏清宮檔案文獻為主，呈現清朝公主的身分制度、人際關係、生命故事。在這些文獻裡，也許我們能找找看，歷史主流敘事之外的人們，留下了什麼樣的聲音與姿態。」根據上文，下列何者最適合作為清朝公主特展的主題？",["幸福快樂的日常","彰顯地位的服飾","生命意義與價值","背負的外交使命"],"C"],[115,0,27,"「蘭嶼機場的維護與擴建，讓蘭嶼與臺東兩地的機場成為達悟族人的現代進行式，相聚與離散的計程車站，花開的美豔如是新生嬰兒的誕生；花落的淒涼也宛如是老者的仙逝，交通的便利也把人生的喜氣與悲憫轉化成短暫的聚與離，魚湯的鹹與淡的感官感觸。我們不得不說便利帶來了流星般的聚與離，感情線劇烈縮短。」根據上文，下列最符合文意的是：",["蘭嶼機場擴建不只帶來經濟發展，也縮短兩地的文化差異","蘭嶼機場擴建雖然便利，但作者對於文化被忽略而感憂心","蘭嶼機場擴建帶來的方便，使人生聚散變得快速卻也孤獨","蘭嶼機場擴建增加了達悟族人的生活領域，且更為現代化"],"C"],[115,0,28,"「所謂生物塑膠並沒有統一的定義，生物塑膠包括了『生物基質塑膠』以及『生物可分解塑膠』。生物基質塑膠是指由生物質資源（例如糖，澱粉，植物油和植物材質）製成的塑膠，並再分成『生物可分解』以及『不可生物分解』兩種。『生物可分解』一般表示在某些嚴苛的環境條件下這樣的物質可以在一定期限內被微生物分解，另外一種『生物可分解塑膠』為『生物可堆肥塑膠』，指分解過程將產生堆肥或腐殖質，可以與有機廢物一起添加到工業堆肥中。」下列選項，可明確從文章敘述得知的是：",["生物可分解塑膠分解後可產生堆肥，也可添加到工業堆肥","生物可分解塑膠可以在任何環境下自然分解","生物塑膠的生產過程完全不依賴石化材料","所有生物塑膠都是可分解的"],"A"],[115,0,29,"「害怕孤獨的人為了裝作一無所瞞，以爭取想像中的友誼，於是開始訴說祕密。祕密換祕密，那是朋友的定情儀式，但我們不說自己的祕密。訴說別人祕密是一種無本生意，也是一種聲東擊西的詭計。當所有人都忙著訴說其他人的祕密，自己的祕密就擺脫了被刺探的危險。想要掩人耳目，是另一個人祕密開始出土的原因。」根據上文，下列選項最符合文意的是：",["說人祕密可以製造仇恨，仇恨可以拉近人際距離，這是祕密的詭計","祕密是對付孤獨的良方，若世上一旦沒有了祕密，人會變更加冷漠","祕密帶來人際的歸屬感，但人只想知道別人祕密，卻不願被挖祕密","不說是非，不成是非人，人若不想被人刺探祕密，就不該製造祕密代號：1501頁次：8－6"],"C"],[115,0,30,"「過去我們總想盡辦法阻止洪水發生，堤防越蓋越高，人與環境的關係越來越疏遠，危機意識也變得越加薄弱，以致不知該如何面對越發頻繁的淹水。其實大至政府調整治水預算的方式，小至生活中推廣與水共生的環境教育，你我都可以施展一己之力。當我們培養了這種『承洪韌性』，同樣也可以建立起面對高溫、乾旱，乃至各種極端氣候變遷的韌性。」根據上文，下列敘述最適當的選項是：",["修建堤防是過時的防洪思維，無法因應當前頻發的極端氣候","人類必須放棄調節自然的想法，否則環境的惡化將越演越烈","現代社會培養防災能力的重點，在於改變人類與環境的關係","每個人對於極端氣候變遷都有責任，已成為社會各界的共識"],"C"],[115,0,31,"「團體認同可能只是個暫時性現象。人們會換工作、搬家，有時候還會移民。不過對於先前所屬團體的集體情緒，往往在我們不再屬於那個曾認同的團體之後，還會持續下去。那是因為團體以及構成團體的個人，他們的集體理性情緒如果是無條件而且無從改變的，那麼他們從中獲得的優勢，某個程度來說就會放大。倘若少了這些特質，團體就不太能對敵對團體構成威脅。」根據上文，下列選項何者正確？",["人們因換工作或搬家、移民，將會失去曾認同團體的情緒","我們不屬於該團體，也將因該團體的集體情緒而獲得認同","團體認同只是暫時性的現象，團體不必過於在乎形塑認同","團體內部無條件的團體認同，往往可對其他團體構成威脅"],"D"],[115,0,32,"「牛津大學心理學教授曾指出：人一次只能維護大約150段人際關係。因此，若將人生想像在一個『房間』，意即同一時期只能與離你近一些的大約150人維持真正的關係，這說明與人維持關係需要花費時間與注意力，即使認識1,000人，仍需面對時間與精力的限制。」下列選項，何者最切近本文表達的人際關係觀點？",["人際關係取決於專業能力的高低","能夠維持真正人際關係的能力是有限的","維持所有人際關係都要投入同等程度的心力","在人際互動中應避免情緒表達以保持和諧關係"],"B"],[115,0,33,"「我們都忘了，從來沒有一段關係是理所當然的。但是每一段關係，隨時都有可能消逝得彷彿從未存在過一樣。而在友情裡，我們常會忘記多問候一句『近來可好』；在愛情裡，我們常常忽略對方所做的『雞毛蒜皮的小事』；在親情裡，我們總是吝於和摯愛的家人說聲『我愛你』；甚至，我們從未對認真活過每一天的自己說聲『辛苦了』。但是人與人的關係，隨時都可能『離別』，清楚這一點，我們就能更珍惜人與人的相遇。」根據上文，下列選項何者正確：",["對於雞毛蒜皮的小事，實無需掛記","把握當下，更要珍愛自己和身邊的人","當心中有想法時，無論好壞都要說出口","因隨時可能「離別」，所以人生不必太嚴肅"],"B"],[115,0,34,"「當作者闡述理念主張時，以高於讀者的姿態寫作，或平實懇切的語調，作用完全不同。當作者所訴求的是跟自己理念相同的人，使用激昂語調能鼓動人心。反之，若沒能掌握讀者屬於哪個階層或群體，便應假設讀者對所論主題，沒有任何先入為主的想法。這時作者不宜站在制高點，過於激昂甚或使用責備與教訓意味的語言。這時使用分析式語言和懇切語調，更能字字打入人心。」根據上文，下列選項何者最符合文意？",["若讀者無先入為主的立場，宜用激昂語氣強調理念的感染力","若讀者對主題已有既定想法，作者宜採取教訓的語言來更正","作者無法確認讀者立場時，宜選擇以分析和懇切的語調溝通","作者面對理念相同的讀者，宜避免過於激昂導致理念被曲解代號：1501頁次：8－7"],"C"],[115,0,35,"「光陰推移到了後臉書年代，『朋友』對我們而言到底算什麽？只消指尖點擊邀請，加入名單，認識的不認識的，說過話的，買過書的，隱約聽過這名字的，即便我們終其一生彼此交集、能記下綽號面孔的人，不過兩三百個，但大部分的資深臉書使用者都很輕易就超越了這數目。可以確定的是，他們大多數不是『真正的』──於現實生活裡定義下的朋友。」根據上文，下列選項最符合文意的是：",["後臉書時代，人們透過臉書好友，可以賣書、推銷、拓展事業，臉書成了變現工具","現實與虛擬對於朋友的定義不同，臉書將人際網絡變得隱約浮泛，並非真正的友誼","現實生活愈自卑的人，愈依賴臉書交友，我們應當關注後臉書時代人心孤寂和疏離","網路形形色色，真假虛實難分，很多人佯裝熟識，透過臉書不斷拓展自己人際版圖二、複選題（第36題至第45題，占30分）說明：每題3分，所列的五個選項，其中至少有二個是正確答案。各題之選項獨立判定，全部答對者，得3分；答錯一個選項者，得1.8分；答錯二個選項者，得0.6分；所有選項均未作答或答錯多於二個選項（不含二個）者，該題以零分計算。"],"B"],[115,0,36,"下列文句「」中的成語，使用適當的是：",["這裡隔音設備極佳，外界的喧囂能阻絕到「充耳不聞」","再大的風雨也「不可終日」，總會等到撥雲見日的時候","科技更新的速度「江河日下」，產業也要快點跟上腳步","生意穩定令他「躊躇滿志」，決定籌措新資金開連鎖店","該部門因業務量銳減而「人浮於事」，可能會精簡人力"],"DE"],[115,0,37,"「商場上瞬息萬變，身為公司的領導者，必須時時學習新知識、導入新觀念，不能□□□□，否則很快會被消費者淘汰。」根據文意，□□□□中適合填入的成語是：",["沽名釣譽","墨守成規","膠柱鼓瑟","刻舟求劍","守株待兔"],"BCDE"],[115,0,38,"「出門在外，凡事要□□□□，不要讓長輩失望。」根據語意邏輯，□□□□處適合填入的成語是：",["未雨綢繆","好自為之","自求多福","得過且過","虛與委蛇"],"ABC"],[115,0,39,"「『凡事豫則立，不豫則廢』，是《禮記・中庸》裡的一句話，這裡的『豫』是預先的意思。講的是：不論做什麼事，事先做好準備，就能得到成功，不然就會很容易失敗。」根據上文，下列選項符合文意的是：",["有時候問題很複雜，答案卻很簡單","計畫的制訂，遠比計畫本身更為重要","確認你是做正確的事情之後再開始，那就絕對不會有錯","計畫，指引我們前進的明燈，是我們贏得成功的時間表","如果有1小時拯救世界，應該花55分鐘確認問題，再以5分鐘尋找解決方案"],"BD"],[115,0,40,"「脂肪酸可分為飽和脂肪酸、不飽和脂肪酸，兩者化學結構不同，性質也不同。飽和脂肪酸的形狀平直，可使油品容易凝固，例如豬油。不飽和脂肪酸會使油品在常溫下呈現液態，例如葵花油、橄欖油。」根據上文，下列選項符合文意的是：",["豬油是不飽和脂肪酸","葵花油是飽和脂肪酸","橄欖油在一般常溫下容易凝固","飽和脂肪酸與不飽和脂肪酸的性質不同","不飽和脂肪酸的化學結構與飽和脂肪酸不同代號：1501頁次：8－8"],"DE"],[115,0,41,"「人的思想具有懶惰性，一旦受思維慣性的影響，或其注意力發散，就會在判斷或決策時，懶於深入分析，忽略當前的複雜情況。然而，世界是極其複雜，人們稀缺的精力相對於複雜的情況，會無可避免的產生矛盾，於是人經常選擇最為輕鬆的處理方式。由此可知，錨定效應的影響，根本在於人對直覺的依賴。」根據上文，下列選項符合文意的是：",["面對紛雜困難的問題，應該以簡單的心境去面對","儘管直覺說不出原因，仍是化繁為簡的最佳利器","人可能依賴一開始的直覺，未充分思索而下決定","形成慣性就能節省精力，卻可能導致簡化了問題","我們所做的錯誤決策，起源於自己注意力不集中"],"CD"],[115,0,42,"「十多年前，臺灣最慢的火車，最短區間的里程，最便宜的旅次，票價是11元。比如，池上至富里、壽豐至志學、萬榮至鳳林之類。有趣的是，如今它們幾乎都集中在花東縱谷。質言之，11元潛藏著，緩慢的節奏、淳樸的生活、迷人的風物。更湊巧的，『11』也隱含著另一層意象：『我是坐11路來的』，以二條腿旅行。十多年來，我的漫遊，如是不斷地實踐著。從東部到西部，從北迴到南迴。」根據上文，下列選項符合文意的是：",["節省經費，常可提升鐵道旅行中更具價值的生活節奏與質樸風貌","花東縱谷「11路」旅遊線，展現池上到富里特有的淳樸生活方式","即便僅有11元，亦可一覽臺東與花蓮的整體風光以及迷人的風物","不必耗費鉅資，亦可體驗鐵道之旅的緩慢步調，與地方文化魅力","作家期許以徒步方式實踐在臺灣各地的旅遊，深度體驗地方文化"],"DE"],[115,0,43,"「如果你吃了自己覺得不好吃的東西，或者是覺得消化不了的東西，本能的反應就是想吐。這時候嚼點薑，讓薑汁進入到胃裡後，就可以把胃溫熱。而且會覺得吃掉的東西可以消化掉，也不會再想吐。」根據上文，可以推知：",["薑具有止吐功能","薑進胃中能驅寒","以薑佐食可降低食慾","以薑拌菜不利於消化","以薑入藥有助於腹瀉治療"],"AB"],[115,0,44,"「為了避免氣候變遷帶來最可怕的後果，全球居民必須在本世紀中葉達成淨零排放的目標。這表示我們需要負排放的解決方案，也就是說，從空氣中吸走的碳量要比我們生產的碳量更多。我們可以利用科技方法達成目標，像是碳捕集和碳封存，或是利用以自然為基礎的解決方案，如森林保育及恢復土壤的吸收能力。」根據上文，下列選項正確的是：",["碳捕集和碳封存，是能夠實現淨零排放的一種途徑","利用科技方法保育森林，就能使土壤恢復吸收能力","如果能恢復土壤吸收能力，自然能達到減碳的效果","最好的解決方案是減少碳排放，讓碳排放量歸於零","淨零排放的主要目標為產生與吸收的碳量完全相等"],"AC"],[115,0,45,"「可信度是新聞成立的要素，消息來源是專家因經驗豐富，對於事件提出的主張或詮釋具有可信度，因為他的話比記者說的更具份量，因此，提到他的資歷是必要的。但是記者往往也會犯下錯誤，過分強調其資歷，而忽略講話的內容。即使發言的是業界權威，但只要他說的含糊不明，晦澀難懂，或只講一些顯而易見的道理，那就不值得引述。」根據上文，下列選項符合文意的是：",["記者應該消化好權威人士的意見再重新敘述，更加親切","不明確的專家意見對於新聞可信度，沒有任何正面幫助","權威人士發言多是顯而易見的道理，可以作為消息來源","引述專家話語時，作者必須謹慎判斷其內容才有可信度","新聞報導要詳細介紹專家資歷，因為觀眾只信任專家身分"],"BD"],[115,1,1,"一家合成石材生產廠商將未經處理的工業廢水排入河流中，經民眾舉發後，政府要求該廠商限期改善並處以罰鍰。依上所述推判，下列敘述何者正確？",["罰鍰的目的在於要求廠商重視社會資本","民眾對該石材產品的市場需求量將增加","該石材產品的市場供給曲線將向右移動","污染行為未被發現前，廠商的私人成本低於社會成本"],"D"],[115,1,2,"臺灣對美國貿易長年處於順差，所謂貿易順差是指：",["對美國出口值大於其他國家","出口大於進口","出口小於進口","對美國進口值小於其他國家"],"B"],[115,1,3,"下表是某製衣廠四位員工每小時可生產衣服和長褲的數量，若以機會成本的觀念來比較，在其他條件不變下，那一位員工生產長褲具有比較利益？員工甲乙丙丁衣服8 12 4 5 4 14 6 12長褲",["甲","乙","丙","丁"],"D"],[115,1,4,"新興的物聯網掀起工業革命4.0（又稱第四次工業革命），被認為將影響且改變未來工業生產樣貌，其透過技術整合將傳統工廠轉變成自動化智能工廠，使產能與生產效率都能提升。若以X軸代表電子產品，Y軸代表生物科技產品，則此技術將使生產可能線呈現下列何種變動？",["生產可能線為垂直線且往右移動","生產可能線為負斜 於民事共同訴訟之敘述，下列何者正確？",["訴訟標的對於共同訴訟人必須合一確定者，為普通共同訴訟","必須全體共同訴訟人一同起訴者，為類似必要共同訴訟","訴訟標的必須合一確定，無須全體共同訴訟人一同起訴者，如其中一人拒絕同為原告而無正當理由，法院得依照原告之聲請，以裁定命該未起訴之人於一定期間內追加為原告","訴狀送達後，該訴訟標的對於數人必須合一確定者，原告得追加原非當事人之人為當事人"],"D"],[115,2,28,"關於民事訴訟法上訴訟能力之有無，下列敘述何者正確？",["滿7歲之未成年人，就有關其與法定代理人間之訴訟，視為有訴訟能力","15歲未婚之人，得為有效之訴訟行為","成年人經宣告為受輔助宣告之人者，其提起訴訟，應經輔助人同意","外國人依其本國法雖有訴訟能力，如依中華民國法律無訴訟能力，視為無訴訟能力"],"C"],[115,2,29,"甲列乙為債務人，以乙向甲買受A車，積欠車款為由，向法院聲請發支付命令（下稱「本事件」）。關於本事件之審理，下列敘述何者錯誤？",["如乙之住所及居所均不在受理本事件法院之管轄區域內，法院應駁回甲之聲請","如甲未表明其已履行對待給付之情形，受理本事件之法院得駁回甲之聲請","如甲未就系爭買賣契約之存在提出任何可供即時調查之證據，受理本事件之法院得駁回甲之聲請","受理本事件之法院為使乙有答辯機會，應訊問乙"],"D"],[115,2,30,"有關共有土地之分割，下列敘述何者錯誤？",["共有土地一定要訴請法院才能分割","法院判決分割共有土地時，仍得使部分共有人就特定部分維持共有關係","共有人相同的數土地，除法令另有規定外，共有人得請求合併分割","共有人部分相同之相鄰數土地，各該土地均具應有部分之共有人，在一定條件下，得請求合併分割"],"A"],[115,2,31,"17歲之甲所為之下列何項行為，須經法定代理人之同意，始生效力？",["訂立遺囑，贈送一半之財產給阿姨","被授予代理權，替本人為代理行為","接受一棟房屋之贈與，該房屋設定有普通抵押權","暑假期間受僱於加油站打工"],"D"],[115,2,32,"甲之司機乙，因連續超時工作，精神恍惚，接甲上班途中闖紅燈撞傷路人丙，丙共受有新臺幣（下同）10萬元的損害，其遂請求甲、乙連帶負損害賠償責任。下列敘述何者正確？",["乙闖紅燈的行為，並非執行職務的行為，故甲無須負責","雖甲讓乙超時工作，但甲選任乙時，已確認其具有駕照且無違規紀錄，且監督乙執行職務時亦再三告誡乙應遵守交通規則，故甲不負賠償責任","若甲賠償丙全部的損害，甲對於乙僅就5萬元的部分有求償權","若丙因甲選任及監督乙執行職務已盡相當注意而不得請求甲賠償，法院因丙之聲請，得斟酌甲與丙之經濟狀況，令甲為全部或一部之損害賠償"],"D"],[115,2,33,"甲將其名錶設定質權予乙，以擔保其向乙之借貸債務。就占有之狀態而言，下列敘述何者正確？",["甲為直接占有人，乙為間接占有人","甲為間接占有人，乙為直接占有人","甲為直接占有人，乙為占有輔助人","乙為間接占有人，甲為占有輔助人"],"B"],[115,2,34,"甲男、乙女結婚，因感情不睦離婚。離婚後，甲欲與丙女結婚，丙為乙之母親。甲、丙婚姻效力如何？",["有效","經乙之同意始生效力","得撤銷","無效"],"D"],[115,2,35,"下列關於堂兄弟間親屬關係之敘述，何者正確？",["二親等旁系血親","三親等旁系血親","四親等旁系血親","五親等旁系血親"],"C"],[115,2,36,"甲向乙購買轎車一輛，乙以移轉所有權之意思，交付休旅車一輛於甲，甲同意乙之清償行為。關於乙之清償行為，涉及民法何項規定？",["代物清償","新債清償","間接給付","占有改定"],"A"],[115,2,37,"民法第745條規定，「保證人於債權人為就主債務人之財產強制執行而無效果前，對於債權人得拒絕清償」，上述保證人之權利為何？",["窮困抗辯權","時效抗辯權","先訴抗辯權","同時履行抗辯權"],"C"],[115,2,38,"甲生前對乙負有新臺幣（下同）100萬元之債務；其於死前半年，因其長女丙結婚，而贈與嫁妝80萬元。甲死亡時，僅留下現金60萬元，且上述100萬元之債務尚未清償。倘甲之繼承人為長女丙與次女丁，下列敘述何者正確？",["丙應於40萬元之限度內，單獨對乙負擔清償責任","丙應於100萬元之限度內，單獨對乙負擔清償責任","丙丁應於60萬元之限度內，對乙負連帶清償責任","丙丁應於100萬元之限度內，對乙負連帶清償責任代號：3501頁次：4－4"],"D"],[115,2,39,"司法警察詢問被逮捕之犯罪嫌疑人時，忘了告知犯罪嫌疑人可以保持緘默，不須違背自己之意思而陳 ,[114,0,14,"「從沒有人因為缺乏香料而死，但卻有成千上萬的人——包括掠奪者和受害者為它而死。控制豆蔻、肉桂和黑胡椒等重要香料交易而產生的私欲，使歐洲商業強權犯下許多暴行。然而，若沒有香料貿易帶來的財富，恐怕根本不會發生文藝復興。大仲馬曾說：『在香料刺激造成的興奮影響之下，智能的表現達到高峰。提香的畫作是否香料的功勞？我忍不住要這麼想。』」根據上文，關於香料的敘述，不符合文意的是：",["歐洲商業強權爭奪香料控制權時，曾殘忍的傷害許多人","香料是生活必需品，不可缺乏，所以引發激烈的爭奪戰","香料貿易所帶來的財富，有助歐洲文藝復興運動的推動","大仲馬認為提香的繪畫成就，可能受到香料刺激的影響代號：1501頁次：8－3"],"B"],[114,0,15,"「古代文人多年以來，受傳統影響，最愛講道理，不談事功。在帝制下的臣相賢士，只是向君王個人盡責，肯不肯多做事沒大關係。因此，老成持重，乃是最高的大臣風範。王安石這位首相不來這一套，他明知『遠世有百善，一疵惡皆歸，就求無所得，猶以好名譏』，還是勉力而為，八年新政雖說未竟，但他那種開創、喜事，與愛國精神，是不該抹殺的。」根據上文，下列選項何者最接近作者的觀點？",["肯定王安石勇於任事，能夠以新政實踐理想","文人只要盡責愛國，尊重傳統，就能博得美名","文人多以建功立業為尚，展現老成持重的大臣風範","稱許王安石明知新政有瑕疵，仍勉力而為的開創精神"],"A"],[114,0,16,"「叔本華說過這樣的話：要估定人的偉大，則精神上的大和體格上的大，那法則完全相反。後者距離愈遠即愈小，前者卻見得愈大。正因為近則愈小，而且愈看見缺點和創傷，所以他就和我們一樣，不是神道，不是妖怪，不是異獸。他仍然是人，不過如此。但也惟其如此，所以他是偉大的人。戰士戰死了的時候，蒼蠅們所首先發現的是他的缺點和傷痕，嘬著，營營地叫著，以為得意，以為比死了的戰士更英雄。但是戰士已經戰死了，不再來揮去他們。於是乎蒼蠅們即更其營營地叫，自以為倒是不朽的聲音，因為它們的完全，遠在戰士之上。的確的，誰也沒有發現過蒼蠅們的缺點和創傷。然而，有缺點的戰士終竟是戰士，完美的蒼蠅也終竟不過是蒼蠅。」根據上文，下列選項最接近作者旨趣的是：",["全文譏刺偉人仍不免有瑕疵，而如蒼蠅般的小人亦有價值","戰士之所以偉大，是因為具備「精神上的大」與「體格上的大」","「精神上的大」，距離越近越能看見缺點和創傷，所以偉人和凡人一樣","「體格上的大」，距離越遠所見越小，意謂局外人對事物的觀察將更細微"],"C"],[114,0,17,"「三國時期，晉、吳相爭，吳國大將陸抗生了一場大病，對手晉國大將羊祜善於用兵，且兼通醫道，派人送了一帖藥給陸抗。陸抗毫不猶疑將藥服用，部屬勸止，擔心羊祜的藥是否可靠。陸抗說：『羊祜豈鴆人者。』意思是羊祜縱然在沙場與我為敵，但『藥』就是『藥』。沙場爭馳是一回事，但醫人是另一回事。」根據上文，下列選項何者最符合文意？",["陸抗跟羊祜本來就是好朋友","人道主義應該超越敵我意識","兩軍對陣不是你死就是我活","羊祜送藥給陸抗是通敵行為"],"B"],[114,0,18,"頃歲孫莘老識歐陽文忠公，嘗乘閒以文字問之，云：「無它術，唯勤讀書而多為之，自工。世人患作文字少，又嬾讀書，每一篇出，即求過人，如此少有至者。疵病不必待人指擿，多作自能見之。」此公以其嘗試者告人，故尤有味。（《東坡志林》）文中歐陽脩所言，下列選項何者最符合文意？",["勤讀各種書籍，自然能寫得出佳作","世人讀書太少，故難掌握撰文訣竅","只期待每篇盡屬佳作，則不免得罪人","勤讀書多寫作，便能知自己文章問題"],"D"],[114,0,19,"朱熹〈觀書有感〉：「半畝方塘一鑑開，天光雲影共徘徊。問渠那得清如許？為有源頭活水來。」根據上文，下列選項何者最符合文意？",["將天光雲影加以擬人化，表現雨過初晴的心境","藉著天機盎然景象，寄託作者悲天憫人的情懷","藉自然現象為喻，說明讀書可使心靈更加清明","以所見的自然景象，寄託田園隱居的愉悅心情代號：1501頁次：8－4"],"C"],[114,0,20,"人為萬物之靈。性相近，習相遠。與齊人居，不能不齊言也；與楚人居，不能不楚言也。入芝蘭之室，久而不聞其香，與之俱化矣；入鮑魚之肆，久而不聞其臭，亦與之俱化矣。故曰一方水土一方人，又曰跟著好人學好人，跟著師婆跳假神。（李光庭《鄉言解頤》）下列選項，何者最符合上文中對「人」的看法？",["人具有避惡向善的本性","人擁有分辨好壞的能力","人具備改變風俗的能力","人自然而然受環境影響"],"D"],[114,0,21,"「中國書畫收藏史中最著名的『留白煞星』，恐怕就是好大喜功，自封『十全老人』的乾隆皇帝。他的收藏慾望遠勝其藝術品味，往往在名作上胡亂『塗鴉』。王羲之一張僅二十八字的《快雪時晴帖》，乾隆卻一口氣蓋上一百七十個印章。在黃公望的《富春山居圖》，他幾乎將畫圖留白的地方都填滿文字，更把字句直接寫在山石之上，整個富有靈氣的作品毀於一旦。可幸的是因為乾隆的藝術水平不高，竟然誤把《富》的贗本（子明卷）視為真品，反而將他同時擁有的真跡（無用師卷）當作贗品，束之高閣並且未題一字。這幅不朽的傳世名作因此倖免於難，這樣的保存下來。」根據上文，下列選項何者符合文意？",["「留白煞星」是收藏家喜歡在留白處蓋印或題字，導致畫面受到破壞","乾隆為避免破壞留白處，在山石上直接題字，成為特有的藝術重置法","《富春山居圖》有許多贗本，乾隆將無用師卷保存得宜，只在子明卷題字，不忍破壞真蹟","因為乾隆有意將真本束之高閣，並且保存得宜，後人才得以見到《富春山居圖》傳世名作"],"A"],[114,0,22,"《楚辭・漁父》說：「滄浪之水清兮，可以濯我纓；滄浪之水濁兮，可以濯我足。」下列選項何者最貼近文中所傳達的處世態度？",["隨波逐流，明哲保身","千鈞為輕，蟬翼為重","避世歸隱，方為正途","擇善固執，各從其志"],"D"],[114,0,23,"「回來隔離第一天，我坐在窗前看馬路上的活動，發現大部分的車子都是白色的，不知道怎麼回事。公車的車頂有各種式樣，有天窗的，有圓孔的。騎摩托車的人則像演員一樣，用肢體表演。我覺得自己就好像剛買回來的金魚，還不能倒入新的水域中，於是和著一些舊的水裝在袋裡，隔著袋子在看著新世界，而尚不屬於它。」根據上文，下列選項何者最貼近作者的感受？",["面對未知未來感到徬徨","讚嘆市民擁有豐沛活力","感覺孤獨想要家人陪伴","對於所見充滿隔閡疑惑"],"D"],[114,0,24,"「對葛蘭姆而言，丹尼雄式的華美服飾，膚淺的情節通通必須拋棄，動作必須強韌獨立地擔任表達的責任。『一隻舉到半空中的手不代表一棵樹或任何東西。把手舉到半空中，只是動作與線條本身的美。如此而已。』摸索純淨有力的表達方式，葛蘭姆不厭其煩地以自己和學生的肢體做試驗品，她在課堂上發展動作語彙，在作品中試驗它的效果。」根據上文，下列對葛蘭姆舞蹈的敘述正確的是：",["倚重服飾和情節來增添戲劇張力","師生在課堂上共同編寫創作而成","強調以肢體動作為主的表達方式","公演作品多為實驗性高的半成品代號：1501頁次：8－5"],"C"],[114,0,25,"「很多人不再有時間去認識東西。他們在商人那裡買現成的東西，但是因為商人並不販賣朋友，所以很多人沒有朋友。」根據上文，下列選項最符合文意的是：",["很多人以為友情是可以用金錢換取，但真正的朋友是無價的","因為朋友尚未商品化，所以人們無法透過便捷的方式來交友","人們為了追求速成，不想花時間了解彼此並且等待關係成熟","工商社會情感淺薄，人際關係疏離因而衍生對朋友過度期待"],"C"],[114,0,26,"下列詩句中，何者沒有表達出詩人的自負感和孤獨感？",["得歡當作樂，斗酒聚比鄰","前不見古人，後不見來者","舉杯邀明月，對影成三人","敏捷詩千首，飄零酒一杯"],"A"],[114,0,27,"孟浩然〈春曉〉：「春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少？」下列解讀，何者完全正確？",["詩中以擬人化手法揣摩群鳥啼聲，如在討論今晚風雨又將掃落多少花瓣","作品中透過酣睡與鳥鳴，營造出春日氣候宜人，充滿了生意盎然的氣息","詩中洋溢惜春、惜禽鳥、惜光陰之情，擔憂風雨中的群鳥是否得以遮蔽","作品中描繪大地的沉睡與甦醒，延伸出人在季節中體悟自然變化的感動"],"B"],[114,0,28,"「皮膚是人體合成、貯藏及釋放維生素D最重要的器官。皮膚需靠紫外線照射來合成維生素D，再經由肝臟及腎臟代謝，形成較強活性的維生素D。維生素D缺乏，在小孩子會造成佝僂病，在大人會產生強直性痙攣或軟骨病。小孩子可能是由於照射陽光太少引起，老年人由於製造維生素D量減少且常使用防曬油，因此也容易造成維生素D缺乏。」根據上文，下列選項何者正確？",["攝取過多維生素D，極容易造成肝臟及腎臟的病變","人體無法自行合成維生素D，必需靠口服補充劑維持","缺乏維生素D的結果，容易導致多種與骨骼有關的疾病","紫外線造成維生素D缺乏，要避免照射陽光及使用防曬油"],"C"],[114,0,29,"「因為沒有家人或個性問題，與人群疏遠的高齡獨居者，藉由不斷地犯罪以求入獄。在獄中有三餐可吃，也不必擔心付不起房租或在路邊孤獨死；更因無親朋好友，既不必介意犯罪或入獄帶來的道德壓力，還能確保衣食無虞。」根據上文，下列選項最符合防範高齡犯罪的方法是：",["提高集合式住宅比例","健全社會的人際網絡","發放愛心待用的便當","改善醫療服務的品質"],"B"],[114,0,30,"「氣候變遷對於太平洋中的島國吐瓦魯是人民生活中天天面臨的威脅。第二十七屆聯合國氣候峰會（COP27）期間，吐瓦魯外交部長柯飛宣布，將建立全球第一個元宇宙國家，把該國珍貴的歷史、文化資產保存在雲端。吐瓦魯這項創舉，同時也代表沉痛的呼籲，全球若無法合作以扭轉暖化趨勢，將有更多大城市淪陷，步上吐瓦魯的後塵。」根據上文，下列選項何者最符合文意？",["吐瓦魯積極尋求永續發展","全球氣候暖化現象已趨緩","建立元宇宙，才可以扭轉暖化趨勢","面對氣候變遷，是全球的共同責任代號：1501頁次：8－6"],"D"],[114,0,31,"「在日本，食品企業向批發商和零售商發送商品時，若是紙箱等包裝出現損壞和汙垢將被退貨，待全面檢查、重新包裝之後再度出貨。但新的生產批次商品已經發送到零售方，因此就只能把較舊的商品廢棄。由於外觀判斷沒有明確的標準，為了減少過度退貨而造成食物浪費，商人們開始採用AI圖像識別的技術，透過智慧手機拍攝紙箱外觀，由AI找出存在膨脹和水漬等疑似汙損的部位。然後再經由資料庫與過去的破損案例比較，對是否應退貨作出判斷，成本也有望得到控制。」根據上文，下列選項最符合文意的是：",["會將包裝破損的商品退貨重檢，是基於商品美觀的考量","由於批次舊的商品經過重新包裝，因此不受零售方歡迎","商品外觀檢測的標準不明確，容易讓人工檢測趨於鬆散","AI判斷退貨的精準度較佳，因而能減少過度退貨的情形"],"D"],[114,0,32,"「世界上似乎有兩類人，他們性格不同：一類人有很強的信仰，而不大需要知識來支持信仰；對這類人而言，知識有時反而是一個障礙。學問愈深，知識愈多，便愈會被名詞、概念所糾纏而見不到真實的道體。所以陸象山才說朱子『學不見道，枉費精神。』另外一類人，並不是沒有信仰，不過他們總想把信仰建築在堅實的知識的基礎上，總要搞清楚信仰的根據何在。」根據上文，關於作者所區分兩類人的差異，敘述最適當的是：",["學術信仰是否堅定","學識積累是否需要","處事方式是否以簡御繁","思考問題是否注重程序"],"B"],[114,0,33,"賈伯斯說：「並不是每個人都需要種植自己的糧食，也不是每個人都需要做自己穿的衣服，我們說著別人發明的語言，使用別人發明的數學……我們一直在使用別人的成果，使用人類已有的經驗和知識來進行發明創造，是一件很了不起的事情。」依據上文，下列選項何者正確？",["立足於既有的經驗進行價值創新","擁有供應方實現對供應鏈的掌控","統合資源與人才提升產業競爭力","強化溝通能力才能滿足客戶需求"],"A"],[114,0,34,"「過去我在醫學院讀書時，教科書是依照組織、系統、疾病作為分類的脈絡的。厚厚一疊又一疊的原文書，難懂又索然無味，為了考試，還是要咬牙切齒地吸收。奇怪的是，到醫院實習開始照顧病人之後，只要跟病人的疾病相關的內容，無論過去覺得多麼艱澀難懂的學問，忽然之間閱讀起來都變得有趣，也非常容易就理解了。」根據上文，造成作者感受如此懸殊的最主要原因是：",["明白人生先苦後甘的常態","找到了讀書的價值與意義","發現可以舉一反三的趣味","對於實作的喜愛優於讀書"],"B"],[114,0,35,"「『關門』很重要的目的是要擋住火災時的熱，記住是熱，不是火，很多人常把火災的熱和火混為一談，要知道火會產生熱，但熱不等於火，就像夏天的太陽會讓我們覺得很熱，但不會讓我們起火，所以用陽傘可以擋住太陽的熱，同樣的道理，木門關起來也會擋住火災產生的熱，銅門、鐵門也都有效果，但是塑膠門、玻璃門就不行。」根據上文，下列選項最符合文意的是：",["塑膠門能擋住熱而不能擋住火","木門只能擋住火而不能擋住熱","發生火災時無論如何都應先關門","擋住熱能幫助人們在火場中存活代號：1501頁次：8－7二、複選題（第36題至第45題，占30分）說明：每題3分，所列的五個選項，其中至少有二個是正確答案。各題之選項獨立判定，全部答對者，得3分；答錯一個選項者，得1.8分；答錯二個選項者，得0.6分；所有選項均未作答或答錯多於二個選項（不含二個）者，該題以零分計算。"],"D"],[114,0,36,"下列選項「」內的詞語，使用正確的是：",["這才藝是學來自娛娛人，難登「大雅之堂」","警察要求與竊盜犯「對簿公堂」，確認他偷盜物品清單","一看這「陋室空堂」的景象，就知道他入住的時間不長","外公入院後，幾位阿姨在病床前守候，「濟濟一堂」，不敢離開半步","她在生命科學的研究，早已「入室升堂」，發表的文章讓人望塵莫及"],"ACE"],[114,0,37,"劉自立剛剛升任司長，如欲致贈匾額，下列合適的題辭是：",["好古敏求","德業日新","道範長存","肩鴻任鉅","選賢與能"],"BD"],[114,0,38,"「農業部澄清，全國遊蕩犬隻控制減量的重要方法，是以科學化、系統性模式，由縣市政府按村里建立轄內遊蕩犬與野生動物保育衝突熱區，集中資源於熱區內全面逐戶清查處置，家犬全數寵物登記、實施繁殖管理與不放養，善盡飼主責任；無主犬隻則視狀況進行捕捉、絕育與回置，有公安等問題無法回置時則將犬隻收容管理，踏實穩健進行遊蕩犬控制工作。」根據上文，下列選項正確的是：",["農業部控制遊蕩犬隻數量的方法，包括絕育而非撲殺","因犬隻與野生動物常襲擊民眾，故設定保育衝突熱區","飼主應對家犬進行寵物登記，並且不隨意放養或繁殖","無主犬隻在特殊狀況下，仍有可能對其進行捕捉收容","農業部以科學化且系統性的模式，讓遊蕩犬得到收養"],"ACD"],[114,0,39,"「四月五，烏沉香插遍山崗古墓。彎形鐮刀只斬五節芒、爬墓藤，不斬家國血脈。數百年來滄桑渡海，何曾畏懼狂浪噬舟？縱使船破人浮，猶掌握一線香袋不容盡濕，遂扶老攜幼，家祠南來。」根據上文，下列選項正確的是：",["描寫清明節的掃墓活動","慎終追遠是不可或忘的文化傳統","「掌握一線香袋」意指配戴廟宇祈求的平安符","「數百年來滄桑渡海」是形容祖先為了謀生，拋家棄子獨自來到異鄉","祖先為了謀生離鄉背井，無論是替人整理墓地，或是冒險捕魚的工作都願意做"],"AB"],[114,0,40,"古之君子有所為、有所不為，即使處於逆境，仍能堅守節操，不同流合汙。根據上文，下列選項何者符合文意？",["時窮節乃見，一一垂丹青","舉世皆濁我獨清，眾人皆醉我獨醒","使其中坦然不以物傷性，將何適而非快","吾不能變心而從俗兮，固將愁苦而終窮","君子之所取者遠，則必有所待；所就者大，則必有所忍代號：1501頁次：8－8"],"ABD"],[114,0,41,"「番薯是原產於拉丁美洲的作物。日文裡的番薯稱為『薩摩芋』，意即來自薩摩地區，這個稱呼主要在日本的本州以北使用，在北九州則有『琉球芋』之稱，可是南九州、沖繩又以『唐芋』稱呼。同樣在中國，浙東地區士大夫編纂地方誌時，就舉出『番芋』是舟山群島的特產之一，並在說明『味甚甘美』的同時，也記載了『種來自日本』，而番薯的『番』是指日本。」根據上文，下列選項何者符合文意？",["番薯雖原產於拉丁美洲，但在亞洲成為重要的主食","日本的本州與南北九州，對番薯有三種不同的稱呼","沖繩對番薯的說法差異，主要是受到經濟文化影響","人們對番薯的各種稱呼，反映對其來源的不同看法","番薯應是舟山群島特產，但中國士人以為來自日本"],"BD"],[114,0,42,"古人曾言「所種者穀，雖瘠土墮農，不生稗也；所種者稗，雖美田疾耕，不生穀也。」根據上文，下列選項何者符合文意？",["水到渠成，不須預慮","江山易改，本性難移","種瓜得瓜，種豆得豆","貧不學儉，富不學奢","蓬生麻中，不扶自直"],"BC"],[114,0,43,"落日千林紫，漁舟聚淺灘。飛蓬雲外沒，野鳥望中還。寺小藏深樹，潮寬點亂山。一樽頻對此，無意羨人間。（宋懋澄〈晚色〉）根據上詩，下列敘述何者正確？",["刻畫景物，藉景抒情","蘊含瀟灑的出世之想","充滿山水意趣，富有情韻","描寫晚景，宛如一幅山水畫卷","近似「夕陽無限好，只是近黃昏」之意"],"ABCD"],[114,0,44,"「畫家在素描時，勒定了所畫對象大約的輪廓後，只以炭筆磨擦出光影的陰暗與明亮，而不做細部的描繪，保持一點朦朧感，以免整個畫面過於呆板。這個階段，就像詩一樣，在光與暗、有與無之間，帶著一點迷濛，一點神祕，一點耐人追索的況味。然而這並非脫離現實，仔細想想，我們在人生裡，大多數的情感都是這樣迷濛的吧！誰能肯定自己的內心無論是哪一刻都清晰無比的呢？」根據上文，下列選項正確的是：",["擅長讀詩的人擁有最單純的心思，對世事經常感到懵懵懂懂","詩在指涉、內涵上的模糊性，常能帶給讀者解釋探索的趣味","詩與素描一樣，都不可進行細部描繪，才能提升整體的美感","思緒清明的人難以享受讀詩之樂，因複雜處能輕易迎刃而解","生命中多數情感一如詩般迷濛，從詩中可以體會人生與現實"],"BE"],[114,0,45,"「ChatGPT或Bing Chat多是提供定義式的短語，回覆的內容主要是『已知』的有限資訊，難以『多義性』的語言表現感知複雜的人類思維。這是因為AI的訓練出自設計者目前的偏好或定見，如果想讓AI更貼近人類需求，就必須仰賴人類持續更新且多樣化的經驗。」根據上文，下列選項正確的是：",["目前AI程式設計者偏好取樣多元的生活經驗","AI現在仍未取代人類思想情感的複雜性表現","AI設計者皆偏愛不受感知影響的科學性語言","目前AI是以短語提供快速單一的資訊為目的","不斷轉型的語言文化和科技趨勢無直接關係"],"BD"],[114,1,1,"目前各國衡量一國的經濟成長常會使用國民所得的數據來顯示，但國民所得的數據只是整體與平均經濟狀況表象，下列何種曲線可以呈現國民所得分配不均程度？",["恩格爾曲線","菲利浦曲線","勞倫斯曲線","生產可能曲線"],"C"],[114,1,2,"某國生產兩種產品（X與Y，分別表示為水平軸與垂直軸），其凹向原點的生產可能曲線上，由左上往右下依序為A、B、C三個點，下列敘述何者正確？",["就生產效率的大小而言，A＞B＞C","多生產一單位X的機會成本為A＞B＞C","就生產效率的大小而言，A＝B＝C","多生產一單位Y的機會成本為A＝B＝C"],"C"],[114,1,3,"跨太平洋夥伴全面進步協定（CPTPP）旨在促進泛太平洋國家間的貿易自由化。依其宗旨判斷，參與此種經濟合作組織的國家，會產生下列何種現象？",["勞動要素可自由流動","各國間實施關稅保護","共同發行統一的貨幣","市場上商品種類增加"],"D"],[114,1,4,"對社會而言，下列那一種財貨或服務的機會成本最低？",["政府提供的免費服務","不具相對稀少性的物品","準備拿來當作肥料的雞糞","無法提升消費者效用的物品"],"B"],[114,1,5,"市場上的生產者與消費者會隨著產品價格的上漲或下跌，不斷地調整其生產或消費行為，最後會達到市場均衡。下列針對此市場均衡的相關敘述，何者正確？",["無謂損失等於零","生產者剩餘達到最小值","社會總剩餘等於消費者剩餘","社會福利等於社會總效益加社會總成本"],"A"],[114,1,6,"假設政府發出公告：「近來國內經濟發展穩定，經政府核定列冊之低收入戶及中低收入戶，政府會加發生活補助，低收入戶每人每月發給750元，中低收入戶每人每月發給500元」。前述政策內容，最符合下列何項理論的內涵？",["符合多數人福祉的效益主義觀點","照顧弱勢者權益的社會平等觀點","追求群體共同利益的社群主義觀點","透過私利實現公益的自由主義觀點"],"B"],[114,1,7,"有學者研究指出臺灣高等教育「反向重分配」的事實：社會地位越高的家庭，相對於較低的家庭，其子女反而能得到較多的政府教育資源。從經濟資本與文化資本兩個概念來觀察，下列敘述何者最能符合題文的描述？",["父母職業聲望對子女社會地位影響力擴大","親子間社會地位的世代流動距離得以擴大","父母的成就動機對子女社會地位流動的影響得以擴大","父母的教育程度高低對子女社會地位流動的影響變小"],"A"],[114,1,8,"有媒體報導，在某國的益智節目中，參賽者被問了一道問題：「在臺灣，人們說食物QQ的，是什麼意思？」答案選項分別是：A.形容媽媽的味道；B.形容食物有嚼勁；C.指食物含有酒精。兩位參賽者討論、思考後，最終決定選擇C，因而錯失繼續挑戰百萬獎金的機會。而在同一報導中，臺灣網友表示，「這就內建在腦袋中，就QQ的，要解釋什麼？」對於上述所反映的文化現象，下列敘述何者最為正確？",["參賽者係身處在該社會環境下的不利處境而無法正確回答","網友認為「QQ」實無須解釋，係反映我族中心主義的優越態度","「QQ」作為一種符號，在不同文化下呈現不同的認知與使用意義","參賽題目設計者認為「QQ」在不同文化下應有著相同的意義"],"C"],[114,1,9,"不少研究發現，在異性戀伴侶中，大部分家務和照顧孩子的工作，是女方責任。根據勞動部統計，2020年育嬰留職停薪初次核付件數，男女比例還是以女性居多，超過8成。綜上所述，從家務勞動的角度推論，下列敘述何者為正確？",["家務勞動的主力是女性，發生於私領域不涉及社會生活","為肯定家務勞動價值，民法規定夫妻要協議自由處分金","家務勞動分工與育嬰的現象與職場上男女薪資差異有關","依勞動參與率計算公式，家務勞動者被歸類為非勞動力"],"C"],[114,1,10,"跨太平洋夥伴全面進步協定（CPTPP）是一個多邊關係的自由貿易協定，成員國人口規模將近5億，總GDP占全球13.1%，貿易值占我國貿易總值超過24%。2021年9月中國提出申請加入CPTPP書面信函，位於亞太地區的我國亦延續加入世界貿易組織的模式遞交入會申請函。根據上述，下列何者正確？",["該組織由美國主導，為印太戰略布局與RCEP互別苗頭","中國申請加入，意在取代美國於該組織中的領導地位","成為該組織成員不以國家為要件，經濟體亦可申請加入","我國與中國皆申請加入該組織，顯見中國放棄一中原則代號：2501頁次：4－2"],"C"],[114,1,11,"某公營電視台播出時，螢幕下方的跑馬燈呈現某市遭敵軍攻擊、某港爆炸，還有規模七的地震等訊息，讓許多觀眾見到這些「獨家新聞」大驚失色，該電視台立即更正說明是「誤植 楣","他向來精打細算，善用「買櫝還珠」的策略而致富","網路上的諸多訊息，有可能是「爍石流金」的謠言，並非事實"],"B"],[113,0,8,"下列文句「」中的成語，使用最適當的是：",["文藝創作不僅需要「天花亂墜」般的才華，同時也要持續不懈地努力，才有可能獲得賞識","突發性的心血管疾病十分危急，需要急救人員「奮勇爭先」地施以緊急醫療，才有可能挽回一命","他面對別人的質疑總能維持「落落大方」的風度，即便對方言詞犀利，也依然能夠虛心接受別人的建議","演講時不僅講究臺風的穩健，更要有著「信口雌黃」的功力，才有辦法吸引到大家的目光，獲得更多掌聲代號：1501頁次：8－2"],"C"],[113,0,9,"「多年後我自己重讀《易經》，愈來愈相信這是一部實用於生命現場的書，它可能啟始於某一個簡易的神祕公式，但真正的完成靠的卻是人的世故，有點像統計學，收集了人一次次刻骨銘心的生命經驗和教訓編纂起來。它預言的堅實基礎來自厚厚一疊而非一次的過去，來自人一再重複類似處境慢慢察覺出來的事物某種慣性和人心某種趨向，這每一種特定的處境，都一定程度制約窄化了未來，引發著特定的變化乃至於其規律節奏，未來因此有一部分可推演可猜測。」根據上文，作者認為《易經》是一部實用於生命現場的書，最主要的原因是：",["具神祕啟示性質，可占卜人世吉凶","立足於經驗及人性，具一定準確度","能推演吉凶，源於堅實的數學運算","始於神祕公式，可信度被充分驗證"],"B"],[113,0,10,"「投身到任何一個行業，只好埋頭苦幹。有人只看見和尚吃饅頭，沒看見和尚受戒，遂生羨慕別人之心，以為自己這一行只有苦沒有樂。」根據上文，下列何者最符合文意？",["一分生意三分險","問遍千家是行家","做一行，怨一行","道路各別，養家一般"],"C"],[113,0,11,"「傳話時要記得只傳達雙方領袖的合理意見，而不要把他們加鹽添醋的情緒語言也照樣傳達。這樣就算談判沒有很成功，也在可以理解的範圍中，而不致成為老闆情緒挫折的替罪羔羊。」根據上文，傳話者經常被老闆視為替罪羔羊，最主要的原因是：",["過度虛美的言辭","明哲保身的態度","傳達的方式欠妥","傳遞的訊息有誤"],"C"],[113,0,12,"「你何妨就在內心先確定一個廣泛的目標？先在家裡勾畫出完整的憧憬，布置一些可能發生的情節，以想像的陌生世界為背景，把自己血肉之軀投射進去，堅持自己所追求所要的東西，然後出門。這樣的旅行說不定會因為一切都不如理想而大失所望，但失望何嘗就不是一件莊嚴的理由？這樣的旅行是充滿目的和意志的，是學習的歷程，是考驗，是一種探險。」關於上文，敘述最適當的是：",["事先做好規劃，就可以擁有理想的旅行","探險與學習是旅行的目的，即使失望也有其價值","旅行之前要先預設可能發生的情節，才能避免發生危險","旅行的過程可能充滿考驗，堅持到底才能算是完成挑戰"],"B"],[113,0,13,"「百里奚押送鹽車到秦國。秦穆公見到拉車的牛很肥壯，問他：『車載著很重的東西，路途遙遠且多險阻，你的牛為什麼還能這麼肥壯呢？』百里奚回答說：『按時給牠吃飯喝水，駕車時不粗暴對待牛，碰到危險的地方，我自己緊隨在牠身旁，所以牛才會這麼肥壯。』」根據上文，百里奚的態度理念，下列何者最契合？",["機智應變","仁心愛物","勇於任事","共體時艱"],"B"],[113,0,14,"「古人欣賞奇磔遒勁的奇木奇石，大概是因為那奇磔遒勁中隱藏透漏著生命奮鬥的痕跡吧！當那掙扎求活的傷痛過去，那掙扎求活的姿態卻成了使人歌讚的對象。」根據上文，下列何者最符合文意？",["飽歷滄桑的紋理是生命的印記","歌詠讚嘆自然造物的鬼斧神工","木石經過雕琢銘刻方成就藝術","藝術家投注生命力於木石雕刻代號：1501頁次：8－3"],"A"],[113,0,15,"「Instagram上線之初，原本倡導素人攝影，鼓勵用戶記錄『你看到的世界』；然而，幾年下來，IG主流文化轉變為『以你為核心的世界』，擺拍，設計場景，美肌，非寫實濾鏡，將自己拼貼在令人驚嘆崇拜的場景裡，設法拍出唱片封套或雜誌封面的人物質感。於是，網紅們四處尋找無敵海景、值得打卡的店家、適合入鏡的牆面，自我鑲嵌其中，希望一張爆紅照片能增加上千名追蹤者；直到有一天，數以萬計的追蹤者可以讓自己躋身網路名流，同時藉此變現。」關於上文，下列敘述最適當的是：",["現在的IG主流文化，主要透過商業攝影以賺取流量與金錢","成為網紅的必要條件之一，是要能忠實記錄自己的日常生活","IG創設之初鼓勵人以拼貼展示令人羨慕的自己，進而獲得關注","「以你為核心的世界」，是指創造一個可能脫離現實生活的環境"],"D"],[113,0,16,"「人在誕生前的受精卵狀態，有99%是水；出生後，原本占90%的水在成人之後會降到70%，據推測死前應該會降至50%吧！換句話說，人終其一生都是活在水的狀態之下。從物質的角度來看，人就是水。」在文學作品中，也經常可見「水」與「生命」的連結，下列文句中的「水」，何者最能展現「生命」的意義？",["天壤之間，水居其多","水心如鏡面，千里無纖毫","上善若水，水善利萬物而不爭","君不見黃河之水天上來，奔流到海不復回"],"C"],[113,0,17,"「影像的第一印象不只會受到我們當下的狀態影響，連擺頭方向、相機角度等看似不相關的事情也會造成差異。同一張臉低頭看起來就比較順從，抬頭看起來就比較強勢，頭稍往左傾會讓臉看起來更可親，更有魅力。我們甚至都還沒開始羅列體態、姿勢、衣服、化妝等各種情境提示的影響，這一切都影響印象。臉部靜止影像捕捉的是人們在生活的單一片刻，不是得到精確性格印象的好材料。」根據上文，下列敘述何者最適當？",["影像不過是許多不相關事情組成的假象，不可輕信","透過化妝、衣服、姿勢、角度，可了解真實的性格","微微低下頭再搭配左傾的臉部，表示此人有好心情","依賴捕捉片刻的影像來決定第一印象，並不夠準確"],"D"],[113,0,18,"「江浙一帶是米鄉，嘉興就產好米，嘉興米是溫帶氣候的米，和日本新潟地區的越光米較相似，日本人在臺灣引進了越光米種出了蓬萊米，就很受來臺的江浙人士喜愛，江浙人是吃不慣荷蘭人從東南亞引進而種成的在來米的。日本人愛吃黏稠性較高的蓬萊米（越光米種），東南亞人吃的是口感較鬆脆的在來米，一般以為蓬萊米較甘甜，口感也更滑順，但在來米炒飯卻特別好吃。」根據上文，下列何者最接近文意？",["「嘉興米」與「在來米」都產於溫帶氣候區，也都是荷蘭人自東南亞所引入臺灣","新潟地區的「越光米」，產於溫帶氣候，口感較為鬆脆甘甜，較符合日本人口味","「蓬萊米」原產於江浙一帶，傳至臺灣後由日本人改良，廣泛受到臺灣人的喜愛","「在來米」是由荷蘭人從東南亞引進，口感鬆脆，比較不符合來臺江浙人的口味代號：1501頁次：8－4"],"D"],[113,0,19,"「無人存在的空間，就喪失空間的意義；無法傳遞的建築，僅是一座空殼。近千年來，布爾戈斯主教堂收容了來自世界各地無依的靈魂，迷惘的朝聖者。它具有某種祕而不宣的深刻，在喧譁塵囂中以無言的方式傳遞信念。」根據上文，下列何者最接近旅人對布爾戈斯主教堂的讚嘆？",["顯現華麗精美的設計與建築工法","展現著修道者刻苦的精神與故事","傳遞歷史變遷中興盛與衰亡的印記","長久乘載著人們心靈的苦悶與希望"],"D"],[113,0,20,"「腸胃不適：在半杯溫開水中滴入3-4滴，空腹飲用。口鼻感冒症狀：在熱開水中滴入3滴，閉上眼睛，用鼻子深呼吸；2-3滴加入熱水，小口慢慢飲用；塗抹適量在胸口、喉嚨及鼻部輕輕按摩。肌肉酸痛：塗抹在疼痛的部位按摩，然後覆蓋毛巾熱敷。頭痛：塗抹適量在額頭、太陽穴和頸部並加以按摩，用冷水輕拍可提高效果。」以上為某家庭常備藥品的使用說明，下列敘述最適當的是：",["該藥品應屬粉末狀，服用時需小心嗆到","上呼吸道以外的症狀宜使用冷水搭配該藥品使用","如傍晚肚子忽然感到脹氣不舒服，建議在晚餐前使用溫開水搭配服用","大部分的症狀都可同時透過內服、外用與吸聞三種方式使用該藥品，以達到最好效果"],"C"],[113,0,21,"「日復一日，把時間的痕跡累積成情感的厚度，這樣的過程十分迷人。一枝有生命歷練的中古鋼筆會保留主人獨特的使用習慣和過往的時間，也見證了人生字跡的美麗變化。或許我們都有一種想要抓住時間的欲望，書寫與紀錄，反覆地在時間耗費裡抵抗遺忘，無論是在寫的過程或寫下的字跡，都是試圖以物質製造記憶，留存痕跡。」根據上文，下列最符合作者認為書寫迷人的地方是：",["藉由字跡展露出作者本人的個性","可以讓人滿足不想被忘記的願望","表達個人理念與生命經驗的特殊性","激勵生存的意志、累積豐富的情感"],"B"],[113,0,22,"「當鑰匙在鎖孔轉動的喀嗒聲響起，這一天中所有疲倦、失意，就像鞋子上的灰塵一樣，都留在門外了。那是一種風浪過後，船舶靠岸的感覺。是摘下面具、卸除防衛、還自家本來面目的輕鬆。」上文是某房屋經銷的廣告文案，下列何者最接近其訴求的重點？",["大氣高雅","清幽恬靜","舒放自在","精雕細琢"],"C"],[113,0,23,"「若視建築為凝聚意念而成的空間敘述，大都會相當於史詩或長篇，小鎮對應散文或短篇，鄉村就是淺吟低唱的詩歌了。大城的高樓和下水道，以及窄巷死角貧民窟，說的是盛世繁華大起大落。相對，小鎮簡單的街道和房屋，低訴趨近常人的小哀小樂。」根據上文，下列何者最符合文意？",["對比空間的情感意象","控訴滄海桑田的無奈","流連建築的歷史記憶","批判城鄉差距的不公"],"A"],[113,0,24,"「夜深獨酌，從陽臺可見的觀音山，躺臥天地之間，時斜月輕掛，時星點醉灑。高粱再倒，舉杯，竟彷彿邀山，邀月，也敬邀人間了。」下列何者最能呼應上文的情感？",["故人賞我趣，挈壺相與至","遇酒且呵呵，人生能幾何","晚來天欲雪，能飲一杯無","舉杯邀明月，對影成三人代號：1501頁次：8－5"],"D"],[113,0,25,"「世間微塵，歲華荏苒，有時我讀到『城中十萬戶，此地兩三家』而環顧四周，便有怡然的滿足。眾生勞苦競走，像神農一樣遍嘗人間各毒，我猜那其實是生活殷憂的隱喻，在現代更是如此。我到目前為止四方奔忙仍然一事無成，但我已不再如此憂戚，所謂『飄飄何所似，天地一沙鷗』，靜夜掩卷，我對自己說，也許解毒的答案就在其中。」根據上文，下列何者最接近作者的感悟？",["風簷展書讀，古道照顏色","萬般皆下品，唯有讀書高","心寬天地闊，無憂歲月安","吃得苦中苦，方為人上人"],"C"],[113,0,26,"「如此超高濃度、超大密度的相濡以沫，在網路興起之前，是不存在的。一個人說要入山閉關，他大概就真的可以與世隔絕，缺月掛疏桐，靜聽松子落。現在，海外孤島、深山古剎也有網路穿透，網路穿透之處，就是眾聲喧嘩之時。深山獨處，孤島離索，若是網路隨身，其實就是行李中裝了重重罣礙，與滾滾紅塵一同上路了。何況所謂獨處，不在於身體是否單獨，而在於心靈是否誠實地閉門，獨對內在。」根據上文，下列何者最符合文意？",["鼓勵現代人離群索居遠離網路提供的資訊","疏桐影松子聲成為現代人無法接近的光景","網路無遠弗屆造成現代人自我與人際混淆","獨處的意義在於心靈能遠離喧囂面對自我"],"D"],[113,0,27,"承上題，關於上文，作者認為網路的影響，下列何者錯誤？",["網路帶來更繁複的人際關係","網路眾聲喧嘩穿透生活界線","現代人生活無法不靠著網路維持品質","無所不在的網路使獨處變得更加困難"],"C"],[113,0,28,"「人類的所有餐飲食材中，有三分之一以上來自於由昆蟲授粉的植物，這一千多種作物中，百分之八十以上需要蜜蜂幫忙傳播花粉。蜜蜂死了，很多花因為沒傳粉也死了，靠這些花的果實為生的動物也死了。從蜜蜂的例子，我們可以知道，這些小小的昆蟲，對自然資源以及其他生物造成多大的影響啊！一個生態系統的穩定度與它的複雜性有直接的關係。」根據上文，下列何者最符合文意？",["動輒得咎","牽一髮而動全身","失之毫釐，差之千里","禍兮，福之所倚；福兮，禍之所伏"],"B"],[113,0,29,"「水資源產業是國民經濟發展基礎產業，優先發展與水資源相關的活動是一種必然的趨勢。但發展中排放出大量的污水，也污染了水源，導致水資源功能下降，讓發展與污染產出兩者更加的矛盾，給經濟環境帶來極大不利影響，嚴重地限制約束經濟社會的可持續發展。」根據上文，下列何者最符合文意？",["優先發展水資源產業，不利國民經濟發展","限制水資源的利用，可有效改善經濟環境","發展水資源產業的過程中，改善水源污染將導致水資源功能受限","若能留意造成環境污染的社會成本，有助於經濟社會的持續發展"],"D"],[113,0,30,"「富人和窮人一樣受苦，因為外在的憂慮來自欲望。即使是億萬富翁也有憤怒、絕望、沮喪的苦。他們很少享有真正的安寧與和平，只是憂慮現有的會失去或如何獲取現在所沒有的。他們不能欣賞自己，活著只是為了那些吸引或奴役他們的東西。賺錢本身並不會產生痛苦，但把自己的生命交給外在的財物，才是扼殺喜悅與安寧的劊子手。」下列那一個選項最能說明本文的主旨？",["財富不會產生痛苦","欲望是痛苦的根源","不論窮或富都會痛苦","患得患失是痛苦的根源代號：1501頁次：8－6"],"B"],[113,0,31,"「透過正念飲食來練習恢復專注力，放慢用餐速度，讓吃飯成為一種『有意識』的行為。當有意識地進食時，更能感受身體的飢餓和飽足程度，減緩暴飲暴食程度和避免情緒化的飲食。」根據上文，下列最符合正念飲食的理念是：",["三餐定時定量，多吃蔬果，禁食垃圾食物","用餐時，聊天或聽音樂可以放鬆緊張心情","慢慢咀嚼每一口食物，並且感受食材滋味","增強專注力，才可以有效節省用餐的時間"],"C"],[113,0,32,"「學習走路的孩子沒有不摔跤的，並且在千萬孩子之中，可能有一個摔成腦震盪。有一位母親因此堅決不讓她的孩子走路，那孩子果然從來沒有摔過跤，身上也沒有疤痕，但最終變成了癱子，一生要坐輪椅。人生有些痛苦是要受的，有些代價是要付的，有些過失是要犯的。」根據上文，下列何者與本文旨意相去最遠？",["父母過度的保護，會使孩子無法成長","人不怕犯錯，只要知錯能改便能進步","人本來就要不斷學習，不能因噎廢食","生命是有限的，應多元嘗試各種事物"],"D"],[113,0,33,"「『在矽谷，失敗不是一個選項，而是一個必需品。』這是美國雜誌對矽谷『包容失敗』文化的經典評論。在這裡，人們更注重你是不是有創新的想法，有敢拚敢闖的精神，而不怕你在努力中失敗。甚至，大家會覺得失敗是一件值得慶祝的驕傲事。」根據上文，矽谷人認為失敗值得慶祝的原因是：",["矽谷的人大多有失敗經驗","能透過失敗學會彼此包容","比起失敗更讚許冒險嘗試","失敗有助於弭平人我偏見"],"C"],[113,0,34,"「臺灣火刺木原生於臺灣東部，主要分布於海岸山脈的低海拔溪流河床區域，是能耐乾旱、貧瘠的常綠灌木，未經修剪的植株約可長至3公尺高。園藝界常稱為狀元紅，這其實是對薔薇科火刺木屬植物的通稱，本屬植物果實均紅豔如火，且莖上長著棘刺，而有此屬名。如要辨認出臺灣火刺木，可觀其葉片，先端微凹且無細鋸齒緣，邊緣光滑無缺刻，就是明顯特徵。果實滋味微酸，不少花東地區長輩憶起童年時代，會將臺灣火刺木的紅果稱為小蘋果。」根據上文，下列敘述何者最適當？",["狀元紅是一種修長、全身通紅且有棘刺的灌木","小蘋果的得名是來自果皮顏色鮮紅與微酸滋味","生於潮濕河流中的火刺木由親水性變成耐乾旱","種植臺灣火刺木要提防被尖刺與鋸齒樹葉割傷"],"B"],[113,0,35,"「哈佛大學教授列維研究過去五十年美國工作的變化，發現消失最快的是那些①的工作。列維接受專訪時指出，過去學校最擅長教授的②，曾經使人們能維持不錯的生活，像是收費員、打字員等工作，如今不是被外包，就是被新科技取代。」根據上文，①和②最適合填入的是：",["①創新化；②溝通、思考能力","①自動化；②科學、計算能力","①機械化；②自發、主動能力題至第45題，占30分）說明：每題3分，所列的五個選項，其中至少有二個是正確答案。各題之選項獨立判定，全部答對者，得3分；答錯一個選項者，得1.8均未作答或答錯多於二個選項（不含二個）者，該題以零分計算。","①制式化；②記憶、背誦能力二、複選題（第36分；答錯二個選項者，得0.6分；所有選項"],"D"],[113,0,36,"下列題辭，適用於祝賀新居落成的是：",["宜其家室","乾坤定矣","氣象維新","昌宜五世","美輪美奐代號：1501頁次：8－7"],"CE"],[113,0,37,"下列「」中的詞語，使用適當的是：",["趙先生熱心服務「桑梓」，令人敬重","不想為「五斗米」折腰，最好自己創業","今年五月，有不少民意代表都「掛冠」下臺","我覺得自己「馬齒」徒長，五十歲了還一事無成","他已經「請纓」多次，沒想到老闆還是不肯原諒他"],"ABD"],[113,0,38,"下列成語能表達「經過長時間努力，終究會成功」的是：",["九轉功成","水滴石穿","出人頭地","老鶴乘軒","鐵杵磨針"],"ABE"],[113,0,39,"「池塘邊的榕樹上，知了在聲聲叫著夏天。操場邊的鞦韆上，只有蝴蝶停在上面。黑板上老師的粉筆，還在拚命嘰嘰喳喳寫個不停。等待著下課，等待著放學，等待遊戲的童年。福利社裡面什麼都有，就是口袋裡沒有半毛錢，諸葛四郎和魔鬼黨，到底誰搶到那支寶劍，隔壁班的那個女孩，怎麼還沒經過我的窗前，嘴裡的零食，手裡的漫畫，心裡初戀的童年。陽光下蜻蜓飛過來，一片片綠油油的稻田，水彩蠟筆和萬花筒，畫不出天邊那一條彩虹，什麼時候才能像高年級的同學有張成熟與長大的臉。盼望著假期，盼望著明天，盼望長大的童年。一天又一天，一年又一年，盼望長大的童年。」根據上文，下列那些文句不僅描寫眼前的事物，也呈現內心的活動？",["池塘邊的榕樹上，知了在聲聲叫著夏天","福利社裡面什麼都有，就是口袋裡沒有半毛錢","隔壁班的那個女孩，怎麼還沒經過我的窗前","陽光下蜻蜓飛過來，一片片綠油油的稻田","水彩蠟筆和萬花筒，畫不出天邊那一條彩虹"],"BCE"],[113,0,40,"",["","","","",""],"CD","iVBORw0KGgoAAAANSUhEUgAABFYAAAFICAIAAAD1Ru19AAAACXBIWXMAAA7EAAAOxAGVKw4bAAGszUlEQVR4nOy9e9xOVf7/P45hMM6VyCHkFnI+haHBOBeDHO+ck5BbhIpHyLFBCCEKEUKDocEgGgqVMEUlOqnofFBTzXyu7/O334/WY7XW2vva131fTr/264/7cd372tfea6/1Prxe67R/F4sQIUKECBEiRIgQIUKE3wx+d7ELECFChAgRIkSIECFChAgXDpEEihAhQoQIESJEiBAhwm8IkQSKECFChAgRIkSIECHCbwiRBEo+/vvf/15//fV/tLB8+fKLXTQ 界」使用？",["功著杏林","利惠人群","大業千秋","福國利民"],"A"],[112,0,7,"下列選項中的題辭與使用場合搭配，何者正確？",["畢業：學無止境","女喪：孟母遺風","退休：德業長昭","遷居：名山事業代號：1501頁次：8－2"],"A"],[112,0,8,"下列文句「」中的成語，何者使用正確？",["人事變化無常，不禁令人生起「樹猶如此」的慨嘆","時逢春季，陽明山處處「蕙質蘭心」，吸引民眾駐足","彎月高懸天際，「送眼流眉」的姿態，美得令人屏息","跨年人潮眾多，一時之間「擢髮難數」，捷運只好加開班次"],"A"],[112,0,9,"「後人認為司馬遷在《史記》裡對現實政治『微文刺譏』，因而視《史記》為『謗書』。當然，司馬遷在寫作過程中，將其個人際遇的鬱結，融於書中，是非常可能的。至於『微文刺譏』，誹謗今上，在現實的政治環境下，卻是不可能的。身受現實政治摧殘的司馬遷，如何超越桎梏，在不觸犯時諱的情況下，記錄當代歷史，頗費思量。」根據上文，下列選項何者最符合文意？",["司馬遷受現實政治摧殘，因而在《史記》誹謗今上","《史記》「微文刺譏」展現歷史學家的真誠與勇氣","如何寄託個人的鬱結，是司馬遷撰作《史記》時最費思量者","能忠實呈現當代歷史而不觸犯時諱，是《史記》寫作的難處"],"D"],[112,0,10,"「根據影片中象龜熟練的獵捕技巧，生態學家Justin Gerlach推測或許這些象龜其實早已學會捕獵，但因為過去人類侵入牠們的棲息地，大量獵捕各種生物，而大大影響原棲息地的食物鏈，才導致象龜改變原本的習性。或許也是弗雷格特島所提倡的保育計畫實行得很成功，使象龜們回歸了原始的生長環境，因此象龜們的狩獵本性就露出來了。」根據上文，下列選項何者符合文意？",["過去人們普遍認為象龜不會獵捕","象龜獵捕行為是被人類所逼迫的","象龜改變原本的習性後開始吃肉","只有弗雷格特島的象龜才會獵捕"],"A"],[112,0,11,"「臺灣物產的文獻紀錄，可考者最早可溯至1607年陳第的《東番記》，食用作物玉米、番薯原產於美洲，據推測是從西班牙的殖民地菲律賓引入，再輾轉進入臺灣。也提到當時原住民所種的甘蔗，可見甘蔗引進臺灣的時間很久遠，應是引自中國。檳榔等作物可能直接引自中南半島。臺灣在納入了全球化的經濟貿易後，連帶的進入生態交流網絡之中。」根據上文，下列選項正確的是：",["臺灣並無原生食用植物，都是殖民者由島外引進栽種","甘蔗很早就引進臺灣，顯見臺灣的製糖工業源遠流長","全球交通、跨國貿易、殖民等因素，影響了飲食物產","從物產判斷，中、菲、美洲是臺灣當時三大貿易夥伴"],"C"],[112,0,12,"一位醫師作家以當代的醫學角度思考詩仙李白為何如此愛喝酒而寫道：「李白聚會喝酒寫出來的詩，統稱為『宴飲詩』，趁難得的美好時節與朋友相聚，在有限的年華暢飲，李白因此寫下了的千古名句。在詩中，他大力稱述飲酒的妙處，高聲讚揚及時行樂。這或許是因為李白的腦部受到酒精影響，瀰漫著舒服愉悅的感覺。」根據上文，中最適合填入的詩句是：",["舉頭望明月，低頭思故鄉","蘭陵美酒鬱金香，玉碗盛來琥珀光","人生得意須盡歡，莫使金樽空對月","花間一壺酒，獨酌無相親，舉杯邀明月，對影成三人代號：1501頁次：8－3"],"C"],[112,0,13,"「你不會因為有了小孩就更有父母的樣子，就像擁有一架鋼琴不會讓你變成鋼琴家。」下列選項，何者最符合文意？",["只要開始，就有機會","動機是最單純的力量","有力的理由造成有力的行動","付諸行動，從做中學累積成果"],"D"],[112,0,14,"「用人不在於如何減少人的短處，而在於如何發揮人的長處。」下列選項，最符合文意的是：",["大材不小用，小材不大用","將適合的人請上車，不適合的人請下車","能用他人智慧去完成自己工作的人是偉大的","天生我材必有用，要能夠知人善任，因材器使"],"D"],[112,0,15,"「一切美好的事物都有美麗的開頭。不過，真正懂得人生的人都知道，『美好的開頭使事情成功了一半』並不真。這個世界到處是美好的開頭，同時也到處是『只成功了一半』的事業。美好的開頭不能結美好的果實。真正使事業成功，使一個人有成就的，是無窮的耐心。」下列選項，何者最符合上文的旨趣？",["懂得珍惜的人才會成功","持之以恆才是成功的關鍵","美好的果實，總是令人期待","美好的開始，是成功的一半"],"B"],[112,0,16,"「如果有人要你數算一個罐子裡的泡泡糖數量，你肯定可以輕鬆算出來，甚至還樂於嚐嚐罐子裡不同口味的糖果。然而，如果要你站在一座裝滿泡泡糖的游泳池前，必須數出所有的糖果數量，你大概連試都不想試了。」下列選項，何者最有可能是「連試都不想試」的原因？",["數大就是美","小處做起建立信心","根本不可能完成任務","在任務中無法找到樂趣"],"C"],[112,0,17,"「人類從存在以來就有刻板印象，在古代，生存和保護有賴家族和部落。同族的人是安全的，陌生人是危險的。陌生人通常被當作敵人，只因為他們的外表、言語或行為不同而已。消除刻板印象其實只需站在對方的立場，生活一週、一天或甚至一小時就行了。在職場上，行銷部和生產部的人應該交換工作幾天，或至少做角色互換。主管和員工也應該交換工作幾天，有一些聰明的公司就是這麼做。這減少了不信任和溝通的問題，增加團隊合作和生產力，最主要的問題常在於，來自某文化的人從未接觸過另一文化的人。」根據上文，下列選項何者最符合文意？",["打從人類歷史以來便有根深柢固的成見，改變不易","先入為主的觀念，不會阻絕溝通管道形成刻板印象","職場上的角色互換可以啟發人的同理心，消弭歧見","文化的隔閡，很少是不同族群產生衝突的重要因素"],"C"],[112,0,18,"「簡單是一種修煉，越是面對複雜情境的人，這修煉越必要。但若修煉得宜，過程其實充滿了喜悅，因為複雜的是人的頭腦和習性，人的本性和本心，始終都是簡單的。修煉簡單，就是找回真我，重返赤子之心，豈有不樂之理？」根據上文，下列選項何者最符合文意？",["人們都是用心多，用腦少，往往自尋煩惱","簡單的事，想太多就複雜，凡事不想就好","複雜的事，看淡了就簡單，看透了就輕鬆","保持赤子童心，並非一種尋回真我的修煉代號：1501頁次：8－4"],"C"],[112,0,19,"「人們平常傾向於二分法的思考，例如：好與壞；英雄對惡棍；我的國家與其他國家。記者擅長把相異的人事物寫成對立，偏好報導赤貧與富豪。紀錄片喜歡描寫無名小卒如何對抗邪惡的大企業，賣座大片通常是在拍正義與邪惡的對立。由於二分法直覺，我們往往在統合中想像對立，在融匯中想像歧異，在一致中想像衝突。這種直覺處處可見，徹底扭曲認知。所以當你觀看兩個群體對立的新聞時，也許會用到『鴻溝越來越大』等用語。」根據上文，下列選項最符合文意的是：",["傳統善惡分明的教育中，人們判斷事物只剩下好與壞、對與錯的觀點","媒體往往以直觀的方式在對立與歧異中尋求統合融匯，以增加收視率","二分法的思考模式容易遭人利用，讓有心人士去強化衝突，製造爭端","正邪不兩立的觀點，充斥在人們日常生活中，也是拍攝電影的好題材"],"C"],[112,0,20,"承上題，下列選項何者最接近作者所說二分法思考的傾向？",["革命尚未成功，同志仍需努力","人不可以貌相，海水不可斗量","過度捕撈造成許多海洋生物瀕臨絕種","未開發國家的疫苗接種率普遍都偏低"],"D"],[112,0,21,"「我寫小說的理由，追根究柢只有一個。就是讓個人靈魂的尊嚴浮上來，在那裡打上一道光。為了不讓我們的靈魂被體制套牢、貶低，而經常照亮那裡，鳴響警鐘，那正是故事的任務。我想藉著寫生與死的故事，寫愛的故事，繼續嘗試讓人哭泣，使人畏怯，引人發笑，每天認真地繼續創作各種虛構的故事，讓每個靈魂不可替代的珍貴性明確化，這是小說家的工作。」根據上文，作者對「小說家」的期許是：",["在作品中，揭示所有靈魂相同而值得讚頌之處","能凸顯出人性靈魂的尊嚴，並肯定其存在價值","讓被體制套牢的角色可以鳴響警鐘，早日重生","藉由虛構的故事使得讀者在哭笑後，洗滌情緒"],"B"],[112,0,22,"以下是一個兒童繪本愛好者的自述：「繪本既是一個瑰麗的世界，也是一個隱藏著兒童角度與文學內涵的世界。它不僅在形式特質上無可取代，就連它看世界的『眼神』，也不同於其他的創作。我因為長年接觸繪本，從中發現了許多屬於兒童的特質，另外也因為它所傳遞出來的是一些有別於成人世界的價值，而屢屢被書中的小孩顛覆。」根據上文，下列選項何者最符合對兒童繪本的看法？",["繪本所具有的形式特質較為瑰麗","站在兒童的角度發現並了解世界","以顛覆成人世界的價值觀為起點","貼近小孩的文學內涵常無可取代"],"B"],[112,0,23,"「萊爾德專門衝數層樓高的巨浪，每次出海，都像是與死神跳一首腳步繁複的雙人舞。他和朋友曾經在衝浪時出過嚴重的事故，被巨浪重擊，同伴幾乎喪命在海上。萊爾德用盡力氣把重傷的同伴拖回岸邊送上救護車後，第一件事竟是拿著浪板掉頭回到海裡，繼續衝浪。事後有人問他難道不怕嗎？他說：不能害怕。」根據上文，下列選項敘述正確的是：",["萊爾德衝浪時，總能以技巧避開危險","透過衝巨浪，萊爾德提升了衝浪技巧","萊爾德不費吹灰之力救起溺水的同伴","萊爾德征服恐懼的方法是直接面對它代號：1501頁次：8－5"],"D"],[112,0,24,"「你如果順手撿起一塊花崗石的碎片，仔細看它的紋理，會發現含蓄而豐富的色彩，如果加以放大，不輸一幅抽象畫。每顆石頭都有其獨特的紋理，並不是只有潔白光滑如凝脂的大理石才是美的。」下列選項，何者最能呼應上文意旨？",["萬物自成其紋理，終究會被看見","經過切磋琢磨，石頭方可展現美","生活並不缺少美，只是缺少發現","繁華落盡見真淳，平淡更有滋味"],"C"],[112,0,25,"「兒子上學和我同路，但他不願搭我的車。即使同車，他戴上耳機——只有一個人能聽的音樂，是一扇緊閉的門。我只能想像，他的內在世界和我的一樣波濤深邃，但是我進不去。我慢慢地、慢慢地瞭解到，所謂父女母子一場，只不過意味著，你和他的緣分就是今生今世不斷地在目送他的背影漸行漸遠。你站立在小路的這一端，看著他逐漸消失在小路轉彎的地方，而且，『他用背影默默告訴你：不必追』。」根據上文，作者最主要想表達的是：",["人世間所謂親情無非陪他一段，難以相伴一生","父母與子女往往存在隔閡，很難有真正的溝通","處於叛逆期的兒子彷彿絕緣體，令人難以理解","子女往往冷漠地回應父母，讓父母難過與失望"],"A"],[112,0,26,"承上題，文末「他用背影默默告訴你：不必追」，最適合的解釋是：",["父母停留在自己的世界，很難追上子女前進的步伐","子女自有自己的世界，父母該適時放手，不必執著","子女終將脫離父母掌控，彼此情感亦難免日漸稀薄","父母應妥善安排自己的晚年，養兒防老並不切實際"],"B"],[112,0,27,"「在荷蘭的發展歷程，地理、人口等都與臺灣的永續發展議題相似。全球氣候變遷與荷蘭人口增長同時來襲，國土容易淹水，缺乏宜居土地的荷蘭，需要一個重新思考土地利用的方法。在此背景下，不能避免淹水，那就和水共存的想法，促成漂浮屋的出現。2015年，荷蘭想出了鹿特丹水廣場的想法，就設計一個沒有洪水的時候是遊憩的設施，洪水來了就讓它成為淹水的環境，而減少因為都市建築造成的洪水問題，同時增加與自然共存的環境。」根據上文，下列選項何者最符合文意？",["水能載舟，亦能覆舟","因勢利導，順勢而為","謀事在人，成事在天","江河行地，與時俱進"],"B"],[112,0,28,"「宗教有時會被看成是一種『迷信』，但透過這樣實地走訪臺灣各地廟宇的研究，讓我們對宗教有了不同的理解：無論是化解悲情的受難儀式、明辨是非的神判儀式，或是重啟調解機制的告陰狀，表面上是宗教活動，其實都是在處理人們的心理問題或社會問題。」根據上文，下列選項最符合文意的是：",["宗教活動幫助民眾面對自己的內心","宗教具有洞悉社會問題的神秘力量","宗教的功能多是信眾的期待與想像","不該以迷信看待宗教的超自然特性"],"A"],[112,0,29,"〔記者新北報導〕板橋某國中校舍改建與地下停車場工程挖出長10多公尺、胸徑3公尺的楠木類古木，判定樹齡約300多年（在地底約5千年），校方決議取部分結合公共藝術，其餘不予保存，引發爭議。某大學地質科學系教授說：「古木價值在於歷經的歲月及意義，以稀有性、教育性及觀賞性來看都值得完整保留。」根據上文，下列選項何者正確？",["校方的決議是針對教育的需求","學者主張保留古木以見證歷史","學者建議取稀有木段凸顯觀賞價值","校方為推動公共藝術保存完整古木代號：1501頁次：8－6"],"B"],[112,0,30,"「目前，AI和機器人還不太可能完全取代整個產業。如果是需要同時運用廣泛技能組合的工作，又或是需要應付難以預見的情境，比較難用機器來取代。由此看來，醫師的主要工作在於處理資訊：吸收醫療資訊、分析資料、再提出診斷。相對之下，護理師需要有良好的運動能力和情緒智力，才能幫病人打針、換繃帶，或是壓制住激動的病人。因此，出現智慧型手機AI醫師的時間，很有可能會遠遠早於可靠的護理機器人。」根據上文，下列選項何者最符合文意？",["AI和機器人的發展受限，前景不被看好","對機器人來說，看病診斷比換繃帶更難","護理師需要比醫師具備更多的專業知識","醫師在未來比護理師更有可能被AI取代"],"D"],[112,0,31,"「無可避免，我們在文化與社會結構上注意到什麼，仰賴的是我們站在什麼位置。我們是特定文化與社會結構裡的局內人，所以傾向於把那些位置看成理所當然；或者是局外人，一窺不熟悉的文化或社會結構，設法要理解種種事物。人類學家有時候把這些稱為『主位觀點』與『客位觀點』。重要的是意識到兩者都有自身的優勢與劣勢。」根據上文，造成局外與局內認知落差的原因是什麼？",["基於偏見無法認知主位觀點永遠優於客位","所處位置決定了對文化與社會結構的觀點","注意力的焦點放在彼此結構的優勢與劣勢","客位觀點容易將所處的位置看成理所當然"],"B"],[112,0,32,"「登山最高的境界之一，是見識了一切性靈的源頭，原來盡在一步一腳印的貼身覺察與自我生命對話；在時光雕鑿而出的眾神花園中，任何人皆可尋覓到自己的精神家園與心靈故鄉，當生命最敏感的當下，當實實在在的活著片刻，我們可以找到歸依之處。」根據上文，下列選項何者最符合文意？",["登山過程可敏銳的體察自我、安頓生命","登高望遠可以提升人格境界、精神效能","登山是自我放逐，遠離塵俗的唯一途徑","登山的考驗可使人看淡得失，感悟生命"],"A"],[112,0,33,"「要是大家都想搬入好的學區，讓孩子上好的學校，房價就會上漲。於是家長必須為賺更高的薪資而冒風險，因為薪資與風險相關。可是房子的數量有限、學校招生名額也有限，因此房價漲了、許多人的工作風險也升高了，送孩子進好學校的心願還是無法實現。」根據上文，下列選項何者最接近作者觀點？",["只要能夠成功，可以不計承擔各種風險的代價","好學區房屋銷售市場，供需量能與房價成正比","為滿足需求而付出心力，結果未必能盡如人意","將學習的責任還給孩子，追求名校是捨本逐末"],"C"],[112,0,34,"「腸神經元如同大腦一般會分泌許多神經傳導物質，最有名的就是血清素。腸神經元會透過不同方法與大腦相互溝通，像是迷走神經、多巴胺、腦內啡等，因此『腸—腦軸線』就是目前研究的重點。又因為『人體微生物相』大多位於腸道內，所以『微生物菌相—腸—腦軸線』也是研究腸道益生菌與大腦連線的新興科學。」根據上文，下列選項敘述正確的是：",["腸道內微生物的分布會影響大腦狀態","血清素是典型受微生物支配的神經傳導物質","腸所分泌的傳導物質通過微生物向腦發出訊息","腸—腦軸線研究有助於開發腦內未完全使用的區域代號：1501頁次：8－7"],"A"],[112,0,35,"「愛爾蘭劇作家蕭伯納說：『我有一顆蘋果，你也有一顆蘋果，交換之後，我們還是各自擁有一顆蘋果；但如果我有一個觀念，你也有一個觀念，交流之後，我們都各擁有兩個觀念。』資訊和知識、才能與資源的分享，讓當事人的知識和觀念加倍成長，這是人際關係中非常珍貴的互惠原則。來源不同的觀念知能和才氣資源，在互惠分享和交流碰撞中，可以因新奇組合而產生創意。」根據上文，下列選項何者正確？",["交流觀念和交換蘋果的結果是一樣的","致力拓展人脈，可以利用彼此的資源，具有加倍效應","吸收新奇的觀點，是彼此知識互惠交流所追求的重要目標","人的知能與才氣不同，往往可以在互惠交流過程中產生創意二、複選題（第36題至第45題，占30分）說明：每題3分，所列的五個選項，其中至少有二個是正確答案。各題之選項獨立判定，全部答對者，得3分；答錯一個選項者，得1.8分；答錯二個選項者，得0.6分；所有選項均未作答或答錯多於二個選項（不含二個）者，該題以零分計算。"],"D"],[112,0,36,"張處長榮獲模範父親表揚，同仁們擬贈匾祝賀，下列選項中的題辭何者正確？",["教澤長存","春暉廣被","忠孝傳家","壽元無量","明倫教孝"],"CE"],[112,0,37,"下列各選項皆出自一篇有關親子關係與青少年心理學的論述，「」內的詞語應用正確的是：",["親子衝突帶來的負面情緒，容易造成青少年不同類型的負面情緒，「導致」不同的問題行為","多數父母掌控生活資源，若常採用「嚴厲」的懲罰手段，可能讓孩子產生威脅感，陷入焦慮不安","父母親在不自覺中的情緒勒索，會讓青少年「滋養」愧疚感，引發青少年退縮、缺乏自信、自我孤立","青少年階段是情緒的暴風時期，如果自尊受損，在無法「調配」控制下，可能轉而用攻擊行為宣洩情緒","當青少年長期感受到委屈、冤枉，或因為處處受到父母的「管控」，最後可能選擇壓抑自己而萌生怨恨感"],"ABE"],[112,0,38,"「要使這個社會治安趨於良好，最重要的是勸導那些不法之徒，能夠□□□□。」下列成語，何者適合填入空格內？",["明辨是非","不念舊惡","遷善改過","除舊布新","洗心革面"],"ACE"],[112,0,39,"下列文句「」中的成語，運用正確的是：",["父親教導我們默默行善，以免有「沽名釣譽」之嫌","警方鎖定的陳姓嫌犯「危言危行」，民眾十分恐慌","具創造力的人常「見異思遷」，能不斷開發新產品","張局長高瞻遠矚，總是能「見微知著」，超前部署","比賽選手個個舌粲蓮花，「信口開河」的進行演說"],"AD"],[112,0,40,"「天地間有些東西沒有主人，例如自然美景。既然無主，我們可以盡情享有，大自然不加限制。審美的能力是先天稟賦加後天修養，我們之所得無人可以侵占。『失去那不能擁有的，得到那不能奪去的。』這是我們這等人擁有的永恆。千江有水千江月，面對天地之美，我們的『擁有』並未使別人『失去』。」下列選項，何者符合本文所說是屬於「並未使別人失去」的「擁有」，且「不能奪去的」？",["超凡的審美能力","永恆不朽的人生","壯麗的江河山川","寧靜皎潔的明月","珍愛的親密戀人代號：1501頁次：8－8"],"ACD"],[112,0,41,"「楷書是字體中最整齊、最嚴謹的形式，唐人在書法上最大成就當屬『楷法』的創立，『法』是法則、規律，從此以後，中國文字不再演化新的字體。唐以前的楷書是在追求一種法則下進展的，三國時代的楷書仍帶有行書和隸書的筆勢，南朝楷書更加工整，但行書意味仍然濃厚。北朝的魏碑體式多樣化，卻尚未尋找出它的規律性，隋代混同南北，成為唐楷的先驅。」根據上文，下列選項正確的是：",["唐人書法最大的特色是有書寫法則可以依循","楷書的整齊嚴謹使它不得帶有行書隸書筆勢","三國時代流行行書和隸書且沒有成熟的楷書","南北朝楷書找到書寫規律性故表現趨勢一致","隋代能成為唐楷先驅是因其承襲南北朝發展"],"AE"],[112,0,42,"「日子就這樣過去，消磨在管山管水裡。並不固執要去做什麼事，然而想來也沒什麼大後悔。晚上入睡前，閉目感受周遭的寧靜，我總是心懷感激。大自然如此渺漠，卻又如此可親，和我息息相關；我無法也不願割離。在黑暗中，我彷彿聽到了宇宙生命的呼吸和訓諭。我凝神諦聽。時間緩緩流過。」根據上文，下列選項符合文意的是：",["抒發時光易逝的心中感慨","顯露對於宇宙浩瀚的迷茫","敘寫山居歲月的恬淡安然","呈現離群索居的寂寞孤獨","表達對自然的敬畏與戀慕"],"CE"],[112,0,43,"有位法國哲人為人道主義下定義：「一個人於河中快淹死，一百個人跳下河中相救，這一百個人也許會因而淹死，而仍救不上那個人來。以一百比一，是件不理智的行動，我們把這種行動叫做人道主義。因為救的不是那個『一』，而是救的那個『人』。」這種人道主義的昂揚，是人類文明一大進程。由於人道主義的出現，率獸食人的社會才絕跡於人間。由於人道主義的覺醒，以人祭天的犧牲才消弭於人世。根據上文，下列選項何者屬於人道主義的表現？",["國際紅十字會對受害者提供保護及救助","國際貨幣基金組織長期致力於穩定匯率","無國界醫生在衝突地區提供醫療及物資","世界展望會幫助貧困兒童以及進行賑災","歐洲聯盟促進社會經濟發展及公民覺醒"],"ACD"],[112,0,44,"「知識分子既不是調解者，也不是建立共識的人，而是全身投注於批評意識，不願接受簡單的處方、現成的陳腔濫調，或平和寬容的肯定權勢者的說法或作法。他總是時時維持著警覺狀態，永遠不讓似是而非的事物或約定俗成的觀念牽著鼻子走。」根據上文，下列選項何者符合知識分子的特質？",["不落俗套","左右逢源","通才碩學","韜光養晦","慎思明辨"],"AE"],[112,0,45,"「心理學的研究上有個現象叫做『破窗效應』，就是說，一個房子如果窗戶破了，沒有人去修補，隔不久，其它的窗戶也會莫名其妙的被人打破；一面牆，如果出現一些塗鴉沒有清洗掉，很快地，牆上就布滿了亂七八糟，不堪入目的東西。一個很乾淨的地方，人會不好意思丟垃圾，但是一旦地上有垃圾出現之後，人就會毫不猶疑地拋，絲毫不覺羞愧。這真是很奇怪的現象。」根據上文，下列選項何者符合「破窗效應」的觀點？",["管理時必須有統一的要求與準則","防微杜漸是預防問題的手段之一","人們很容易仿效他人不良的行為","組織中引進競爭者可以激發活力","環境對人的行為具有強烈誘導性"],"BCE"],[112,1,1,"一國面對景氣衰退時，政府往往會透過某些措施的採行，刺激景氣復甦，帶動經濟成長。下列何者無法達成刺激景氣復甦的目標？",["增加公共投資","降低重貼現率","獎勵民間投資","取消補貼政策"],"D"],[112,1,2,"若世界僅由甲、乙兩國組成，且甲國生產所有商品的效率皆比乙國的水準高。若以機會成本的觀點而言，下列有關甲、乙兩國生產及貿易的敘述，何者正確？",["甲國生產所有商品均具絕對利益","乙國向甲國進口所有產品最有利","甲國生產所有商品的機會成本低於乙國","若兩國進行分工，甲、乙兩國的生產可能線會內縮"],"A"],[112,1,3,"大學剛畢業的小湘有三個工作機會與繼續升學的道路可選擇，一是月薪2萬5千元的家教老師；另一是月薪2萬8千元的房屋仲介；以及月薪3萬元的法務助理；若選擇不就業，繼續進入研究所碩士班就讀，學雜費兩年共需20萬元。依上述資料判斷，在不考慮其他條件的情況下，針對小湘大學畢業後兩年間做選擇的機會成本之敘述，下列何者正確？",["若當家教老師，機會成本為67萬2千元","若選擇當房屋仲介，外顯成本為72萬元","若選擇就學，外顯成本為72萬元","若選擇就學，機會成本為92萬元"],"D"],[112,1,4,"從塑化劑事件到毒澱粉，食安危機連環爆，連許多老店與大公司的知名產品都因使用有害人 人於法令限制內，有享受權利負擔義務之能力。但專屬於自然人之權利義務，不在此限","權利能力及行為能力，不得拋棄"],"B"],[112,2,33,"甲將市價新臺幣（下同）100萬元之古董錶寄放於乙家中。某日，古董錶蒐藏家丙得知此事，向乙表示願意高價收購該錶。乙心動不已，決定藉此中飽私囊，便花錢將該錶送交專業保養後，並因該錶狀況甚佳，最終以150萬元出售於丙。嗣後，甲得知此事。下列敘述何者正確？",["乙出售甲所有之古董錶於丙，係基於為甲管理事務的意思，屬於無因管理，乙得向甲請求為其支出之保養該錶的費用，不以甲所得之利益為限","乙出售甲所有之古董錶於丙，屬不法管理，甲僅得依侵權行為請求損害賠償100萬元","乙出售甲所有之古董錶於丙，雖意在中飽私囊，但甲仍得享有因管理所得之利益150萬元","乙出售甲所有之古董錶於丙，乙取得之買賣價金屬於不當得利，甲得向乙請求返還150萬元"],"C"],[112,2,34,"甲有一A地，先與乙訂立A地買賣契約，但尚未交付A地於乙且尚未辦理所有權移轉登記。嗣後，甲與丙訂定買賣契約，將A地賣給丙，丙明知甲與乙訂約在先。下列敘述何者正確？",["甲與丙訂立之買賣契約無效","甲與乙訂立之買賣契約無效","甲與乙丙之買賣契約均有效","甲與乙及丙之買賣契約均效力未定代號：3501頁次：6－5"],"C"],[112,2,35,"依法律規定、習慣或法律行為，成一公同關係之數人，基於其公同關係，而共有一物者，為公同共有人。下列關於公同共有之敘述，何者正確？",["公同共有人得隨時請求分割公同共有物","公同共有人得自由處分其應有部分","公同共有人得自由使用收益公同共有物","公同共有人得向無權占有人請求返還公同共有物於全體公同共有人"],"D"],[112,2,36,"稱不動產役權者，謂以他人不動產供自己不動產通行、汲水、採光、眺望、電信或其他以特定便宜之用為目的之權。下列關於不動產役權之敘述，何者錯誤？",["不動產役權因時效而取得者，以繼續並表見者為限","不動產役權不得由需役不動產分離而為讓與，或為其他權利之標的物","不動產役權，不得就自己之不動產設定之","不動產役權人因行使權利而為設置者，有維持其設置之義務"],"C"],[112,2,37,"依民法規定，下列何者非姻親關係？",["血親之配偶","配偶之血親","血親之配偶之血親","配偶之血親之配偶"],"C"],[112,2,38,"設有爸爸甲、媽媽乙、讀國小的兒子丙與女兒丁，以及爺爺戊等人。下列何者非屬民法規定有關甲乙對於未成年子女丙丁所為之財產上行為？",["甲騎著學校送給丙作為模範生獎品之腳踏車上班","乙強制把丁過年獲得之紅包存在丁之郵局帳戶","甲開工廠要向銀行借錢，拿戊遺贈給丙之房子為銀行設定普通抵押權","乙在戊遺贈給丁之農地上經營種苗場"],"C"],[112,2,39,"關於限制辯護人與被告接見，下列敘述何者正確？",["司法警察官得聲請限制辯護人與羈押之被告接見","法院核發限制書，應經法官簽名","檢察官也可以核發限制書","對於辯護人與受逮捕的被告互通書信，得限制之"],"B"],[112,2,40,"有關刑事被告自白證明力之敘述，下列何者正確？",["被告之自白，得作為被告有罪判決之唯一證據","被告自白之證據能力與證明力為相同的概念","告訴人經改列證人到庭具結之證言，得作為被告自白之補強證據","被告自白之補強證據，以能證明被告全部犯罪事實為必要"],"C"],[112,2,41,"下列關於證據之敘述，何者正確？",["有證據能力之證據，即可作為判斷被告是否有罪之依據","經過合法調查之證據，即可作為判斷被告是否有罪之依據","那些證據可以判斷被告是否有罪，全憑法院決定","有證據能力且經合法調查之證據，即可作為判斷被告是否有罪之依據"],"D"],[112,2,42,"檢察官起訴被告涉犯傷害罪嫌，但法院進行審判程序時，認被告之傷害行為應構成重傷害未遂罪，且依照起訴書記載之犯罪事實，被告另涉及妨害自由行為。依實務見解，此時法院應如何處理？",["法院僅依起訴罪名審理並終結案件為已足","基於不告不理原則，妨害自由部分未起訴，法院毋庸審理","法院應告知被告原先起訴之傷害罪名可能變更為重傷害未遂罪名，且應一併審理妨害自由部分，同時告知被告尚涉及妨害自由之犯罪嫌疑及罪名","法院應曉諭檢察官追加起訴妨害自由部分，始得加以審理代號：3501頁次：6－6"],"C"],[112,2,43,"下列關於刑法第23條正當防衛之敘述，何者錯誤？",["須對於現在不法之侵害為之","須為出於防衛自己或他人權利之行為","防衛行為如過當，則僅得減輕或免除其刑","僅得對於侵害自己或他人生命、身體、自由、財產等權利之行為而為防 保持活力，仰賴的無非是與其他文化互動，畢竟專業知能與創造力都奠基於不同類型的知識與觀點的對話及互補。」依此觀點，下列何種政策對增進民族文化的活力最無效益？",["健全發展交換學生制度","加強促進跨國科技研發","立法獎勵國際人才移動","嚴格規定交流學者資格"],"D"],[111,0,9,"「說胰臟像尺，其實有些勉強。它可是有頭有身，甚至尾巴的器官。這身型別致的臟器，我總覺得不像尺，而像個逗點，像隻蝌蚪，或像枚水滴。它是跨領域的，擁雙專長：屬消化系，亦屬內分泌系；能分泌胰液，分解食物，亦能製造多項荷爾蒙，調控血糖平衡。胰臟似乎帶有一種『分泌』的宿命，終其一生都在榨出。在超音波底下，只要胃腸氣多了，胰臟能見度就差了，這和肝膽脾腎不太一樣。它習慣深藏，習慣若隱若現，在臟腑中最具隱士情操。」上文的敘述，沒有從那個角度描寫胰臟？",["形狀聯想","臟器功能","養生方法","象徵想像代號：1501頁次：8－2"],"C"],[111,0,10,"「在廣大迷茫的世界裡，人要維持本色，安於本色，保有那一點赤子之真，是何等不易？許多時候，為了某些荒謬的理由，甚至為了某些我們所不能了解的原因，我們便在這浮華匆忙的世界裡迷失了，被淹沒了，再也找不到以前的自己。精神上的墮落，使我們四顧無依，徬徨迷惑，但在內心深處，我們依然嚮往一種歸真返璞的清純境界，渴望獲得真正的輕鬆與自由。」根據上文，下列選項何者最符合作者意旨？",["繁華落盡見真淳才是我們內心的嚮往","在浮華世界迷失的人都應該尋求解脫","保有赤子之心，能讓我們開拓人生視野","歷經人生的徬徨，方可明白生命的出口"],"A"],[111,0,11,"「我曾是集中營裡的囚犯。我永遠記得，即使在那樣暗無天日的悲慘情況，有人仍是沿著牢房安慰他人，或是拿出僅剩的麵包分給同伴，也許這些人只是少數，但他們證實了一件事：在某些惡劣的情況下，人仍有自由選擇自己的處事態度及方式。」下列選項，何者最接近上文「少數人」的態度？",["恐懼是人心的惡魔，難以磨滅","奉獻與分享，是人性中的燦爛","冷漠的忽視，即是殘忍的默許","種族雖不同，但非對立的藉口"],"B"],[111,0,12,"「我們的生活不是完全屬於『動態』的，也不完全是屬於『靜態』的，而靜定二字比活動似乎更為重要。靜不是停滯，靜不是休止，靜是莊嚴的工作、熱切的活動的前奏，好似音樂演奏會啟幕前，那寂然無嘩的臺前。只有在最深度的寧靜中，你才可以慢慢的調理弦索，時間一到，它才可發出動人的節響來。只有在幽獨寧靜之中，你才可以悄然的蓄集生命的力量，如涓滴之歸向大海，如塵沙之堆積邱山，不知不覺間，形成了你的強力與偉大。上文內容所呈現的情意感受及其意涵，與下列選項何者最貼近？",["靜觀皆自得","動靜皆自如","寧靜以致遠","情韻靜中求"],"C"],[111,0,13,"「她的冷靜聰明之處在於，即使真看穿了甚麼，也不輕易發人生感慨之語，也不動輒就講佛偈談虛空，因為這些話術實在太做作也太小聰明，太假清高也太荒謬，她寫作或做人是絕不這麼庸俗圖方便的，更不會任意消費自己或他人的人生苦痛。這了悟又不覺悟的個性構成她小說中特有的疏離敘述，也是令人啼笑皆非的黑色幽默的來源。」根據上文，下列選項何者最貼近文意？",["強調人有感情，但應該不執著於情","人活著追求的核心價值是大智若愚","覺悟很難，不該隨意消費自己或他人的苦痛","欣賞冷靜聰明的智慧，認同聰明中的荒謬感"],"C"],[111,0,14,"「臺北的家老了，真的成了老家。原本家裡的出入口裝的都是木門，很輕，把手是圓形的金屬，握上去總是冰涼的，門板的配色很老氣，白色與膚橘色，還貼了許多早已倒閉的連鎖餐廳的招牌貼紙：大頭黃鳥頂著一頭桃色的羽毛。門板表層的角落，因為老舊與濕氣微微翹起，緩慢露出其下的木頭紋理。然而，這一切從來不曾讓我感到時光流逝，只是自然地隨時間接受它們的樣貌。」請問本文的寫作重點是：",["用細膩的筆觸，委婉地表達家具陳舊的感覺","運用視覺、聽覺與觸覺強調家真的該裝修了","用冷靜的敘述方式表達對於時光流逝的無奈","仔細描寫各樣物件傳達接受家已變老的事實"],"D"],[111,0,15,"「旗津沙灘流失速度愈來愈快，但旗津是觀光島，民眾來到旗津，多半是要到旗津海岸戲水，如果沒有沙灘，旗津就失去吸引力，所以工程的建立與成敗都具有指標性意義。但以往保護海岸線的方式，通常是在海岸線放置消波塊，但如此一來，沙灘將不復存在。」根據上文判斷，作者認為：",["消波塊不會嚴重破壞旗津沙灘的景觀","民眾到旗津戲水的雅興不受消波塊影響","保存沙灘應採放置消波塊之外的新工法","放置消波塊能真正確保海岸沙灘的完整性代號：1501頁次：8－3"],"C"],[111,0,16,"「遠處，秧針半吐的水田，如棋盤一樣整齊排列；近處，無心散落的綠色棋子，閒閒地被灑在局外，可是走得更近了，棋子擴大成深碧的卵石，你才猛然醒悟，那成點狀分布的碧綠，竟是臥在沙地上安恬地曬著太陽的□□，一刀剖下，碧沈與朱紅，或是碧沈與金黃的鮮活對比，都不是其他一清二白的遠親所能夠望其項背的。」根據上文，□□最適合填入的是：",["鳳梨","番薯","西瓜","苦瓜"],"C"],[111,0,17,"「探險應該不是單純地走過很多表面上的距離，而應該是一種深入的研究：一件一閃即逝的小插曲，一片風景的片面，或是一句偶然旁聽到的話，可能就是了解及解釋整個區域的唯一關鍵所在，如果缺少那個關鍵，整個區域可能就一直不具任何意義。」根據上文，最接近文意的選項為：",["行萬里路不如讀萬卷書，不可忽視知識","想要瞭解整個區域，必須深入危險之地","區域研究的關鍵在於是否能掌握避險秘訣","探險除外在的移動外，還須用心體察細節"],"D"],[111,0,18,"「然而生命也許就是這樣的吧，無論是歡喜或悲傷，總值得我們認認真真的走一趟。我有著這麼多這麼好的朋友陪我一起走這一條路，你說，我怎麼能不希望這一段路途可以更長更久一點呢？」根據上文，因為有許多好朋友，才使得生命：",["值得依戀","更長更久","幸福美滿","多采多姿"],"A"],[111,0,19,"「不知道走哪條路可抵達想去的地方，可能是阿茲海默氏症的早期徵候，原因在於大腦中最先被這種疾病破壞的區域之一是內嗅皮質，那是我們感知自身位置的關鍵部位。研究人員讓45名有輕度認知障礙的患者，根據虛擬實境頭盔上所見，找出虛擬的步行路徑。表現最差的受試者，腦脊液中阿茲海默氏症的生物標記均呈陽性反應。虛擬實境測試或許可成為有效的診斷工具。」這段文字最適合的標題是：",["內嗅皮質與阿茲海默氏症的關係","阿茲海默氏症的典型症狀與治療","檢測阿茲海默氏症的有效新方法","虛擬實境與阿茲海默氏症的治療"],"C"],[111,0,20,"「職場上，開個玩笑、展現幽默，可收人際潤滑，改善工作氛圍之效，但運用不當，反而弄巧成拙。身為主管，領導才是最重要的任務，而非調笑。朋友間開玩笑，或無傷大雅，但主管跟部屬開玩笑，未必是幽默。部屬與長官開玩笑更得審慎，因為玩笑是否幽默，決定權向來在對方。如果對方不覺幽默，那一番好意倒成惡意。即便開自己玩笑，也不一定幽默，很可能因此傷人而不自知。尤其領導者代表的並非個人，開自己玩笑時，很可能已經傷害了團隊。鼓動幽默時，我們要覺察自己的動機，注意表現的時機，留心他人的反應。須避免譏諷性與戲弄性的言語，以免傷害他人。幽默固然有諸多好處，但若自己個性實在不適合，就不必勉強。」根據上文，下列敘述不符合文意的是：",["開玩笑得要注意自己身分","玩笑出於善意則不會傷人","幽默得搭配適當表達時機","自嘲也是幽默的一種方式"],"B"],[111,0,21,"「『美』，只在瞬間出現，有時候根本不容人靠近，宛如在雲霧掩擁裡汪洋上的孤絕之島，偶一現身之後，總讓人懷疑剛才是不是真的見過她。譬如泰姬瑪哈。泰姬瑪哈曾經是我自幼心嚮往之的書上的圖片，十年前，我終於去了，在那裡度過兩個黃昏然後回來，現在，一切又復歸是書上的圖片。我只能說：『我去過了。』當然，我也還留著一些細節可以向你描述，譬如那向晚的輪廓模糊的平原，還有從平原上吹過來的微微有點溫熱的風，粉紅與乳黃相併而成的大理石平台上，有幾朵隨風落下的白色的素馨花。可是，也就只有這麼多了。而手邊所有的關於歷史的追溯，或者關於工程的浩大與匠心等等都不過是旁白，是敘述用的資料，一如書上的圖片，只供導引與參考，卻絕不是事件本身。」下列選項，何者最符合上文旨意？",["美感是切身感受，無法複製、保存或轉述","再美的事物，未能親眼目睹，也僅是過眼雲煙","旅行不僅提升眼界且增長人生智慧，終歸看山還是山","在宏偉的歷史遺跡面前，任何文字都難以陳述過往的真實代號：1501頁次：8－4"],"A"],[111,0,22,"「睡眠並非不清醒。睡眠遠勝於不清醒。夜間的睡眠精緻複雜，充滿活躍的代謝過程，而且有一系列經過特意安排的獨特階段。腦中有無數功能的修復要仰賴睡眠，且並非單靠其中一種形式的睡眠就能完成。睡眠的每個階段，包括淺度非快速動眼睡眠、深度非快速動眼睡眠、快速動眼睡眠，在夜晚的不同時段對腦提供不同好處。因此，沒有某種形式的睡眠比另一種更重要。」依據上文，最符合文意的選項為：",["不清醒時與淺度睡眠狀態相似","夜間的睡眠處於極度平靜狀態","深度睡眠遠比淺度睡眠更可貴","適度睡眠可即時修補大腦功能"],"D"],[111,0,23,"「很懷念小時候過年的感覺，有濃濃的趣味，各種糕點食品的味兒，大人難見的笑容，還有一種似乎可以為所欲為、放鬆壓抑的興奮。人類學家發現，幾乎所有的民族都有自己的慶典。慶典的原始目的有二：一是敬神祭祖；一是驅邪趕鬼。敬神包括祈福求平安，妻財子祿；驅邪包括治病求健康；這病，也涵蓋心理及精神上的病。人類各種族的慶典，也有一共同的特色，就是大多都有一套制度化的儀式，而儀式包括肅穆的典禮和狂放的歌舞酒食。現在過年不如以前來勁，乃是因為聖誕節、情人節、中秋節等節慶已分批抒發了壓抑。所以，過年原來紓解情緒壓抑的功能就多餘了。」下列選項，何者最不符合上文所述？",["逢年過節可以盡情地放鬆壓抑、為所欲為","慶典的原始目的是：敬神祭祖、驅邪趕鬼","大多數的民族慶典，都有狂放的歌舞酒食","多了其他節慶，使現在過年不如以前來勁"],"A"],[111,0,24,"「資訊時代的到來，網路徹底改變了人類的生活方式。各行各業經網路系統重新佈局，與世界各國接軌，網路是個新世界，這個世界的人被稱作網民，這個網愈結愈實，愈張愈大，網民以幾何級數增長。走進電腦網路，可以遨遊世界，談生意，開會討論。教育工作者一樣感受到電腦的便捷，過去演講，要請專人製幻燈片，不但要等時間，做好也無法修改。如今自己動手用Powerpoint做投影片，方便迅速，還可隨意更換背景以美化畫面。此外，網路資訊豐富，就像一本百科全書，隨時提供查閱。」依據上文，全文的主旨為何？",["網路發展拉近了人類的距離","網路發展減少人類溝通問題","網路改變人類的生活和文化","電子郵件使人們聯繫更便捷"],"C"],[111,0,25,"「我們這兩代，共同照顧農村的新生代，然而，孩子們變成什麼樣子？他們背著很重的書包，在學校、補習班和家裡三處來回移動；他們鮮少靠近土地、觸摸作物，有空就盯著平板不放、開著電視節目配晚餐；他們暫時留在鄉下，一上小學或上了國中，就會被帶到都市加入更激烈的求學競爭；他們踩在田裡就踮腳、沾到泥土就猛拍、看到螞蟻就大叫，也總認為自來水比圳水清澈乾淨。孩子們生在農村，卻不是在農村活著，他們隨著大人的安排，想盡辦法要離開農村。」依據上文，作者筆下「農村新生代」離開農村的原因何在？",["即使是農村，也難逃升學壓力，補習班的影響力深遠","新生代從小嬌生慣養，家事均由大人代勞，缺乏自我謀生的能力","在功利主義的社會文化之下，孩子以升學為目標，被抽離土地，缺乏認同","在電子媒體的時代，如果留在農村，就容易與外界隔絕，沒有辦法跟得上代號：1501頁次：8－5"],"C"],[111,0,26,"「這是一個最尖銳的問題。莫里老人自己回答道：『我當然在受罪。但給予他人，能使我感到自己還活著。汽車和房子不能給你這種感覺，鏡子裡照出的模樣也不能給你這種感覺。只有當我奉獻出了時間，當我使那些悲傷的人又露出笑顏，我才感到我仍像以前一樣健康。』這樣，他就道出了生命的根本意義。」文中作者所謂的「生命根本意義」是：",["善用所有時間","生活無憂無慮","長保青春歡顏","樂於幫助他人"],"D"],[111,0,27,"「法國前總理有一次視察某地，手中拎著個超級市場的塑膠袋，接受採訪時，這個袋子也一直拎在手上，看起來非常自然，並沒有誰覺得他寒酸，沒有誰覺得他不夠紳士，人們反而對他投以欽佩的目光。」下列選項，何者最接近法國前總理的表現？",["節能生活，由自我做起","為譁眾取寵而特立獨行","人人平等，並無貴賤之分","有自信的人不受外界眼光影響"],"D"],[111,0,28,"「波特萊爾的詩：『老巴黎消失了／一座城市的形體，唉，有著比人心還要更快的變化。』所謂比人心更快的變化，特別指向有限的、必定會消亡的生命。人必有死，相較於以磚石所造的城市，人壽如此有限，而人的感受與念頭，又是人類經驗中變動最快的。波特萊爾走過巴黎街道時，如同被電擊般意識到，他所居住的城市已經徹底失去其恆常特性，以讓人無從準備防備的速度，持續變化。應該提供我們安穩依賴的磚石之物，背叛了我們的期待，翻身比我們念頭的轉換，變得更快更劇烈。」下列選項，何者不是這段文章所要傳達的意旨？",["建造城市所需的磚石之物，有恆常特性，永遠不會消失","有限的、必定會消亡的生命，不只是人，還包括老巴黎","我們以為人心變化很快，實際上城市的變化可能比人心還快","作者最終要傳達的是，人心變動太快，把磚石穩固的城市也改變"],"A"],[111,0,29,"「凡不肯說謝謝的人，是一個驕傲冷橫的人，他覺得在這世界過的是『銀貨兩訖』的日子。他是工商業社會的產物，他覺得他不欠誰，不求誰，他所擁有的東西都是他該得的，所以他不需要向誰說『謝謝』。但我知道，我並不『該』得什麼，我曾赤手空拳來到這個世界，沒有人『該』愛我，沒有人『該』養我，沒有人『該』為我廢寢忘食，出入攜抱。我也許繳了學費，但老師那份關懷器重是我買得到的嗎？我也許付了米錢，但農夫的辛勞豈是我那一點錢報償得了的？」「我曾赤手空拳來到這個世界」，「赤手空拳」的「赤」非指顏色，而有「空無一物」的意思。下列選項，非指顏色的是：",["「白」手起家","「黃」梅時節","「黑」布馬褂","「綠」煙紅霧"],"A"],[111,0,30,"承上題，本文意旨為：",["凡事應心存感恩","人不可錙銖必較","禮貌使社會溫暖","金錢絕不是萬能"],"A"],[111,0,31,"「理想的下午，當消使在理想的地方，通常這地方是在城市。幽靜田村，風景美極，空氣水質好極，卻是清晨夜晚都好，下午難免苦長。理想的下午，有賴理想的下午人。這類人樂意享受外間。樂意暫且擱下手邊工作，樂意走出舒適的廳房、關掉柔美的音樂、闔上津津有味的書籍，套上鞋往外而去。也只是漫無目的的走，看看市景，聽聽人聲。穿過馬路，登上台階，時而進入公園，看一眼花草，瞧一眼池魚。揀一方大石或鐵椅坐下，不時側聽鄰客高談時政，嗅著飄來的香菸味，置之一笑。有時翻閱小報，悄然睏去。醒來只覺眼前景物的色調略呈灰藍，像套了濾色鏡，不似先前那麼光燦了，竟如同眾人散場多時只遺自己一個的那股辰光向晚寂寂。然一看錶，只過了十五分鐘。」根據上文，下列何者最符合作者所謂「理想的下午」？",["請假半天，在幽靜的山間園林尋幽訪勝","暫時放下工作，帶一本小書到公園長椅上閒坐閱讀","坐在城市的小咖啡廳，欣賞音樂與窗外風景，嗅著鄰座飄來的菸味","帶著一顆悠閒的心，在城市中漫步閒坐，隨意地體驗城市中的百態代號：1501頁次：8－6"],"D"],[111,0,32,"承上題，作者認為「理想的下午」應該發生在城市中，依引文推測，最可能的原因是什麼？",["身處在熱鬧塵俗之中，正可以靜觀世間多種趣味","偷得浮生半日閒，時間所限，難以探訪鄉間美景","交通方便，商業活動頻繁，可以調劑無聊的午後","城市中人來人往，個人做什麼都不至於感到孤寂"],"A"],[111,0,33,"「財團法人國家文化藝術基金會」為辦理「國家文藝獎」，請全國文教機構與相關單位，推薦適當人選，其使用之公文為：",["簽","呈","咨","函"],"D"],[111,0,34,"下列公文中稱謂用語，何者正確？",["對於上級機關，為表尊敬，應以「貴」稱之","對於機關首長，為表尊敬，應以「臺端」稱之","無論與其他機構有無隸屬關係，皆可用「本」自稱","為尊重性別平權，不宜使用「先生」、「女士」，應一律稱「君」"],"C"],[111,0,35,"下列有關公文傳真的敘述，何者是錯誤的？",["公文傳真應以原件為之，不宜用影印本傳真","各機關因處理傳真公文需要之章戳，得自行刻用之","完成陳核、繕校，未蓋用印信或簽署前，為爭取時效，得先行傳真","傳真發文時，應先登錄傳真公文登記表（簿），記載相關事項、加蓋傳真作業人員名章及確認受方電話、身分二、複選題（第36題至第45題，占30分）說明：每題3分，所列的五個選項，其中至少有二個是正確答案。各題之選項獨立判定，全部答對者，得3分；答錯一個選項者，得1.8分；答錯二個選項者，得0.6分；所有選項均未作答或答錯多於二個選項（不含二個）者，該題以零分計算。"],"C"],[111,0,36,"下列選項用語使用正確的是：",["謝謝您惠賜大作，敝刊倍增光彩","小犬身體不適，我代他向您請假","國家政通人和，百姓應居安思危","在下仁民愛物，是難能可貴之才","杯水車薪的物價，令人喘不過氣"],"ABC"],[111,0,37,"下列各選項「」內的詞語，使用正確的是：",["近日的芬普尼毒蛋事件，使食安問題再度「引人遐思」","世大運慶功遊行，所到之處「萬人空巷」，高舉旗幟夾道歡迎","強颱直撲的新聞發布後，民眾不敢「掉以輕心」，均謹慎防颱","企業投下鉅資邀請知名影星為產品代言，希望能讓銷售量「推陳出新」","舉重選手於世大運奪得金牌並破世界紀錄的一刻，全場觀眾「破涕為笑」代號：1501頁次：8－7"],"BC"],[111,0,38,"「柏克萊使我睜開眼睛，更迫切地觀察社會體認社會；在觀察和體認之餘，我並沒有感覺知識無能，我反而更信仰知識的力量。知識是力量，但知識不可以禁閉在學院裡，知識必須釋放，放到現實社會裡，方才是力量。學院要提供博大開放的文理科教育，所謂liberal arts的教育，這種教育雖然可能賦予學生日後謀生的技能，但那並不是最重要的目的；這種教育要使學生在潛默中體會到知識份子的責任，介入社會而不為社會所埋葬──而我相信這是絕對可能的。我樂觀，因為樂觀乃是柏克萊精神的真諦。」根據上文，下列選項敘述正確的是：",["柏克萊精神，是充滿樂觀與現實關懷","知識是力量，但必須釋放到現實社會","文理科教育主要目的是訓練謀生技能","知識份子的責任是介入社會並保持獨立自主的判斷","學院教育與社會關懷雖有衝突，但仍必須積極調合"],"ABD"],[111,0,39,"「時間是善良的，還是邪惡的魔術師呢？不是，時間只是一種簡單的乘法，另把原來的數值倍增而已。開始變壞的米飯，每一天都不斷變得更腐臭。而開始變醇的美酒，每一分鐘，都在繼續增加它的芬芳。在人世間，我們也曾經看過天真的少年一旦開始墮落，便不免愈陷愈深，終於變得滿臉風塵，面目可憎。但是相反的，時間卻把溫和的笑痕，體諒的眼神，成熟的風采，智慧的神韻添加在那些追尋善良的人身上。同樣是煮熟的米，壞飯與美酒的差別在哪裡呢？就在那一點點酒麴。同樣是父母所生，誰墮落如禽獸，而誰又能提升成完美的人呢？是內心深處，緊緊環抱不放的，求真求善的渴望。」依據上文，符合文意的是：",["時間非善非惡，只會增加原本數值","掌握利用時間，是處世智慧的關鍵","自我如何期許，時間也會如何對待","透過時間積累，自能達到偉大成就","時間力量強大，人類永遠無法對抗"],"AC"],[111,0,40,"「幾年來，每見媒體報導校長或企業負責人在畢業典禮或尾牙時節，扮裝成天鵝、超人娛樂學生、同仁，我總覺得痛苦不堪。痛苦的原因，並不是我反對扮裝娛人，而是我無法忍受不美的扮裝！試想，身材已屆中年的校長與企業負責人，扮起天鵝、超人，不得不露出鬆弛的肌肉加上突出的腹部，如何能登大雅？」根據上文，作者認為：",["自娛娛人難登大雅之堂","扮裝需要兼具美感與創意","身材不好的校長與企業負責人不當的扮裝，令人無法忍受","畢業典禮或尾牙時，校長與企業負責人不一定要扮裝娛人","選擇天鵝與超人作為扮裝，有損校長與企業負責人的形象"],"BCD"],[111,0,41,"「我一直都在尋求挫敗，尋求被征服被震懾被併吞的喜悅。有人出發去『征山』，我從來不是，而是剛好相反，我爬山，是為了被山征服。有人飛舟，是為了『凌駕』水，而我不是，如果我去親炙水，我需要的是涓水歸川的感覺，是自身的消失，是形體的渙釋，精神的冰泮，是自我復歸位於零的一次冒險。」下列選項，何者符合作者所尋求的「挫敗」？",["錯失穩操勝券的機會","仰望浩瀚無垠的星空","追求真摯醇美的愛情","懾於曠世罕匹的名作","享受珍饈美饌的誘惑代號：1501頁次：8－8"],"BD"],[111,0,42,"「我常向植物學習，覺得他們是最能接受命運，也最不向命運屈服的。他們不會動，種子落在哪兒，就注定一輩子，在那裡生根、成長、死亡。如果是人，遇到這樣不平的遭遇，一定會反抗。但植物無語，他們以另一種方式發言。在熱帶莽林中，上面是遮天的濃蔭，白天黑得像夜晚一樣，許多小樹只能長到一呎多，就再也無法發育。他們卑微地活著，直到有一天，上面的大樹因為雷雨折斷，他們就立刻竄上去，成為大樹。在沙漠裡，白天熱得可以烤蛋，許多種子伏在炙人的砂土下，乾得像是砂的一部分，但是只要有一陣雨，他們就快速萌發、成長、開花。」下列敘述，符合上文旨意的選項是：",["人會反抗，植物不會反抗","只要努力，不可妥協，才能成功","植物的生長，展現出「掌握時機」的智慧","植物雖然看似脆弱，卻具有強韌的生命力","「聽天由命」和「隨波逐流」不足以說明植物長成的道理"],"CDE"],[111,0,43,"「百年前，祖輩渡海來臺。彼時地景枯黃無綠，他們不分冬夏，將幾千幾百斤的汗水灑進地裡，但乾渴的砂土仍張著龜裂大口張狂索求。被日光曬得刺燙燙的砂地如一塊烙鐵，驅趕著踩踏其上的農人。但有人始終不走，他們直立旱地等待。日日夜夜，季季年年，終於等到灣寶庄農地重劃，興圳建渠。可惜砂地如漏，水還未浸透，即迅速流逝。幸賴神明指引，庄民徒手徒腳、齊心齊力，共同鏟挖庄內的紅色黏土丘，將其厚鋪於砂壤，仔細翻攪，此後，再灑下的幾千幾百斤汗水，才開始值得。一直以來，灣寶的農民習於不著鞋履走入田地。早期因為窮困，如今則因田壟有水。泥糊糊，溫潤潤，一踏進，就像裹上一層新生的肌膚。農人的掌有老繭，腰背僵硬，往往帶病在身。但他們仍堅持走進農田，將鋤頭一次一次地劈進地裡。」依據上文，下列敘述正確的是：",["早期灣寶的地質惡劣，不利耕作","灣寶農民以前習慣不穿鞋是因為生活貧困","因為居住條件不佳，灣寶早已人去樓空，成為廢墟","灣寶農民劈進地裡的不只是鋤頭，還有一股有志竟成的精神","灣寶土地改良的方式是將砂土與黏土和在一起，如此可避免砂壤大量流失"],"ABD"],[111,0,44,"「面對電腦的運算能力每兩年就會倍增的飆速發展，我們的社會結構一直處於落後科技發展的狀態，唯一的方法就是增加社會的適應力，也就是要使學習的效益達到最佳化，並將創新特質運用到文化與社會結構上，破除因循僵化、講求靈活應變，以縮短從錯誤學習的時間。大學課程的推陳出新也日益加快，有些課程甚至已標上時效。而隨著創新週期愈來愈短，學習適應的時間愈來愈少，我們所面對的穩定狀態也有了變化，只有不穩定的固定狀態以及偶爾不穩定狀態的差異，新的穩定狀態必定是動態穩定，就像騎腳踏車一樣，必須在雙腳不停地踩動下一直前進。」根據上文，說明正確的選項是：",["人類社會的結構總是無法跟上電腦運算能力的迅速發展","提高學習效益可增加社會的整體適應力，維持靜態穩定","行政機關以穩定為要，避免因創新融入而帶來擾動不安","為了符應社會變動的需求，大學開設時效課程將成為一種趨勢","最佳適應力表現在失敗後能快速修正，並維持動態平衡的前進"],"ADE"],[111,0,45,"下列選項，適合平行機關間使用的是：",["「檢陳」、「附送」","「希查照」、「附送」","「請查照」、「附送」","「請查照」、「希查照」","「請查照」、「敬表同意」"],"CE"],[111,1,1,"以下何種權利屬於智慧財產權？",["債權","抵押權","商標權","姓名權"],"C"],[111,1,2,"甲基金會自創辦以來，致力於雛妓救援與家暴受害者庇護，近年尤努力消彌社會中所有性/性別暴力行為與壓迫，以建立性別公義的社會。有關甲基金會的敘述，下列何者正確？",["和政黨一樣都是屬於非營利組織","從民法的屬性分類屬於社團法人","關心社會議題的層面較政黨多元","常藉由政治參選達成該組織宗旨"],"A"],[111,1,3,"柔柔生長在一個小康的家庭，父母親從小就栽培她學習各項才藝，塑造了柔柔高雅的氣質和談吐。上述現象最適合用下列那一種概念加以說明？",["經濟資本","社會資本","象徵資本","文化資本"],"D"],[111,1,4,"據環保團體估計，每年約有一千多萬噸的塑膠垃圾流入海中，超過700種海洋物種受到海洋塑膠污染的影響，海洋垃圾也造成對船舶航行的阻礙、生態系惡化等不良影響，前述現象最適合用下列何種概念說明？",["外部成本內部化","共有財的悲歌","搭便車心態","鄰避效應"],"B"],[111,1,5,"某甲認為年輕人自己不夠努力因此才買不起房子，某乙反駁認為，許多財團手握大筆資金投入房地產市場，成為炒房元兇，年輕人靠著微薄的薪水，不論如何努力也永遠追不上高漲的房價。某乙的說法最接近下列何項觀點？",["功能論","衝突論","成就地位論","人力資本論"],"B"],[111,1,6,"美國大選常見各族群文化與價值之間的激辯，但似乎都不影響美國民眾對國家的支持。請問美國人民對國家的齊心支持，最可能基於下列何項理由？",["公民身分的保障形成對國家的認同","國家透過嚴密監控形成公民意識","透過種族通婚大幅減少社會分歧","所得平均形成強大的社會凝聚力"],"A"],[111,1,7,"隨著永續發展思潮的風起雲湧，消費者願意以合理價格，購買以友善耕作方式所生產的蔬果，此種購買行為符合下列何種概念？",["綠色廠房","企業社會責任","比較利益","綠色消費"],"D"],[111,1,8,"阮氏是從東南亞來臺灣從事家庭看護的移工，工作已經一年多，非常細心負責，深受被照顧者李伯伯家人的喜愛，彼此感情非常好。某日她推著坐在輪椅上的李伯伯要去投票，遭到一輛闖紅燈的機車撞上，讓她腿部扭傷，醫生評估必須休養兩週。關於阮氏在臺灣享有的權利，下列何者正確？",["阮氏在臺灣居住已超過四個月，故具有市長投票權","因阮氏是外國人，故無法獲得肇事者的醫療賠償費","阮氏在休養期間享有國民年金保險給付的權利","在臺灣工作期間，雇主可以為阮氏投保勞工保險"],"D"],[111,1,9,"一名15歲的國中生，下載行政院人事行政總處天然災害停止辦公及上課情形查詢網頁的原始檔案，將其改成今日起停班、停課一年等內容。這名國中生被依偽造公文書罪函送法辦。下列敘述何者正確？",["其行為已影響社會至鉅具該當性，所以由檢察官調查起訴","國中生缺乏對刑法的完整了解，所以其行為不具有違法性","他只是國中生的年齡，所以他的行為不具備完全的有責性","該國中生出於好玩，並非故意犯罪，因此他不須負有責性"],"C"],[111,1,10,"近年來，臺灣多起隨機殺人案件引發社會關注，而部分加害者因罹患思覺失調症而獲判無罪，判決或辯護理由常引發媒體與大眾的議論。但法治國家就是要在正當法律程序下仔細分析罪犯的動機和成因，律師的角色是在維護被告基本訴訟權利不被侵犯，而法官則是依法公正審判。若從人權的角度出發，上述內容是在強調何種權利保障的重要性？",["行動自由","公民參政","社會安全","公正審判"],"D"],[111,1,11,"我國「彈劾權」的設計，與三權分立的國家略有不同。關於我國彈劾權的行使，下列何者正確？",["立法院可以對行政院院長提出彈劾案","立法院可調查且彈劾違法的公務人員","監察院可對違法失職的總統或副 下列何者正確？",["天下之物，本無得失","差之毫釐，失之千里","名正言順，天下乃安","君子不器，各適其用"],"A"],[110,0,17,"《荀子．勸學》：「不積蹞步，無以至千里；不積小流，無以成江海。」下列選項最符合本文意旨的是：",["學而時習之，不亦說乎","學然後知不足，教然後知困","真積力久則入，學至乎沒而後止也","一日暴之，十日寒之，未有能生者也"],"C"],[110,0,18,"「這期間我看到了一些怵目驚心的文字，譬如說一位經營文藝出版社的朋友這樣寫：『賣書和賣鑽石一樣……。』我不懂意思，不禁在心中犯嘀咕：『鑽石和書怎麼做比較？』繼續讀下去，才知道他的意思是：『鑽石價錢昂貴，一個月有那麼幾筆生意就很不錯了。現在賣書也那樣，一個月就只有那麼幾筆。』」下列何者最符合作者所要表達的意思？",["讚嘆文藝的可貴","驚奇書價的昂貴","感嘆文藝出版的蕭條","不解讀書風氣的敗壞"],"C"],[110,0,19,"「魚類與鯨豚這兩樣海洋生物資源之豐寡，與背後支撐整個海洋生態系統的海洋環境密切相關。然而，臺灣社會與海洋生物資源的關係，長期停滯在低層次的腸胃等級。我們過度漁撈，我們隨手將污染擴及海域，造成東部沿海的魚源處於近臨枯竭的狀態。鯨豚失去食物基礎支撐，快速且大幅減少，因其生態位階高，跌落更快、更慘。」下列選項何者不是鯨豚數量減少的原因？",["人類的污染擴大","鯨豚繁衍能力差","漁民過度的捕撈","失去食物鏈基礎"],"B"],[110,0,20,"「我靜坐水湄一隅，瞧！蘆葦□□著身子，頂著一頭□□般的髮。是由於負荷了過重的鄉思而壓彎了脊樑？是因著朝夕守望而愁白了頭嚒？」根據文意，文中的□□依序應是：",["挺立／青絲","傾斜／蓬草","佝僂／銀絲","搖曳／枯柳"],"C"],[110,0,21,"下列題辭用語，何者適當？",["「于歸之喜」：慶賀遷居","「瓜瓞延祥」：慶賀生孫","「母儀足式」：慶賀女壽","「弄璋誌喜」：慶賀生女"],"B"],[110,0,22,"「來自日本東京的鐵道迷藤井英樹，熱愛蒸汽火車。四年前來臺，發現臺灣的蒸汽火車竟然跟日本的一樣，讓他因此著迷，四年來已造訪臺灣五十次！藤井說，臺鐵修復很多蒸汽火車，因此特別喜歡臺鐵。今年六月起，連續三個週六，『仲夏寶島號』由玉里開到臺東，藤井英樹特別安排三天來臺灣搭乘。」依據上文，下列敘述何者最符合文意？",["臺灣的蒸汽火車吸引日本鐵道迷","藤井英樹因為喜歡臺灣，特別來臺五十次","自六月起臺鐵每週六皆開出「仲夏寶島號」","藤井英樹因為「仲夏寶島號」而熱愛蒸汽火車代號：1501頁次：4－3"],"A"],[110,0,23,"下列選項的情感「對象」，並非「朋友」的是：",["布衣之交不可忘，金蘭之誼常在心","遙知兄弟登高處，遍插茱萸少一人","若知四海皆兄弟，何處相逢非故人","桃花潭水深千尺，不及汪倫送我情"],"B"],[110,0,24,"簾外雨潺潺，春意闌珊。羅衾不耐五更寒。夢裡不知身是客，一晌貪歡。獨自莫凭欄，無限江山。別時容易見時難。流水落花春去也，天上人間（李煜〈浪淘沙〉）。其中「夢裡不知身是客，一晌貪歡」指的是：",["只有夜夜笙歌，醉生夢死方能排遣苦悶","貶謫他鄉無可奈何，只好貪圖片刻歡愉","羈旅漂泊生涯，把人生當作虛幻的夢境","現實生活苦悶難捱，貪戀夢中短暫歡樂"],"D"],[110,0,25,"「鳥飛到雲中去／鳥群中少了你／太陽落到山稜後／山群中少了你／是的，少了你這風景又怎能印得成記憶」，下列何者最接近本詩旨意？",["繁華落盡見真淳","鳥盡良弓勢必藏","有了你，生命才有意義","有遺憾，也是一種美麗"],"C"],[110,0,26,"陳述古密直知建州浦城縣日，有人失物，捕得，莫知的為盜者。述古乃紿之曰：「某廟有一鐘，能辨盜至靈。」使人迎置後閤祠之，引群囚立鐘前，自陳：不為盜者摸之則無聲，為盜者摸之則有聲。述古自率同職禱鐘甚肅，祭訖，以帷圍之，乃陰使人以墨塗鐘。良久，引囚逐一令引手入帷摸之，出乃驗其手，皆有墨，唯有一囚無墨。訊之，遂承為盜，蓋恐鐘有聲，不敢摸也（沈括《夢溪筆談》）。文中「述古自率同職禱鐘甚肅」的主要用意為何？",["假借鬼神之說，使人心生畏懼","善用辦案工具，期能事半功倍","官府例行公事，以求辦案順利","藉由虔誠敬拜，祈求鬼神助佑"],"A"],[110,0,27,"「我的朋友是一位肖像畫家，生活不好過，朋友紛紛給她忠告。大多數人的建議歸結來講就是：『找份正職吧。』她對我說：『我本來就有正職啊！我是個畫家，他們難道不明白嗎？』……三年過去了，到目前為止，我的朋友證明了自己是對的。」下列何者，最符合文意？",["藝術家可以將個人創作視為正職","創作與謀生彼此衝突而不能兼顧","藝術無價不必討論現實薪資問題","有固定收入才是藝術家謀生之道"],"A"],[110,0,28,"「古人有詩云：『但願此心春長在，須知世上苦人多。』若能時時想到世間多少不如我們、需要我們幫助的人，那麼成敗得失之念，就容納不下，此心就充滿歡樂了。」下列選項，最接近意旨的是：",["知足常樂","簡單就是快樂","寬容是快樂的來源","獨樂樂，不如眾樂樂"],"A"],[110,0,29,"「身為埔里農家小子，年輕的洪健智不想待在故鄉務農，高中畢業後便毅然前往臺北晶華飯店學習和式料理。在緊湊的都會生活裡，他圓了夢，卻也因此錯失了孩子部分的成長時光。『週遭長輩都會說，要讓孩子在都市成長，才會有競爭力。結果卻是讓孩子的童年只剩學校和安親班。』洪健智談起孩子，回想自己，『我們小時候在田野裡跑啊跑啊，在溪邊釣魚、原野上焢窯，那才是真的快樂的小時候！』」根據上文，下列選項何者最符合本文意旨？",["相較城市生活，家鄉生活步調更適合自己","競爭力並非一定要在城市才可以培養出來","童年的時光很重要，希望將快樂還給孩子","對於年少時期的錯誤選擇，感到後悔不已"],"C"],[110,0,30,"「如膠似漆」與「水乳交融」語意對應關係，與下列何組最不相同？",["「宵衣旰食」與「廢寢忘餐」","「推心置腹」與「披肝瀝膽」","「弊絕風清」與「政以賄成」","「巾幗鬚眉」與「女中豪傑」"],"C"],[110,0,31,"「素養跟知識有沒有差別？當然有，而且有著極其關鍵的差別。我們不要忘記，納粹頭子很多會彈鋼琴、有哲學博士學位。」下列選項，最接近意旨的是：",["知識易使人傲慢","讀書越多，精神就越健康而勇敢","才能只是天分，善良卻是一種選擇","不要用華麗外衣裝飾，而是以知識武裝自己"],"C"],[110,0,32,"下列選項，何者表達出「壯志猶存」的懷抱？",["人生得意須盡歡，莫使金樽空對月","今朝有酒今朝醉，明日愁來明日愁","人生到處知何似，應似飛鴻踏雪泥","夜闌臥聽風吹雨，鐵馬冰河入夢來"],"D"],[110,0,33,"",["","","",""],"B","iVBORw0KGgoAAAANSUhEUgAABFYAAAAzCAIAAAAy1BvLAAAACXBIWXMAAA7EAAAOxAGVKw4bAABOQUlEQVR4nO2dd5QVxdbFAcmSBQSUKDlIRnLOApIVCRIlCEPOwhKQnCQ/QJEoYVAQRCUqIoMEQUCCRIkiCCKo+FTe/X7fPYtaRfXtvj0zd2DE3n/M6unbofrUqXP2rq6qjuPz4MGDBw8ePHjw4MGDh38N4jzsAnjw4MGDBw8ePHjw4MHDg4MngTx48ODBgwcPHjx48PAvgieBPHjw4MGDBw8ePHjw8C+CJ4E8eIg6VluwYcOGh10oDx48ePDgwYMHD0549CXQxYsX69evv3DhwlBd8OrVq3fv3o3sWfv37z948GD0796vX78ePXocPnzY/Sl//PHHlClTfvrpp4C//v333xhnyJAhv/76axTKc+fOnbVr144ZM+a///2vm+Ojb4e//vqrTp06I0eOvHHjhvUnu7OOHDnyv//9T7a7d+/+zjvvqH+jg0KFCi29Hx988IHD8Z06dbK6ItYL+DgB8dFHHwXcf+vWLWMPNevmgrEcV65cse4cPnz4nj17QnWLy5cvf/vtt/oe/j158qT7Kzwsr1ZxACu1b99+y5Yt0SmDBw8ePHjw8O/Boy+B1q1bV7BgwUOHDkXtdJ2BXbhwYejQoTly5Gjbtm1krwPhfvHFF9evXx+1YijUq1evY8eO586dc3MwsmfatGnZsmXLly9fhw4d9J9++OGHVatWdenSJV26dClTpqxatWqrVq2CqgIO4MSIiIj58+d37dr1ueeee/zxx3PmzFmrVq2xY8e6KVJI7BA/fvx58+ZZNdsrr7xSuXLl7777znrKvn37Gjdu/Ntvv7GdJ08eJFB0CqDAg7s/GBmWPn16qs/YX7x48c6dO7vk3KjZwYMHW/cPGjRo9OjR6mUU1ZE3b95Tp065L16M4s8//zx9+rRLnazw/vvvJ0qU6O2339Z3/v7774899hht8JdffolyeT7++GOaUsuWLfGZXLlyJUmS5MSJE4sWLRK9UbNmzVSpUu3evdvl1R6WV8+cOXPEiBE+f5hKkCDB0aNHo1M 駕駛人無駕駛執照而駕駛者，處新臺幣六千元以上一萬二千元以下罰鍰，並當場禁止其駕駛。下列敘述何者正確？",["主管機關對於個案中違規駕駛人裁處罰鍰之額度，享有自由行使裁量之權限","主管機關對於是否當場禁止違規駕駛人駕駛，應依法律授權目的行使裁量權","對於初次違規之駕駛人，主管機關皆應裁處最低罰鍰額度，以符合比例原則","對於具有特殊情形之個案，不適用統一裁罰基準表決定罰鍰額度，並未違法"],"D"],[110,2,15,"下列何者不得依行政執行法規定，移送強制執行？",["交通違規罰單","支付命令","怠金","核課稅額通知書"],"B"],[110,2,16,"關於法明確性原則之敘述，下列何者錯誤？",["法規內運用不確定法律概念或概括條款，一概違反明確性原則","法律雖以抽象概念表示，不論其為不確定法律概念或概括條款，均須無違明確性之要求","對人民權益影響越大者，授權之明確程度應越高","法律文義非難以理解，且為受規範者所得預見，並可經由司法審查加以確認者，即不違明確性原則"],"A"],[110,2,17,"行政機關限制人民財產權，應受下列何者之限制？",["行政保留原則","法官保留原則","憲法保留原則","法律保留原則"],"D"],[110,2,18,"行政機關之行為，必須受到法律及一般法律原則之拘束，此為下列何項原則之內涵？",["信賴保護原則","依法行政原則","比例原則","平等原則"],"B"],[110,2,19,"依行政程序法規定，下列何者不屬於比例原則之內涵？",["行政行為應有法律之依據","行政行為應有助於行政目的之達成","若有多種行政行為均同樣能達成行政目的，行政機關應選擇對人民權益損害最少者","行政行為所造成之損害不得與欲達成行政目的之利益顯失均衡"],"A"],[110,2,20,"有關瑕疵行政處分效力之敘述，下列何者正確？",["無效行政處分，不發生救濟可能性；得撤銷之行政處分得由人民訴請行政法院撤銷","行政處分違反公共秩序善良風俗者，無效","無效行政處分，係自發現無效事由時起，向將來失效；得撤銷行政處分經撤銷後，有溯及失效的效果","行政機關作成瑕疵行政處分，不得本於職權撤銷該處分，僅得由行政法院為之"],"B"],[110,2,21,"下列何種行政處分之瑕疵，依行政程序法規定得以補正？",["應經人民申請而未經申請之行政處分","由行政處分書面不能得知處分機關之行政處分","相對人不存在之行政處分","違反專屬管轄之行政處分"],"A"],[110,2,22,"徵收人民土地應同時給與人民相當於市價之金錢彌補，該金錢給與之法律性質為何？",["國家賠償","損失補償","損害賠償","準徵收之侵害"],"B"],[110,2,23,"下列何者之爭議，不得向行政法院尋求救濟？",["甲在市立公園遊玩，因設施鏽蝕導致受傷，請求國家賠償","乙不服市政府對其申請自用房屋適用優惠稅率之否准決定","丙不服市政府對其所為之罰鍰處分","丁不服市政府所為之專案考績免職處分"],"A"],[110,2,24,"提起下列何種行政訴訟類型，原則上應先踐行訴願程序？",["一般給付訴訟","行政處分無效確認訴訟","課予義務訴訟","法律關係存否確認訴訟"],"C"],[110,2,25,"行政訴訟若以公法人之機關為被告，原則上應由那一個行政法院管轄？",["由被告機關所在地之行政法院管轄","由原告戶籍所在地之行政法院管轄","由原告住所地之行政法院管轄","一律以中央政府所在地之行政法院管轄代號：3501頁次：4－3"],"A"],[110,2,26,"甲死亡後留下數筆存款及土地，其子女乙、丙、丁、戊為繼承人。甲遺囑中表示四大房子孫要團結，故不得分割遺產。下列敘述何者正確？",["乙、丙、丁、戊不能分割，要傳給後代變成祭祀公業","乙為繼承人，得隨時請求分割遺產，丙、丁、戊不得拒絕","乙、丙、丁、戊不能分割，但繼承開始10年後，得請求分割遺產","乙、丙、丁、戊於甲死後，因遺囑禁止分割，依民法規定，遺產於20年內均不得分割"],"C"],[110,2,27,"下列關於民事訴訟代理人之敘述，何者正確？",["簡易事件第二審之訴訟代理人，應委任具有教育部認證之法律相關科系獲碩士學位以上者，擔任訴訟代理人。該訴訟代理人之酬金，由國庫墊之","訴訟代理人就其受委任之事件有為一切訴訟行為之權。但捨棄、認諾、撤回、和解、提起反訴、上訴或再審之訴及選任代理人，非受特別委任不得為之","訴訟代理人有二人以上者，應共同代理當事人，不得單獨為之","訴訟代理人為當事人聲請訴之追加、變更或提起反訴時，應先以書面聲請法院得審判長同意後，並為當事人先墊付訴訟費用"],"B"],[110,2,28,"關於自治條例之敘述，下列何者錯誤？",["應分別冠以各該地方自治團體之名稱","在直轄市為直轄市法規","自治條例在縣稱縣規章","自治條例在鄉稱鄉規程"],"D"],[110,2,29,"關於民事支付命令之敘述，下列何者正確？",["債權人之請求須證明","債務人於法定期間合法提出異議，支付命令之效力不受影響","債務人未於法定期間合法提出異議，支付命令不得作為執行名義","支付命令之異議，得不附理由"],"D"],[110,2,30,"民事訴訟當事人如因不應歸責於己之事由，遲誤上訴期間，依法得如何尋求救濟？",["逕向上級法院提起上訴","向原法院聲請延長期間","向原法院聲請回復原狀","向原法院聲請再審"],"C"],[110,2,31,"有關親屬之親系與親等之規定，對於自己與繼母之表兄的親系與親等，下列敘述何者正確？",["無親屬關係","旁系姻親三親等","旁系姻親四親等","旁系姻親五親等"],"A"],[110,2,32,"關於民法規定正當防衛、緊急避難與自助行為之敘述，下列何者正確？",["因避免自己之生命身體受到急迫危險所為之自助行為，致他人財產受新臺幣50萬元以下之損害者，不負賠償責任","因避免自己之配偶、或直系血親三親等內之親屬，受到身體或自由上之急迫危險所為之家族集體自助行為，致生他人之生命身體或財產損害者，不負賠償責任","對於現時或24小時內已發生之不法的人身侵害，為防衛自己、配偶或家屬之權利所為的行為，不負損害賠償之責","為保護自己權利，對於他人之自由或財產施以拘束、押收或毀損者，不負損害賠償之責。但以不及受法院或其他有關機關援助，並非於其時為之，則請求權不得實行或其實行顯有困難者為限"],"D"],[110,2,33,"依現行民法之規定，19歲之甲因很想購買全新機車，擅自將父親乙贈與之老舊A機車拋棄。甲對A機車之拋棄行為效力如何？",["有效，不得撤銷","無效","效力未定","有效，得撤銷"],"B"],[110,2,34,"甲欲購買乙的二手筆記型電腦，交付新臺幣（下同）5,000元定金予乙，約定5日後交貨。關於定金之敘述，下列何者錯誤？",["甲交付定金予乙，依民法規定，乙受有定金時，推定其契約成立","若甲於交付定金後，現場檢視該筆電時，不慎摔毀該筆電，則甲不得請求返還定金","若乙交付筆電前，不慎摔毀該筆電，則乙應返還1萬元給甲","若乙交付筆電前，筆電因無名火而燒燬，甲不得請求返還定金"],"D"],[110,2,35,"關於保證之敘述，下列何者錯誤？",["保證人之負擔較主債務人為重者，應縮減至主債務之限度","債權人未就主債務人之財產強制執行而無效果前，且未有喪失先訴抗辯權之事由，保證人對於債權人得拒絕清償","主債務人所有之抗辯，保證人均得主張","保證人對於因欠缺行為能力而無效之債務，縱使知其情事而為保證，該保證仍因從屬性而無效"],"D"],[110,2,36,"關於不動產物權行為之敘述，下列何者錯誤？",["要式行為","非經登記，不生效力","非經交付標的物，不生效力","債權行為無效、不成立或被撤銷者，不影響不動產物權行為效力代號：3501頁次：4－4"],"C"],[110,2,37,"下列何者非屬最高限額抵押權所擔保原債權之法定確定事由？",["擔保債權之範圍變更或因其他事由，致原債權不繼續發生者","最高限額抵押權所擔保之債權，其請求權已因時效而消滅","最高限額抵押權人聲請裁定拍賣抵押物","債務人或抵押人經裁定宣告破產確定者"],"B"],[110,2,38,"甲男乙女為夫妻，有丙、丁二子。丙有戊、己二子。丙先於甲死亡。甲死亡時，戊依法拋棄繼承。己之應繼分為何？",["三分之一","四分之一","五分之一","六分之一"],"A"],[110,2,39,"關於刑事訴訟法第155條第2項所定「無證據能力、未經合法調查之證據，不得作為判斷之依據。」下列敘述何者正確？",["這是證據之證明力的規定","證據能力是由法院本於確信自由判斷","這是關於嚴格證明的規定","只要經過合法調查的證據資料，均有證據能力"],"C"],[110,2,40,"檢察官以被告甲在警詢中自白、購毒者乙在偵查中之證言等證據，起訴甲販賣毒品罪。甲在第一審受命法官準備程序期日，陳述其在警詢時之自白，是被強暴脅迫所為，下列何人要就甲在警詢中係出於自由意志之自白，指出證明方法？",["甲","檢察官","法官","乙"],"B"],[110,2,41,"被告經法官訊問後，犯罪嫌疑重大，而有羈押原因，非予羈押顯難進行訴訟。然下列何項原因，不得單獨成為羈押被告原因？",["逃亡或有事實足認為有逃亡之虞者","有事實足認為有湮滅、偽造、變造證據或勾串共犯或證人之虞者","所犯為死刑、無期徒刑或最輕本刑為五 家富良馬，其子好騎，墮而折其髀，人皆弔之。其父曰：「此何遽不為福乎！」居一年，胡人大入塞，丁壯者引弦而戰，近塞之人，死者十九，此獨以跛之故，父子相保。（《淮南子．人間》）最符合上文意旨的選項是：",["福無雙至，禍不單行","有福同享，有難同當","禍兮福之所倚，福兮禍之所伏","天有不測風雲，人有旦夕禍福"],"C"],[109,0,15,"求物之妙，如繫風捕影，能使是物了然於心者，蓋千萬人而不一遇也，而況能使了然於口與手者乎？是之謂辭達。辭至於能達，則文不可勝用矣。（蘇軾〈答謝民師書〉）根據上文，下列選項何者最切合文意？",["捕風捉影的言辭不可能為真","以言辭具現物之妙實非易事","言辭通達的人未必能寫文章","能言善道之人有理走遍天下"],"B"],[109,0,16,"眾盲摸象，其觸牙者即言象形如蘆菔根，其觸耳者言象如箕，其觸頭者言象如石，其觸鼻者言象如杵，其觸腳者言象如木臼，其觸脊者言象如床，其觸腹者言象如甕，其觸尾者言象如繩。（《大般涅槃經》）下列選項，何者與上文主旨最接近？",["牝牡驪黃","狗尾續貂","扣槃捫燭","濫竽充數"],"C"],[109,0,17,"甲問於乙曰：「鑄銅為鐘，削木為莛，以莛叩鐘，則鏗然而鳴；然則聲在木乎？在銅乎？」乙曰：「以莛叩垣牆則不鳴，叩鐘則鳴，是聲在銅。」甲曰：「以莛叩錢，積則不鳴，聲果在銅乎？」乙曰：「錢積實，鐘虛中，是聲在虛器之中。」甲曰：「以木若泥為鐘則無聲，聲果在虛器之中乎？」依據上文，下列敘述何者正確？",["甲始終對聲音來源感到疑惑","乙堅持聲音來自於虛器之中","乙以積錢不鳴證明銅不發聲","甲乙都一致認為物各有其聲"],"A"],[109,0,18,"「過去的我，嫉醜惡如仇，容不得一點卑劣、不義，總想徹底除之而後快，不能除之，便想隱身、閃逃，避到無可避為止。這疾病讓我明白，天地廣袤，萬物並容，黑白美醜，大化眼中自有其存在的理由。」根據上文，下列何者最適合用來說明作者的心態轉變？",["由潔身自好轉為圓融處世","由褊急狹隘轉為心寬氣和","由正義凜然轉為作壁上觀","由憤怒逃避轉為委靡頹唐"],"B"],[109,0,19,"「楊小妹在楊媽媽無微不至的呵護下，長得活潑可愛。育幼院除了身障的楊小妹，還有幾個智能不足的孩子，楊媽媽對他們的愛特別彰顯。她說：『任何一個孩子生下來都應該有人愛他們。』」依據上文，最適合形容楊媽媽的選項是：",["物傷其類","春風化雨","仁民愛物","樂善好施"],"C"],[109,0,20,"「我掛起了個小小招牌：『東海農園』，又蓋了一所小小的山房，以避風雨。用最原始的農具，一坪一坪地把荒地開闢，再一坪一坪地種下了花木蔬菜。『東海農園』在這滿是石頭的荒山上開創之時，連附近的農民都笑我們是傻瓜。但事實證明，只要設計得法而有恆心，荒蕪之地都可以變成美好的花園。」下列選項最能說明作者開墾荒地精神的是：",["順其自然，隨遇而安","篳路藍縷，以啟山林","開疆闢土，功在社稷","露宿風餐，擇善固執"],"B"],[109,0,21,"〈江雪〉：「千山鳥飛絕，萬徑人蹤滅。孤舟蓑笠翁，獨釣寒江雪。」這首詩是柳宗元在朝政改革失敗，連遭貶謫，居永州時所作。就此觀之，下列最接近詩旨的選項是：",["清高脫俗，守貞不渝","怡然恬淡，閑適自在","縱情山水，遊戲人間","遺世獨立，超然遠舉"],"A"],[109,0,22,"「有人說：『時間即生命。』也有人說：『時間即金錢。』二說均是。不過細想一下，有命斯有財，命之不存，於財何有？淮南子說：『聖人不貴尺之璧而重寸之陰，時難得而易失也。』可是誰又能趁早體會到時間之『難得而易失』？時光不斷的在流轉，任誰也不能攀住它停留片刻。我們每天撕一張日曆，日曆越來越薄，快要撕完的時候，便不免矍然以驚，驚的是又臨歲晚。」下列選項何者最接近本文意旨？",["不可因貪財而浪費時間","應珍惜寶貴而易逝的光陰","時光流轉須知有捨才有得","時間是用生命與金錢換來"],"B"],[109,0,23,"承上題，依作者之意，下列選項正確的是：",["總在歲末才知時間不待人","捨命不捨財是徒然浪費時間","時間有如徑尺的璧玉一般珍貴","把握時間勤奮工作才能留住錢財"],"A"],[109,0,24,"孫中山先生：「什麼事叫做大事呢？大概地說，無論那一件事，只要從頭至尾徹底做成功，便是大事。」根據上文，下列何者最能體現「做大事」的旨意？",["死有重於泰山，輕於鴻毛","泰山在前而不見，疾雷破柱而不驚","泰山不讓土壤，故能成其大；河海不擇細流，故能就其深","譬如為山，未成一簣，止，吾止也；譬如平地，雖覆一簣，進，吾往也"],"D"],[109,0,25,"下列詩詞所表現的心境，那一選項與其他不同？",["老驥伏櫪，志在千里","記得少年曾學劍，壯心猶自憶廉頗","塞上長城空自許，鏡中衰鬢已先斑","老夫聊發少年狂，左牽黃，右擎蒼代號：1501頁次：4－3"],"C"],[109,0,26,"「春耕朗誦詩時，大雨滂沱。觀眾都穿著雨衣，站在雨中聽。詩句聲在大雨嘩嘩的節奏裡，也變成雨聲的一部分。朗讀者聽著自己的詩句，又好像更多時間是聽著雨聲、風聲。那樣的朗讀經驗很好，也許詩句本就應該在風聲、雨聲裡散去。山水自然的聲音才是永遠讀不完的詩句吧。」依據上文，何以作者會覺得那樣的朗讀經驗很好？",["觀眾在雨中聆聽的熱情，令人感動","朗誦時巧遇大雨，符合作品的內涵","自然的聲音飽含詩意，讀之不盡","詩句在風聲裡散去，讓人備覺空靈"],"C"],[109,0,27,"「我不要求你成為我的眷屬如同我厭煩成為你的局部，你不必放棄什麼即能獲得我的情誼，我亦有難言的頑固卻能被你呵護，我們積極相聚也毫不掙扎地品嘗捨離，遂把所能擁有的辰光化成分分秒秒的驚歎。」根據上文，下列何者最接近作者對愛情的態度？",["能夠保有自我","努力融入對方","彼此包容寬恕","相互扶持提攜"],"A"],[109,0,28,"「我浪費大半生的時間在他人身上。這回飛蛾不撲火了，飛蛾成了標本。母親轉成釘在我骨上的肉，稍一撕扯就痛徹心扉。母親是老小孩，女兒是小孩老。母親變女兒，輪迴就在眼前，不必等下一世。」依據上文，下列選項正確的是：",["「母親變女兒」是說母親仍保有童心","「女兒是小孩老」是指女兒少年老成","「我」認為照顧母親浪費許多的時間","「輪迴」指母親已衰老，需要女兒照顧"],"D"],[109,0,29,"現今職場上，必須具備多方技能。下列孔、孟言論，何者最符合這種精神？",["君子不器","多聞闕疑，慎言其餘","知之為知之，不知為不知，是知也","苦其心志，勞其筋骨，餓其體膚，空乏其身"],"A"],[109,0,30,"下列文句，具有鼓勵「終身學習」觀點的是：",["茍日新，日日新，又日新","學而不思則罔，思而不學則殆","惑而不從師，其為惑也終不解矣","吾生也有涯，而知也無涯；以有涯隨無涯，殆已"],"A"],[109,0,31,"「『落葉歸根』，來源可能是老子的『各歸其根』。從老子的觀點看，個體的死亡原是萬事萬物自然生滅循環的現象，是自然不過的。如果刻意抵制，只會增加死亡的恐懼與自我的痛苦；但如體悟自我的死亡乃如落葉歸根，是回歸天道的自然過程，也就自然能夠克服自我自私，安然接受死亡。」下列選項，最符合本文旨意的是：",["面對生命終結的生滅循環，無須畏懼","如果生命是一段旅程，死亡就是它的終點","自私自我之人將死之前，面對死亡不免恐懼","人不應恐懼死亡，應該恐懼的是從未真正活過"],"A"],[109,0,32,"「出航前，他知道自己會暈船，早自備好黑色塑膠袋。他特別選購黑色的，是因為這樣比較不會影響其他船客，避免大家看到嘔吐穢物，本來想吐的，會覺得更想吐；本來不想吐的，看到都想吐了。」下列選項，何者最接近文中「他」的想法？",["兵來將擋，水來土掩","嚴以律己，寬以待人","不見可欲，則心不亂","己所不欲，勿施於人"],"D"],[109,0,33,"中央政府主管機關為使當年全國已屆徵兵年齡之國民接受徵兵處理，會使用下列何種公文？",["函","令","公告","書函"],"C"],[109,0,34,"機關內部職員因育嬰需要，擬陳請機關首長同意其留職停薪時，應以下列那一種公文提出最適當？",["簽","報告","便箋","申請函"],"B"],[109,0,35,"下列有關公文的敘述，正確的是：",["紙本開會通知單發文時，應蓋機關大印及首長簽字章，始生效力","公告之格式為主旨、依據、公告事項，惟必要時，可加註機密等級","凡屬工作計畫、專題報告、各種報表之標題用語，不可加註標點符號","公文主旨段為全文摘要，說明行文目的與期望，應簡明扼要，字數多時可分項敘寫二、複選題（第36題至第45題，占30分）說明：每題3分，所列的五個選項，其中至少有二個是正確答案。各題之選項獨立判定，全部答對者，得3分；答錯一個選項者，得1.8分；答錯二個選項者，得0.6分；所有選項均未作答或答錯多於二個選項（不含二個）者，該題以零分計算。"],"C"],[109,0,36,"下列文句「」內的成語，使用正確的選項是：",["某明星夫妻「琴瑟不調」，打算離婚分產","同學們畢業後「雁行折翼」，各奔東西","東京「克紹箕裘」，繼里約之後承辦奧運","張家後代「蘭桂騰芳」，子孫都有好成就","王醫師為雙親賀壽，因「椿萱並茂」而感激上蒼"],"ADE"],[109,0,37,"下列對聯與場合的搭配，正確的選項是：",["匠心獨運，著手成春／花坊","一言九鼎，允諾千金／冶金業","隨時而動，不叩自鳴／鐘錶店","繼杜康事業，承太白遺風／酒館","平心觀世界，放手寫春秋／畫廊代號：1501頁次：4－4"],"ACD"],[109,0,38,"下列「」中詞語，前後意義相同的選項是：",["往者，豪強「大家」得管山海之利／唐宋八「大家」的古文成就是有目共睹的","是故能戴大員者履「大方」，鏡太清者視大明／她面試時表現得落落「大方」","三日斷五疋，「大人」故嫌遲。非爲織作遲，君家婦難爲／請容我跟家「大人」商量","親賢臣，遠「小人」，此先漢所以興隆也／這種過河拆橋的「小人」，最好保持距離","昔嘉量微物，盤盂「小器」，猶其昭德記功，載在銘典／領袖人物待人不宜太「小器」"],"CD"],[109,0,39,"「孔子在較遠的樹下，歪斜著睡了。他剛編纂完《春秋》，這個工作使他頭髮幾乎全白了，背也有點傴僂。他原來是壯碩的。在周遊列國的時候，僕僕風塵於旅途中，吃非常粗糙的乾糧，甚至斷過糧，也沒有舒適的地方歇息睡覺。在戰亂頻繁的時候，甚至要送掉性命。而此刻，他在睡夢中。有幾個孩子在遠處追逐。他夢到春天的沂水，兩岸都是青綠的銀杏樹。沂水裡泅泳的是子路，岸上彈琴的是曾晳。樹下有幾個無事的少年。『我能夠做什麼呢？』他在夢中深深的喟歎了。」下列選項，何者是作者所據以闡發的材料？",["吾少也賤，故多能鄙事","孔子遭厄於陳蔡之間，絕糧七日","孔子為兒嬉戲，常陳俎豆，設禮容","莫春者，春服既成。冠者五六人，童子六七人，浴乎沂，風乎舞雩，詠而歸","陳蔡大夫乃相與發徒役圍孔子於野。不得行，絕糧。從者病，莫能興。孔子講誦弦歌不衰"],"BDE"],[109,0,40,"「家貧出孝子」，諺語甚確。然孝子而家貧，其孝行必不能達于有司，并不能聞于里黨。予嘗留心博採，而樂道其事者絕少。表兄葛韶九曾述一市人，其父好飲，而憐其子貧，輒令減省。其子陰益之，不使父知。父臨飲陶然，亦遂不自覺其多少。事雖微，而充此即可以言孝。（《巢林筆談》）根據本文文意，敘述正確的選項是：",["家貧之人若經常飲酒作樂即為不孝","真正的孝順是使父親覺得快意滿足","作者認為勸止父親飲酒是孝順的行為","「家貧出孝子」的諺語符合於現實情況","鄰里之間總會流傳許多貧家孝子的事蹟"],"BD"],[109,0,41,"「我有時會想，寫作究竟是什麼樣的一種職業，社會如何容許一群人使用人類自造的一種符號體系，去編寫故事，並且從中牟利？而這個職業的人又是如何扭曲、打造、鎔鑄字詞的意義，得以讓另一個人閱讀到的那一刻，感到激盪、低迴，乃至於像是受刑？」關於本文意涵，下列選項何者正確？",["少數作家會顛倒是非，而從中獲利","閱讀過程中，可體驗各種複雜的感受","讀者須有責任感，方能維護社會秩序","作家必須自我警惕，不受商業市場的影響","作家會運用各種組合、詮釋文字的方式，豐富作品意蘊"],"BE"],[109,0,42,"王寂〈日暮倚杖水邊〉:「水國西風小搖落，撩人羈緒亂如絲。大夫澤畔行吟處，司馬江頭送別時。爾輩何傷吾道在，此心惟有彼蒼知。蒼顏華髮今如許，便掛衣冠已是遲。」詩中作者所抒發的感懷是：",["韶光的流逝","守道的執著","不遇的感慨","相思的愁苦","隱逸的恬適"],"ABC"],[109,0,43,"「請讓我生活在這一刻，讓我好好享用我的今天。在這一切之外，請讓我領略生命的卑微與尊貴。讓我知道，整個人類的生命就有如一件一直在琢磨著的藝術創作，在我之前早已有了開始，在我之後也不會停頓不會結束，而我的來臨我的存在卻是這漫長琢磨過程中必不可少的一點，我的每一種努力都會留下印記。」下列敘述，何者貼近作者對生命的體會？",["唯有享用今天的生命，才能領略生命的卑微","人類的生命是集體創作的藝術品，彌足珍貴","生命的尊貴，在於每一個體的努力都可以留下印記","個體生命短暫渺小，無法和整個人類生命相提並論","個體生命屬於人類全體，不可自專自決，而須全心奉獻社會"],"BC"],[109,0,44,"下列詩歌，表達出同情生產者辛苦勞動，所得待遇卻不公的選項是：",["昨日到城廓，歸來淚滿巾。遍身羅綺者，不是養蠶人","長安一片月，萬戶搗衣聲。秋風吹不盡，總是玉關情","春種一粒粟，秋收萬顆子。四海無閒田，農夫猶餓死","陶盡門前土，屋上無片瓦。十指不沾泥，鱗鱗居大廈","日暮蒼山遠，天寒白屋貧。柴門聞犬吠，風雪夜歸人"],"ACD"],[109,0,45,"「食品的出產過程，有待我們更多研判，以及提供可能的想像。看到喜歡的蔬果擺在眼前，我常驚喜如見翠玉珠寶，也常保持這種探險的狀態。從這一頭順藤摸瓜，回溯源頭，看到它最初的環境。我定調菜市場為地方生活資訊中心，但更視為展現生機和危機的生態環境現場。一處測試你生活價值的場域。時而歪頭沉思，皺眉蹙頭，恐
